<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت کاربران</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .toggle-checkbox:checked { right: 0; border-color: #10b981; }
        .toggle-checkbox:checked + .toggle-label { background-color: #10b981; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { width: 3rem; height: 1.5rem; background-color: #ef4444; border-radius: 9999px; transition: all 0.3s; }
        .toggle-checkbox:checked { transform: translateX(-1.5rem); }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen selection:bg-indigo-100">

    <div id="mainView" class="flex flex-col h-full fade-in">
        <div class="sticky top-0 z-20 bg-white/90 backdrop-blur-xl border-b border-slate-200/60 p-4 shadow-sm space-y-3">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-sm font-extrabold text-indigo-700">👥 پورتال مدیریت کاربران</h1>
                    <p class="text-[10px] text-slate-500 mt-0.5">لیست، ویرایش، عزل و افزودن کاربر</p>
                </div>
                <button onclick="openUserModal(null)" class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-2 rounded-xl active:scale-95 transition-transform flex items-center gap-1">
                    ➕ کاربر جدید
                </button>
            </div>
            
            <div class="relative">
                <span class="absolute inset-y-0 right-3 flex items-center text-slate-400">🔍</span>
                <input type="text" id="searchInput" onkeyup="renderUsers()" class="w-full bg-slate-100 border-none rounded-xl py-2 pr-9 pl-3 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-indigo-400 focus:bg-white transition-all placeholder-slate-400" placeholder="جستجو بر اساس نام یا شماره...">
            </div>
        </div>

        <div class="flex-grow overflow-y-auto p-4 pb-32">
            <div id="usersList" class="space-y-3"></div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg p-4 border-t border-slate-200/60 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
            <button onclick="showPreview()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-4 rounded-2xl text-sm shadow-lg shadow-indigo-200/50 transition-all active:scale-[0.98] flex justify-between items-center">
                <span>👁️ پیش‌نمایش تغییرات</span>
                <span id="changesCount" class="bg-white/20 px-2.5 py-0.5 rounded-lg text-xs">بدون تغییر</span>
            </button>
        </div>
    </div>

    <div id="previewView" class="hidden flex flex-col h-full bg-slate-100 fade-in">
        <div class="flex-grow overflow-y-auto p-5 space-y-4 pb-32">
            <div class="text-center mb-6 mt-4">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">📋</div>
                <h2 class="text-lg font-extrabold text-slate-800">تایید نهایی تغییرات</h2>
            </div>
            <div id="previewList" class="space-y-3"></div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white p-4 border-t border-slate-200 shadow-lg flex gap-3">
            <button onclick="hidePreview()" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold p-4 rounded-2xl text-sm active:scale-[0.98]">بازگشت</button>
            <button id="submitBtn" onclick="submitData()" class="w-2/3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold p-4 rounded-2xl text-sm shadow-lg shadow-teal-200/50 active:scale-[0.98]">📤 اعمال در سرور</button>
        </div>
    </div>

    <!-- MODAL -->
    <div id="userModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 fade-in">
        <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl overflow-y-auto max-h-[90vh]">
            <h3 id="modalTitle" class="text-sm font-extrabold text-slate-800 mb-4 flex items-center gap-2"><span id="modalIcon">✏️</span> <span id="modalTitleText">ویرایش کاربر</span></h3>
            
            <input type="hidden" id="m_original_id">
            
            <div class="space-y-4">
                <div class="flex gap-2">
                    <div class="w-1/3">
                        <label class="block text-[11px] font-bold text-slate-500 mb-1 ml-1">پیشوند</label>
                        <select id="m_prefix" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-indigo-700 focus:ring-2 focus:ring-indigo-400 outline-none appearance-none cursor-pointer">
                            <option value="آقای">آقای</option>
                            <option value="خانم">خانم</option>
                            <option value="آقای دکتر">آقای دکتر</option>
                            <option value="خانم دکتر">خانم دکتر</option>
                            <option value="استاد">استاد</option>
                            <option value="جناب آقای / سرکار خانم">عمومی</option>
                        </select>
                    </div>
                    <div class="w-2/3">
                        <label class="block text-[11px] font-bold text-slate-500 mb-1 ml-1">نام و نام خانوادگی</label>
                        <input type="text" id="m_name" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 focus:ring-2 focus:ring-indigo-400 outline-none">
                    </div>
                </div>
                
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1 ml-1">شماره موبایل (یا آیدی در بله)</label>
                    <input type="tel" id="m_phone" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 focus:ring-2 focus:ring-indigo-400 outline-none dir-ltr" placeholder="09...">
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1 ml-1">سمت سازمانی</label>
                    <select id="m_role" onchange="toggleGroupsView()" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-indigo-700 focus:ring-2 focus:ring-indigo-400 outline-none appearance-none cursor-pointer">
                        <option value="کارشناس گروه">کارشناس گروه</option>
                        <option value="مدیر آموزش">مدیر آموزش</option>
                        <option value="معاون آموزش دانشکده">معاون آموزش دانشکده</option>
                        <option value="ریاست دانشکده">ریاست دانشکده</option>
                        <option value="مدیر ارشد سامانه">مدیر ارشد سامانه</option>
                    </select>
                </div>

                <div id="groupsWrapper">
                    <label class="block text-[11px] font-bold text-slate-500 mb-1 ml-1">گروه‌های تحت پوشش (تیک بزنید)</label>
                    <div id="m_groups" class="max-h-32 overflow-y-auto bg-slate-50 p-2 border border-slate-200 rounded-xl space-y-1">
                        <!-- چک‌باکس گروه‌ها -->
                    </div>
                </div>

                <div id="statusWrapper" class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <div>
                        <p class="text-xs font-bold text-slate-700">وضعیت اکانت</p>
                        <p class="text-[9px] text-slate-400 mt-0.5" id="statusLabel">فعال (سبز) / مسدود (قرمز)</p>
                    </div>
                    <div class="relative inline-block w-12 h-6 align-middle select-none">
                        <input type="checkbox" id="m_status" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer m-0 p-0"/>
                        <label for="m_status" class="toggle-label block overflow-hidden h-6 rounded-full cursor-pointer"></label>
                    </div>
                </div>
            </div>
            
            <div class="mt-6 flex gap-3">
                <button onclick="closeModal()" class="w-1/3 bg-slate-100 text-slate-600 font-bold p-3 rounded-xl text-sm active:scale-95">انصراف</button>
                <button onclick="saveModal()" class="w-2/3 bg-indigo-600 text-white font-bold p-3 rounded-xl text-sm active:scale-95">💾 ذخیره موقت</button>
            </div>
        </div>
    </div>

    <!-- Handover / Delete Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 fade-in">
        <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl">
            <h3 class="text-sm font-extrabold text-slate-800 mb-2">🗑 عزل و انتقال پست</h3>
            <p class="text-xs text-slate-500 mb-5 leading-relaxed">لطفاً یکی از روش‌های حذف را برای <span id="delUserName" class="font-bold text-indigo-600"></span> انتخاب کنید:</p>
            
            <input type="hidden" id="delUserId">

            <div class="space-y-3">
                <button onclick="confirmArchive()" class="w-full text-right bg-amber-50 border border-amber-200 p-3 rounded-xl hover:bg-amber-100 transition-colors">
                    <p class="text-sm font-bold text-amber-700">📦 عزل و بایگانی اطلاعات (استاندارد)</p>
                    <p class="text-[10px] text-amber-600 mt-1">شماره موبایل شخص آزاد می‌شود اما تاریخچه کارهای قبلی او در سیستم حفظ می‌گردد. (جهت جلوگیری از جعل اسناد)</p>
                </button>

                <button onclick="confirmHardDelete()" class="w-full text-right bg-rose-50 border border-rose-200 p-3 rounded-xl hover:bg-rose-100 transition-colors">
                    <p class="text-sm font-bold text-rose-700">💥 حذف فیزیکی کامل (تستی)</p>
                    <p class="text-[10px] text-rose-600 mt-1">تمام ردپای این شخص از دیتابیس پاک می‌شود. (فقط برای اکانت‌هایی که اشتباهی ثبت‌نام کرده‌اند استفاده کنید)</p>
                </button>
            </div>

            <div class="mt-5">
                <button onclick="closeDeleteModal()" class="w-full bg-slate-100 text-slate-600 font-bold p-3 rounded-xl text-sm active:scale-95">انصراف</button>
            </div>
        </div>
    </div>

    <script>
        let db_users = []; 
        let db_groups = [];
        let new_users = []; 
        let edited_users = {}; 
        let archived_users = []; // آرایه شناسه‌های بایگانی شده
        let hard_deleted_users = []; // آرایه شناسه‌های حذف فیزیکی

        function showAlert(msg, type = 'error') {
            const existing = document.getElementById('customAlert');
            if(existing) existing.remove();
            const bgClass = type === 'error' ? 'bg-rose-600' : 'bg-emerald-600';
            const alertBox = document.createElement('div');
            alertBox.id = 'customAlert';
            alertBox.className = `fixed top-6 left-1/2 -translate-x-1/2 ${bgClass} text-white px-5 py-3 rounded-2xl shadow-2xl z-[100] text-sm font-bold text-center w-11/12 max-w-sm slide-up`;
            alertBox.innerText = msg;
            document.body.appendChild(alertBox);
            setTimeout(() => { if(document.getElementById('customAlert')) document.getElementById('customAlert').remove(); }, 3000);
        }

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                if (compressedData) {
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    const data = JSON.parse(decompressed);
                    db_users = data.u || [];
                    db_groups = data.g || [];
                }
                renderUsers();
            } catch(e) { 
                console.error(e); 
                showAlert("خطا در بارگذاری اطلاعات از سرور.");
            }
        }

        function getUserDisplayData(u_id, is_new=false) {
            if (is_new) return new_users.find(x => x.id === u_id);
            if (edited_users[u_id]) return edited_users[u_id];
            const raw = db_users.find(x => String(x[0]) === String(u_id));
            if (raw) return { id: raw[0], phone: raw[1], name: raw[2], role: raw[3], groups: raw[4], status: raw[5], prefix: raw[6] || 'جناب آقای / سرکار خانم' };
            return null;
        }

        function renderUsers() {
            try {
                const filter = document.getElementById('searchInput').value.toLowerCase();
                const container = document.getElementById('usersList');
                container.innerHTML = '';
                
                new_users.forEach(u => {
                    if (filter && !u.name.toLowerCase().includes(filter) && !u.phone.includes(filter)) return;
                    container.innerHTML += createUserCard(u, true);
                });

                db_users.forEach(raw => {
                    const u_id = String(raw[0]);
                    if (archived_users.includes(u_id) || hard_deleted_users.includes(u_id)) return; // اگر حذف شده نشان نده
                    
                    const u = edited_users[u_id] || { id: raw[0], phone: raw[1], name: raw[2], role: raw[3], groups: raw[4], status: raw[5], prefix: raw[6] || 'جناب آقای / سرکار خانم' };
                    if (filter && !u.name.toLowerCase().includes(filter) && !String(u.phone).includes(filter)) return;
                    container.innerHTML += createUserCard(u, false, !!edited_users[u_id]);
                });

                updateChangesCount();
            } catch (e) {
                showAlert("خطا در رندر لیست: " + e.message);
            }
        }

        function createUserCard(u, isNew, isEdited) {
            let badge = '';
            let bg = 'bg-white';
            if (isNew) { badge = '<span class="bg-emerald-100 text-emerald-600 text-[9px] px-2 py-0.5 rounded-md">جدید</span>'; bg = 'bg-emerald-50/30 border-emerald-100'; }
            else if (isEdited) { badge = '<span class="bg-amber-100 text-amber-600 text-[9px] px-2 py-0.5 rounded-md">ویرایش شده</span>'; bg = 'bg-amber-50/30 border-amber-100'; }
            
            const statusIcon = u.status === 'active' ? '🟢' : '🔴';
            const grpStr = u.groups || "نامشخص";
            const groupTruncate = grpStr.length > 25 ? grpStr.substring(0,25) + '...' : grpStr;
            const prefixStr = u.prefix === 'جناب آقای / سرکار خانم' ? '' : u.prefix + ' ';

            let delBtn = '';
            if (!isNew) {
                delBtn = `<button onclick="openDeleteModal('${u.id}', '${u.name}')" class="w-8 h-8 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center text-xs hover:bg-rose-100 transition-colors">🗑</button>`;
            } else {
                delBtn = `<button onclick="cancelNewUser('${u.id}')" class="w-8 h-8 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center text-xs hover:bg-rose-100 transition-colors">🗑</button>`;
            }

            return `
                <div class="${bg} p-3.5 rounded-2xl shadow-sm border border-slate-100 slide-up hover:shadow-md transition-all">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm font-extrabold text-slate-800">${statusIcon} ${prefixStr}${u.name} ${badge}</p>
                            <p class="text-[11px] font-bold text-slate-500 mt-1">📱 ${u.phone} | 🔰 ${u.role}</p>
                            <p class="text-[10px] text-slate-400 mt-0.5">📚 ${groupTruncate}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openUserModal('${u.id}', ${isNew})" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-xs hover:bg-slate-200">✏️</button>
                            ${delBtn}
                        </div>
                    </div>
                </div>
            `;
        }

        function cancelNewUser(id) {
            new_users = new_users.filter(u => u.id !== id);
            renderUsers();
            showAlert("کاربر جدید لغو شد.", "success");
        }

        function openDeleteModal(id, name) {
            document.getElementById('delUserId').value = id;
            document.getElementById('delUserName').innerText = name;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
        }

        function confirmArchive() {
            const id = document.getElementById('delUserId').value;
            archived_users.push(id);
            if (edited_users[id]) delete edited_users[id];
            closeDeleteModal();
            renderUsers();
            showAlert("📦 کاربر عزل و بایگانی شد.", "success");
        }

        function confirmHardDelete() {
            const id = document.getElementById('delUserId').value;
            hard_deleted_users.push(id);
            if (edited_users[id]) delete edited_users[id];
            closeDeleteModal();
            renderUsers();
            showAlert("💥 کاربر به صورت فیزیکی حذف شد.", "success");
        }

        function toggleGroupsView() {
            const role = document.getElementById('m_role').value;
            const wrap = document.getElementById('groupsWrapper');
            if (role === 'کارشناس گروه') wrap.classList.remove('hidden');
            else wrap.classList.add('hidden');
        }

        function openUserModal(u_id, isNew=false) {
            try {
                const container = document.getElementById('m_groups');
                container.innerHTML = '';
                
                let u = null;
                if (u_id) u = getUserDisplayData(u_id, isNew);

                let selectedGrps = u && u.groups ? String(u.groups).split(',').map(s=>s.trim()) : [];
                db_groups.forEach(g => {
                    let chk = selectedGrps.includes(g) ? 'checked' : '';
                    container.innerHTML += `
                        <label class="flex items-center gap-2 p-1.5 hover:bg-slate-100 rounded-lg cursor-pointer">
                            <input type="checkbox" value="${g}" class="grp-check w-3.5 h-3.5 text-indigo-600 rounded" ${chk}>
                            <span class="text-xs font-bold text-slate-700">${g}</span>
                        </label>
                    `;
                });

                if (u) {
                    document.getElementById('modalTitleText').innerText = 'ویرایش کاربر';
                    document.getElementById('modalIcon').innerText = '✏️';
                    document.getElementById('m_original_id').value = isNew ? `NEW_${u.id}` : u.id;
                    document.getElementById('m_name').value = u.name || "";
                    document.getElementById('m_phone').value = u.phone || "";
                    document.getElementById('m_role').value = u.role || "کارشناس گروه";
                    document.getElementById('m_prefix').value = u.prefix || "جناب آقای / سرکار خانم";
                    document.getElementById('m_status').checked = (u.status === 'active');
                    document.getElementById('statusWrapper').classList.remove('hidden');
                } else {
                    document.getElementById('modalTitleText').innerText = 'افزودن کاربر جدید';
                    document.getElementById('modalIcon').innerText = '➕';
                    document.getElementById('m_original_id').value = 'NEW_';
                    document.getElementById('m_name').value = '';
                    document.getElementById('m_phone').value = '';
                    document.getElementById('m_role').value = 'کارشناس گروه';
                    document.getElementById('m_prefix').value = 'آقای';
                    document.getElementById('m_status').checked = true;
                    document.getElementById('statusWrapper').classList.add('hidden');
                }

                toggleGroupsView();
                document.getElementById('userModal').classList.remove('hidden');
            } catch (e) {
                showAlert("خطا در باز کردن فرم ویرایش: " + e.message);
            }
        }

        function closeModal() {
            document.getElementById('userModal').classList.add('hidden');
        }

        function saveModal() {
            try {
                const rawId = document.getElementById('m_original_id').value;
                const name = document.getElementById('m_name').value.trim();
                const phone = document.getElementById('m_phone').value.trim();
                const role = document.getElementById('m_role').value;
                const prefix = document.getElementById('m_prefix').value;
                const isActive = document.getElementById('m_status').checked;
                const status = isActive ? 'active' : 'suspended';
                
                if (!name || !phone) { showAlert("نام و شماره الزامی است."); return; }
                if (phone.length < 5) { showAlert("شماره/آیدی وارد شده نامعتبر است."); return; }

                let groups = "همه گروه‌ها";
                if (role === 'کارشناس گروه') {
                    const checks = document.querySelectorAll('.grp-check:checked');
                    const grps = Array.from(checks).map(c => c.value);
                    if (grps.length === 0) { showAlert("حداقل باید یک گروه آموزشی برای کارشناس تیک بزنید."); return; }
                    groups = grps.join(', ');
                }

                const userData = { id: phone, phone: phone, name: name, role: role, groups: groups, status: status, prefix: prefix };

                if (rawId.startsWith('NEW_')) {
                    let realId = rawId.replace('NEW_', '');
                    if (realId) {
                        const idx = new_users.findIndex(x => String(x.id) === String(realId));
                        if (idx > -1) {
                            userData.id = phone; 
                            new_users[idx] = userData;
                        }
                    } else {
                        if (db_users.find(x => String(x[1]) === phone)) { showAlert("این شماره قبلاً در دیتابیس سامانه ثبت شده است."); return; }
                        if (new_users.find(x => String(x.phone) === phone)) { showAlert("این کاربر در لیست جدیدها موجود است."); return; }
                        new_users.push(userData);
                    }
                } else {
                    userData.id = rawId; 
                    edited_users[rawId] = userData;
                }

                closeModal();
                renderUsers();
                showAlert("✅ تغییرات موقتاً ذخیره شد.", "success");
            } catch(e) {
                showAlert("خطای سیستمی: " + e.message);
            }
        }

        function updateChangesCount() {
            const total = new_users.length + Object.keys(edited_users).length + archived_users.length + hard_deleted_users.length;
            const badge = document.getElementById('changesCount');
            if (total > 0) {
                badge.innerText = `${total} تغییر ذخیره نشده`;
                badge.className = "bg-rose-500 text-white px-2.5 py-0.5 rounded-lg text-xs font-bold animate-pulse";
            } else {
                badge.innerText = `بدون تغییر`;
                badge.className = "bg-white/20 px-2.5 py-0.5 rounded-lg text-xs";
            }
        }

        function showPreview() {
            const total = new_users.length + Object.keys(edited_users).length + archived_users.length + hard_deleted_users.length;
            if (total === 0) { showAlert("هیچ تغییری برای اعمال وجود ندارد."); return; }

            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('previewView').classList.remove('hidden');

            const container = document.getElementById('previewList');
            container.innerHTML = '';

            new_users.forEach(u => {
                const prefixStr = u.prefix === 'جناب آقای / سرکار خانم' ? '' : u.prefix + ' ';
                container.innerHTML += `
                    <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl slide-up">
                        <p class="text-xs font-bold text-emerald-700">➕ افزوده می‌شود:</p>
                        <p class="text-sm font-extrabold mt-1 text-slate-800">${prefixStr}${u.name} <span class="text-xs text-slate-500 font-normal">(${u.role})</span></p>
                    </div>
                `;
            });

            Object.values(edited_users).forEach(u => {
                const isSuspended = u.status === 'suspended';
                const prefixStr = u.prefix === 'جناب آقای / سرکار خانم' ? '' : u.prefix + ' ';
                container.innerHTML += `
                    <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl slide-up">
                        <p class="text-xs font-bold text-amber-700">✏️ ${isSuspended ? 'تعلیق/ویرایش' : 'ویرایش'} می‌شود:</p>
                        <p class="text-sm font-extrabold mt-1 text-slate-800">${prefixStr}${u.name} <span class="text-xs ${isSuspended ? 'text-rose-500 font-bold' : 'text-slate-500 font-normal'}">(${isSuspended ? 'مسدود' : u.role})</span></p>
                    </div>
                `;
            });

            archived_users.forEach(id => {
                const u = db_users.find(x => String(x[0]) === id);
                if(u) {
                    container.innerHTML += `
                        <div class="bg-orange-50 border border-orange-200 p-3 rounded-xl slide-up">
                            <p class="text-xs font-bold text-orange-700">📦 عزل و بایگانی می‌شود (حفظ تاریخچه):</p>
                            <p class="text-sm font-extrabold mt-1 text-slate-800">${u[2]}</p>
                        </div>
                    `;
                }
            });

            hard_deleted_users.forEach(id => {
                const u = db_users.find(x => String(x[0]) === id);
                if(u) {
                    container.innerHTML += `
                        <div class="bg-rose-50 border border-rose-200 p-3 rounded-xl slide-up">
                            <p class="text-xs font-bold text-rose-700">💥 حذف فیزیکی می‌شود (بدون بازگشت):</p>
                            <p class="text-sm font-extrabold mt-1 text-slate-800">${u[2]}</p>
                        </div>
                    `;
                }
            });
        }

        function hidePreview() {
            document.getElementById('previewView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
        }

        window.Bale.WebApp.ready();

        function submitData() {
            try {
                const btn = document.getElementById('submitBtn');
                btn.innerHTML = '⏳ در حال ارسال...';
                btn.classList.add('opacity-90', 'cursor-wait');

                const payload = {
                    action: "submit_manage_users",
                    new_users: new_users,
                    edited_users: Object.values(edited_users),
                    archived_users: archived_users,
                    hard_deleted_users: hard_deleted_users
                };

                window.Bale.WebApp.sendData(JSON.stringify(payload));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                showAlert("خطا در ارتباط با سرور بله.");
                const btn = document.getElementById('submitBtn');
                btn.innerHTML = '📤 اعمال در سرور';
                btn.classList.remove('opacity-90', 'cursor-wait');
            }
        }

        init();
    </script>
</body>
</html>
