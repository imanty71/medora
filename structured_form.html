<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>فرم اطلاعات</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://tapi.bale.ai/miniapp.js?3"></script><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>body{font-family:Vazirmatn,sans-serif;background:#020617;color:#e2e8f0}.card{background:linear-gradient(145deg,rgba(15,23,42,.84),rgba(2,6,23,.92));border:1px solid rgba(148,163,184,.12);backdrop-filter:blur(20px)}.inp{background:rgba(15,23,42,.72);border:1px solid rgba(148,163,184,.16)}.inp:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}.fade{animation:fade .2s ease}@keyframes fade{from{opacity:.2;transform:translateY(7px)}to{opacity:1;transform:none}}</style>
</head>
<body class="min-h-screen pb-28">
<div class="fixed -z-10 inset-0 overflow-hidden"><div class="absolute -top-20 -right-20 w-80 h-80 bg-blue-600/20 blur-[110px] rounded-full"></div><div class="absolute bottom-0 -left-24 w-96 h-96 bg-cyan-500/10 blur-[120px] rounded-full"></div></div>
<header class="sticky top-0 z-20 bg-slate-950/85 backdrop-blur-2xl border-b border-white/[.06] p-4"><h1 id="title" class="text-sm font-black text-white">فرم</h1><p id="desc" class="text-[10px] text-slate-400 mt-1 leading-5"></p><div class="mt-2 text-[9px] text-blue-300 font-bold" id="group"></div></header>
<main id="fields" class="p-4 space-y-3 max-w-2xl mx-auto"></main>
<footer class="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-2xl border-t border-white/[.06] p-3"><div class="max-w-2xl mx-auto"><button onclick="submitForm()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-black text-xs p-4 rounded-2xl shadow-lg">✅ بررسی و ثبت نهایی فرم</button></div></footer>
<script>
const qs=new URLSearchParams(location.search);const rId=+(qs.get('r_id')||0);let data={fields:[],answers:{}};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function init(){try{const p=qs.get('d');if(p){const b=atob(p.replace(/-/g,'+').replace(/_/g,'/'));const a=Uint8Array.from(b,c=>c.charCodeAt(0));data=JSON.parse(pako.inflate(a,{to:'string'}));}}catch(e){console.error(e)}document.getElementById('title').innerText=data.title||'فرم اطلاعات';document.getElementById('desc').innerText=data.description||'';document.getElementById('group').innerText=data.group?`ثبت برای گروه: ${data.group}`:'';render();window.Bale.WebApp.ready()}
function render(){const box=document.getElementById('fields');box.innerHTML='';(data.fields||[]).forEach((f,i)=>{if(f.type==='section'){box.innerHTML+=`<div class="pt-3 pb-1"><h2 class="text-xs font-black text-blue-300">${esc(f.label)}</h2><div class="h-px bg-blue-400/20 mt-2"></div></div>`;return}const req=f.required?'<span class="text-rose-400">*</span>':'<span class="text-slate-500 text-[9px]">اختیاری</span>';const val=data.answers?.[f.id]??'';box.innerHTML+=`<div class="card rounded-3xl p-4 fade"><label class="text-[11px] font-black text-slate-200 block mb-2">${esc(f.label)} ${req}</label>${inputHtml(f,val)}</div>`})}
function inputHtml(f,val){const id='f_'+f.id,cls='inp w-full rounded-2xl p-3 text-xs font-bold text-slate-100';if(f.type==='textarea')return `<textarea id="${id}" rows="4" class="${cls} resize-none">${esc(val)}</textarea>`;if(['choice','select'].includes(f.type)){const opts=(f.options||[]).map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?'selected':''}>${esc(o)}</option>`).join('');return `<select id="${id}" class="${cls}"><option value="">انتخاب کنید...</option>${opts}</select>`}if(f.type==='checkbox'){let cur=[];try{cur=Array.isArray(val)?val:JSON.parse(val||'[]')}catch(e){}return `<div id="${id}" class="space-y-2">${(f.options||[]).map(o=>`<label class="inp rounded-xl p-2.5 flex gap-2 items-center text-[10px] font-bold"><input type="checkbox" value="${esc(o)}" ${cur.includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`}if(f.type==='yesno')return `<select id="${id}" class="${cls}"><option value="">انتخاب کنید...</option><option ${val==='بله'?'selected':''}>بله</option><option ${val==='خیر'?'selected':''}>خیر</option></select>`;let typ='text',mode='text';if(f.type==='number'){typ='number';mode='decimal'}else if(f.type==='phone'){typ='tel';mode='tel'}else if(f.type==='nid'){typ='tel';mode='numeric'}else if(f.type==='email'){typ='email';mode='email'}else if(f.type==='date'){typ='date'}else if(f.type==='time'){typ='time'}return `<input id="${id}" type="${typ}" inputmode="${mode}" value="${esc(val)}" class="${cls}">`}
function getVal(f){const el=document.getElementById('f_'+f.id);if(f.type==='checkbox')return [...el.querySelectorAll('input:checked')].map(x=>x.value);return (el?.value??'').trim()}
function submitForm(){const ans={};for(const f of data.fields||[]){if(f.type==='section')continue;const v=getVal(f);if(f.required&&(v===''||(Array.isArray(v)&&!v.length))){alert(`لطفاً فیلد «${f.label}» را تکمیل کنید.`);return}if(f.type==='phone'&&v&&!/^0?9\d{9}$/.test(v.replace(/\s|-/g,''))){alert(`شماره موبایل «${f.label}» معتبر نیست.`);return}if(f.type==='nid'&&v&&!/^\d{10}$/.test(v)){alert(`کد ملی «${f.label}» باید ۱۰ رقم باشد.`);return}ans[f.id]=v}window.Bale.WebApp.sendData(JSON.stringify({action:'submit_structured_form',r_id:rId,answers:ans}))}
init();
</script></body></html>
