<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>داشبورد کلان دستیاران و پایان‌نامه‌ها</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen selection:bg-indigo-100">

    <div class="sticky top-0 z-20 bg-white/90 backdrop-blur-xl border-b border-slate-200/60 shadow-sm">
        <div class="p-4 text-center">
            <h1 class="text-sm font-extrabold text-indigo-700" id="dashTitle">🏛 پورتال دستیاران و وضعیت پایان‌نامه‌ها</h1>
            <p class="text-[11px] text-slate-500 mt-1" id="dashSubtitle">آمار، وضعیت پایان‌نامه‌ها و جستجوی جامع</p>
        </div>
        
        <div class="flex px-4 pb-3 gap-3">
            <button onclick="switchTab('stats')" id="tab_stats" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-200 transition-all">📊 آمار و مقایسه</button>
            <button onclick="switchTab('list')" id="tab_list" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-slate-100 text-slate-500 transition-all">👥 لیست دستیاران</button>
        </div>
    </div>

    <div class="flex-grow overflow-y-auto p-4 pb-28">
        <div id="view_stats" class="space-y-4 fade-in">
            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-3xl p-5 text-white shadow-lg shadow-indigo-200 flex justify-between items-center">
                <div>
                    <p class="text-xs font-medium opacity-80" id="totalLabel">کل دستیاران فعال دانشکده</p>
                    <p class="text-3xl font-black mt-1" id="stat_total">0</p>
                </div>
                <div class="text-5xl opacity-50">🎓</div>
            </div>

            <!-- آمار اختصاصی وضعیت پایان‌نامه‌ها -->
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="text-xs font-black text-slate-700 mb-4 flex items-center gap-2">
                    <span class="text-indigo-500">📜</span> آمار پایان‌نامه‌های دانشکده
                </h3>
                <div id="stat_theses" class="space-y-3"></div>
            </div>

            <div id="stat_groups_container" class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="text-xs font-black text-slate-700 mb-4 flex items-center gap-2"><span class="text-indigo-500">📁</span> مقایسه دپارتمان‌ها</h3>
                <div id="stat_groups" class="space-y-3"></div>
            </div>

            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-4">
                <h3 class="text-xs font-black text-slate-700 mb-4 flex items-center gap-2"><span class="text-indigo-500">🎓</span> مقایسه سال تحصیلی</h3>
                <div id="stat_years" class="space-y-3"></div>
            </div>
        </div>

        <div id="view_list" class="hidden space-y-4 fade-in">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                <div class="relative">
                    <span class="absolute inset-y-0 right-3 flex items-center text-slate-400">🔍</span>
                    <input type="text" id="searchInput" onkeyup="renderList()" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pr-9 pl-3 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-indigo-400 outline-none" placeholder="جستجوی نام دستیار...">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="filterGroup" onchange="renderList()" class="bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold text-slate-700 outline-none">
                        <option value="all">همه گروه‌ها</option>
                    </select>
                    <select id="filterYear" onchange="renderList()" class="bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold text-slate-700 outline-none">
                        <option value="all">همه سال‌ها</option>
                        <option value="سال ۱">سال ۱ (R1)</option>
                        <option value="سال ۲">سال ۲ (R2)</option>
                        <option value="سال ۳">سال ۳ (R3)</option>
                        <option value="سال ۴">سال ۴ (R4)</option>
                        <option value="سال ۵">سال ۵ (R5)</option>
                    </select>
                </div>
                <div>
                    <select id="filterThesis" onchange="renderList()" class="w-full bg-indigo-50/50 border border-indigo-200 rounded-xl p-2.5 text-xs font-bold text-indigo-700 outline-none">
                        <option value="all">📜 تمام وضعیت‌های پایان‌نامه</option>
                        <option value="بدون عملکرد">بدون عملکرد</option>
                        <option value="تک برگ">تک برگ</option>
                        <option value="ثبت پروپوزال">ثبت پروپوزال</option>
                        <option value="پروسه دفاع">پروسه دفاع</option>
                        <option value="دفاع شده">دفاع شده</option>
                    </select>
                </div>
            </div>

            <div id="membersList" class="space-y-2"></div>
        </div>
    </div>

    <!-- Admin Edit Modal (بازگردانی مدال ویرایش مشخصات دستیار برای مدیر ارشد) -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 fade-in">
        <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl slide-up">
            <h3 class="text-sm font-extrabold text-slate-800 mb-4 flex items-center gap-2">✏️ ویرایش مشخصات دستیار</h3>
            <input type="hidden" id="m_id">
            <div class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1 ml-1">نام و نام خانوادگی</label>
                    <input type="text" id="m_name" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 focus:ring-2 focus:ring-indigo-400 outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1 ml-1">گروه آموزشی</label>
                    <select id="m_group" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-indigo-700 outline-none appearance-none"></select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1 ml-1">سال تحصیلی</label>
                    <select id="m_year" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-indigo-700 outline-none appearance-none">
                        <option value="سال ۱">سال ۱ (R1)</option>
                        <option value="سال ۲">سال ۲ (R2)</option>
                        <option value="سال ۳">سال ۳ (R3)</option>
                        <option value="سال ۴">سال ۴ (R4)</option>
                        <option value="سال ۵">سال ۵ (R5)</option>
                    </select>
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="closeEditModal()" class="w-1/3 bg-slate-100 text-slate-600 font-bold p-3 rounded-xl text-sm active:scale-95">انصراف</button>
                <button onclick="saveEditLocally()" class="w-2/3 bg-indigo-600 text-white font-bold p-3 rounded-xl text-sm active:scale-95">💾 ذخیره موقت</button>
            </div>
        </div>
    </div>

    <!-- Exclusive Thesis Edit Modal (منحصراً برای کارشناس پژوهش) -->
    <div id="thesisModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 fade-in">
        <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl slide-up">
            <h3 class="text-sm font-extrabold text-slate-800 mb-1 flex items-center gap-2">📜 تعیین وضعیت پایان‌نامه</h3>
            <p class="text-xs font-bold text-indigo-600 mb-4" id="tm_resident_name">دستیار</p>
            <input type="hidden" id="tm_id">
            
            <div class="space-y-3">
                <label class="block text-[11px] font-bold text-slate-500 ml-1">وضعیت پایان‌نامه را انتخاب کنید:</label>
                <select id="tm_status" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-indigo-700 focus:ring-2 focus:ring-indigo-400 outline-none cursor-pointer">
                    <option value="بدون عملکرد">⚪️ بدون عملکرد</option>
                    <option value="تک برگ">📄 تک برگ</option>
                    <option value="ثبت پروپوزال">📑 ثبت پروپوزال</option>
                    <option value="پروسه دفاع">⏳ پروسه دفاع</option>
                    <option value="دفاع شده">🎓 دفاع شده</option>
                </select>
            </div>
            
            <div class="mt-6 flex gap-3">
                <button onclick="closeThesisModal()" class="w-1/3 bg-slate-100 text-slate-600 font-bold p-3 rounded-xl text-sm active:scale-95">انصراف</button>
                <button onclick="saveThesisLocally()" class="w-2/3 bg-indigo-600 text-white font-bold p-3 rounded-xl text-sm active:scale-95">💾 ذخیره موقت</button>
            </div>
        </div>
    </div>

    <!-- Footer Buttons (شامل دکمه اعمال تغییرات دستیاران برای مدیر و دکمه ثبت پایان‌نامه برای پژوهش) -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg p-4 border-t border-slate-200/60 shadow-lg flex gap-3 z-30">
        <button id="backBtn" onclick="closeApp()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold p-3.5 rounded-2xl text-sm transition-all active:scale-[0.98]">
            🔙 بازگشت به ربات
        </button>
        <button id="submitBtn" onclick="submitData()" class="w-2/3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold p-3.5 rounded-2xl text-sm shadow-lg shadow-teal-200/50 transition-all active:scale-[0.98] flex justify-between items-center hidden">
            <span>📤 اعمال تغییرات دستیاران</span>
            <span id="changesCount" class="bg-white/20 px-2 py-0.5 rounded-lg text-xs">0</span>
        </button>
        <button id="submitThesisBtn" onclick="submitThesisData()" class="w-2/3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold p-3.5 rounded-2xl text-sm shadow-lg shadow-indigo-200/50 transition-all active:scale-[0.98] flex justify-between items-center hidden">
            <span>📤 ثبت پایان‌نامه‌ها</span>
            <span id="thesisChangesCount" class="bg-white/20 px-2 py-0.5 rounded-lg text-xs">0</span>
        </button>
    </div>

    <script>
        let db_members = []; 
        let db_groups = [];
        let isAdmin = 0;
        let isResearch = 0;
        let isLocal = "";
        
        let edited_theses = {}; // key: id, value: new_status

        const THESIS_COLORS = {
            'بدون عملکرد': { bg: 'bg-slate-100', text: 'text-slate-600', border: 'border-slate-200', icon: '⚪️' },
            'تک برگ': { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', icon: '📄' },
            'ثبت پروپوزال': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', icon: '📑' },
            'پروسه دفاع': { bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200', icon: '⏳' },
            'دفاع شده': { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', icon: '🎓' }
        };

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                if (compressedData) {
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    const data = JSON.parse(decompressed);
                    db_members = data.m || [];
                    db_groups = data.g || [];
                    isAdmin = data.a || 0;
                    isResearch = data.res || 0;
                    isLocal = data.local || "";
                }
                
                const grpSelect = document.getElementById('filterGroup');
                db_groups.forEach(g => {
                    grpSelect.innerHTML += `<option value="${g}">${g}</option>`;
                });

                if (isResearch === 1) {
                    document.getElementById('dashTitle').innerText = "🎓 کارتابل پایش پایان‌نامه دستیاران";
                    document.getElementById('dashSubtitle').innerText = "ثبت و تعیین وضعیت پایان‌نامه‌ها (اختصاصی پژوهش)";
                } else if (isLocal) {
                    document.getElementById('dashTitle').innerText = `آرشیو دستیاران دپارتمان ${isLocal}`;
                    document.getElementById('stat_groups_container').classList.add('hidden');
                    document.getElementById('filterGroup').classList.add('hidden');
                }

                renderStats();
                renderList();
            } catch(e) { 
                console.error(e); 
                alert("خطا در بازخوانی اطلاعات دستیاران.");
            }
        }

        function switchTab(tab) {
            document.getElementById('view_stats').classList.add('hidden');
            document.getElementById('view_list').classList.add('hidden');
            
            document.getElementById('tab_stats').className = "flex-1 py-2.5 text-xs font-bold rounded-xl bg-slate-100 text-slate-500 transition-all";
            document.getElementById('tab_list').className = "flex-1 py-2.5 text-xs font-bold rounded-xl bg-slate-100 text-slate-500 transition-all";
            
            document.getElementById(`view_${tab}`).classList.remove('hidden');
            if(tab === 'stats') {
                document.getElementById('tab_stats').className = "flex-1 py-2.5 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-200 transition-all";
            } else {
                document.getElementById('tab_list').className = "flex-1 py-2.5 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-200 transition-all";
            }
        }

        function renderStats() {
            document.getElementById('stat_total').innerText = db_members.length;

            // ۱. آمار پایان‌نامه‌ها
            const thesisCounts = { 'بدون عملکرد': 0, 'تک برگ': 0, 'ثبت پروپوزال': 0, 'پروسه دفاع': 0, 'دفاع شده': 0 };
            db_members.forEach(m => {
                const t = edited_theses[m[0]] || m[4] || 'بدون عملکرد';
                if (thesisCounts[t] !== undefined) thesisCounts[t]++;
                else thesisCounts['بدون عملکرد']++;
            });

            let maxThesis = Math.max(...Object.values(thesisCounts), 1);
            let thesisHtml = '';
            Object.entries(thesisCounts).forEach(([st, cnt]) => {
                const conf = THESIS_COLORS[st] || THESIS_COLORS['بدون عملکرد'];
                const percent = (cnt / maxThesis) * 100;
                thesisHtml += `
                    <div>
                        <div class="flex justify-between text-xs font-bold text-slate-700 mb-1">
                            <span>${conf.icon} ${st}</span>
                            <span>${cnt} نفر</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-2">
                            <div class="h-2 rounded-full ${conf.bg.replace('50', '500')}" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('stat_theses').innerHTML = thesisHtml;

            // ۲. آمار دپارتمان‌ها
            if (!isLocal) {
                const grpCounts = {};
                db_groups.forEach(g => grpCounts[g] = 0);
                db_members.forEach(m => { if(grpCounts[m[2]] !== undefined) grpCounts[m[2]]++; });
                
                let maxGrp = Math.max(...Object.values(grpCounts), 1);
                let grpHtml = '';
                Object.entries(grpCounts).sort((a,b) => b[1] - a[1]).forEach(([g, count]) => {
                    const percent = (count / maxGrp) * 100;
                    grpHtml += `
                        <div>
                            <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
                                <span>${g}</span>
                                <span>${count} نفر</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2">
                                <div class="bg-indigo-500 h-2 rounded-full" style="width: ${percent}%"></div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('stat_groups').innerHTML = grpHtml;
            }

            // ۳. آمار سال‌ها
            const yrCounts = {'سال ۱':0, 'سال ۲':0, 'سال ۳':0, 'سال ۴':0, 'سال ۵':0};
            db_members.forEach(m => { 
                let y = String(m[3]).replace(/1/g, '۱').replace(/2/g, '۲').replace(/3/g, '۳').replace(/4/g, '۴').replace(/5/g, '۵');
                if(yrCounts[y] !== undefined) yrCounts[y]++; 
            });
            let maxYr = Math.max(...Object.values(yrCounts), 1);
            let yrHtml = '';
            Object.entries(yrCounts).forEach(([y, count]) => {
                const percent = (count / maxYr) * 100;
                yrHtml += `
                    <div>
                        <div class="flex justify-between text-xs font-bold text-slate-600 mb-1">
                            <span>${y}</span>
                            <span>${count} نفر</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-2">
                            <div class="bg-purple-500 h-2 rounded-full" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('stat_years').innerHTML = yrHtml;
        }

        let edited_members = {}; 
        let deleted_members = [];

        function renderList() {
            const filterText = document.getElementById('searchInput').value.toLowerCase();
            const filterGrp = document.getElementById('filterGroup').value;
            const filterYr = document.getElementById('filterYear').value;
            const filterTh = document.getElementById('filterThesis').value;
            
            const container = document.getElementById('membersList');
            container.innerHTML = '';
            
            let count = 0;
            db_members.forEach(m => {
                const id = m[0];
                if (deleted_members.includes(id)) return; // دستیار حذف‌شده نمایش داده نمی‌شود
                
                const name = edited_members[id] ? edited_members[id].name : m[1];
                const grp = edited_members[id] ? edited_members[id].group : m[2];
                let y = edited_members[id] ? edited_members[id].year : m[3];
                y = String(y).replace(/1/g, '۱').replace(/2/g, '۲').replace(/3/g, '۳').replace(/4/g, '۴').replace(/5/g, '۵');
                const tStatus = edited_theses[id] || m[4] || 'بدون عملکرد';
                
                if (filterGrp !== 'all' && grp !== filterGrp) return;
                if (filterYr !== 'all' && y !== filterYr) return;
                if (filterTh !== 'all' && tStatus !== filterTh) return;
                if (filterText && !name.toLowerCase().includes(filterText)) return;
                
                count++;
                
                const conf = THESIS_COLORS[tStatus] || THESIS_COLORS['بدون عملکرد'];
                const isEditedThesis = !!edited_theses[id];
                const isEditedAdmin = !!edited_members[id];
                const cardBorder = (isEditedThesis || isEditedAdmin) ? 'border-amber-300 bg-amber-50/30' : 'border-slate-100 bg-white';
                
                // ۱. بازگردانی کامل دکمه‌های ویرایش و حذف دستیار برای مدیر ارشد
                let adminActionBtns = '';
                if (isAdmin === 1) {
                    adminActionBtns = `
                        <button onclick="openEditModal(${id})" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-indigo-100 hover:text-indigo-600 flex items-center justify-center text-xs transition-colors" title="ویرایش مشخصات دستیار">✏️</button>
                        <button onclick="deleteMember(${id}, '${name}')" class="w-8 h-8 rounded-full bg-rose-50 text-rose-500 hover:bg-rose-100 flex items-center justify-center text-xs transition-colors" title="حذف دستیار">🗑</button>
                    `;
                }

                // ۲. دکمه ویرایش پایان‌نامه: منحصراً برای کارشناس پژوهش
                let researchActionBtn = '';
                if (isResearch === 1) {
                    researchActionBtn = `
                        <button onclick="openThesisModal(${id}, '${name}', '${tStatus}')" class="text-xs font-extrabold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-2.5 py-1.5 rounded-xl transition-all active:scale-95 border border-indigo-200 flex items-center gap-1" title="تعیین پایان‌نامه">
                            📜 پایان‌نامه
                        </button>
                    `;
                }

                container.innerHTML += `
                    <div class="${cardBorder} p-3.5 rounded-2xl shadow-sm border flex items-center justify-between gap-2 slide-up">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-center text-lg flex-shrink-0">🎓</div>
                            <div class="min-w-0">
                                <p class="text-xs font-black text-slate-800 truncate">${name} ${isEditedAdmin ? '<span class="text-amber-500 text-[10px]">(ویرایش شده)</span>' : ''}</p>
                                <p class="text-[10px] font-bold text-slate-400 mt-0.5">📚 ${grp} | ${y}</p>
                                <div class="mt-1">
                                    <span class="inline-flex items-center gap-1 text-[10px] font-black px-2 py-0.5 rounded-lg border ${conf.bg} ${conf.text} ${conf.border}">
                                        ${conf.icon} ${tStatus} ${isEditedThesis ? '<span class="text-amber-500">(تغییریافته)</span>' : ''}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 flex-shrink-0">
                            ${researchActionBtn}
                            ${adminActionBtns}
                        </div>
                    </div>
                `;
            });
            
            if(count === 0) {
                container.innerHTML = `<div class="text-center p-8 text-xs font-bold text-slate-400 bg-white rounded-2xl border border-slate-100">هیچ دستیاری با این فیلترها یافت نشد.</div>`;
            }
            
            updateFooter();
        }

        // توابع بازگردانی‌شده مدیریت دستیار برای مدیر ارشد
        function openEditModal(id) {
            const member = db_members.find(m => m[0] === id);
            if (!member) return;
            
            const name = edited_members[id] ? edited_members[id].name : member[1];
            const grp = edited_members[id] ? edited_members[id].group : member[2];
            let y = edited_members[id] ? edited_members[id].year : member[3];
            y = String(y).replace(/1/g, '۱').replace(/2/g, '۲').replace(/3/g, '۳').replace(/4/g, '۴').replace(/5/g, '۵');
            
            const mGroupSelect = document.getElementById('m_group');
            mGroupSelect.innerHTML = '';
            db_groups.forEach(g => {
                mGroupSelect.innerHTML += `<option value="${g}" ${g === grp ? 'selected' : ''}>${g}</option>`;
            });

            document.getElementById('m_id').value = id;
            document.getElementById('m_name').value = name;
            document.getElementById('m_group').value = grp;
            document.getElementById('m_year').value = y;
            
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveEditLocally() {
            const id = parseInt(document.getElementById('m_id').value);
            const name = document.getElementById('m_name').value.trim();
            const group = document.getElementById('m_group').value;
            const year = document.getElementById('m_year').value;
            
            if (!name) { alert("نام دستیار نمی‌تواند خالی باشد."); return; }

            edited_members[id] = { id: id, name: name, group: group, year: year };
            
            closeEditModal();
            renderStats();
            renderList();
        }

        function deleteMember(id, name) {
            if (confirm(`آیا از حذف دستیار «${name}» اطمینان دارید؟`)) {
                deleted_members.push(id);
                if (edited_members[id]) delete edited_members[id];
                renderStats();
                renderList();
            }
        }

        function submitData() {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '⏳ در حال ارسال...';
            btn.classList.add('opacity-90', 'cursor-wait');

            try {
                window.Bale.WebApp.sendData(JSON.stringify({ 
                    action: "submit_roster_batch", 
                    edited_members: Object.values(edited_members),
                    deleted_members: deleted_members
                }));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                alert("خطا در ارتباط با سرور بله.");
                btn.innerHTML = '<span>📤 اعمال تغییرات دستیاران</span><span class="bg-white/20 px-2 py-0.5 rounded-lg text-xs">' + (Object.keys(edited_members).length + deleted_members.length) + '</span>';
                btn.classList.remove('opacity-90', 'cursor-wait');
            }
        }

        // توابع مدال پایان‌نامه
        function openThesisModal(id, name, currentStatus) {
            document.getElementById('tm_id').value = id;
            document.getElementById('tm_resident_name').innerText = `دستیار: ${name}`;
            document.getElementById('tm_status').value = currentStatus;
            document.getElementById('thesisModal').classList.remove('hidden');
        }

        function closeThesisModal() {
            document.getElementById('thesisModal').classList.add('hidden');
        }

        function saveThesisLocally() {
            const id = parseInt(document.getElementById('tm_id').value);
            const status = document.getElementById('tm_status').value;
            edited_theses[id] = status;
            closeThesisModal();
            renderStats();
            renderList();
        }

        function updateFooter() {
            const backBtn = document.getElementById('backBtn');
            const submitBtn = document.getElementById('submitBtn');
            const submitThesisBtn = document.getElementById('submitThesisBtn');

            const adminCount = Object.keys(edited_members).length + deleted_members.length;
            const thesisCount = Object.keys(edited_theses).length;

            let hasChanges = false;

            // دکمه ثبت تغییرات دستیاران برای مدیر
            if (isAdmin === 1 && adminCount > 0) {
                submitBtn.classList.remove('hidden');
                document.getElementById('changesCount').innerText = adminCount;
                hasChanges = true;
            } else {
                submitBtn.classList.add('hidden');
            }

            // دکمه ثبت وضعیت پایان‌نامه برای کارشناس پژوهش
            if (isResearch === 1 && thesisCount > 0) {
                submitThesisBtn.classList.remove('hidden');
                document.getElementById('thesisChangesCount').innerText = `${thesisCount} مورد`;
                hasChanges = true;
            } else {
                submitThesisBtn.classList.add('hidden');
            }

            if (hasChanges) {
                backBtn.className = "w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold p-3.5 rounded-2xl text-xs transition-all active:scale-[0.98]";
            } else {
                backBtn.className = "w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold p-3.5 rounded-2xl text-xs transition-all active:scale-[0.98]";
            }
        }

        window.Bale.WebApp.ready();

        function submitThesisData() {
            const btn = document.getElementById('submitThesisBtn');
            btn.innerHTML = '⏳ در حال ثبت...';
            btn.classList.add('opacity-90', 'cursor-wait');

            const updates = Object.entries(edited_theses).map(([id, status]) => ({ id: parseInt(id), status: status }));

            try {
                window.Bale.WebApp.sendData(JSON.stringify({ 
                    action: "submit_thesis_batch", 
                    updated_theses: updates 
                }));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                alert("خطا در ارتباط با سرور بله.");
                btn.innerHTML = '📤 ثبت پایان‌نامه‌ها';
                btn.classList.remove('opacity-90', 'cursor-wait');
            }
        }

        function closeApp() {
            try { window.Bale.WebApp.close(); } catch (e) {}
        }

        init();
    </script>
</body>
</html>
