<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>داشبورد کلان دستیاران</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glass-bottom { background: linear-gradient(to top, rgba(255,255,255,1) 60%, rgba(255,255,255,0.8)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        
        /* Progress Bar Animation */
        .progress-fill { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="flex flex-col h-screen selection:bg-purple-100 overflow-hidden">

    <div class="sticky top-0 z-30 glass-header border-b border-slate-200/50 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)]">
        <div class="p-5 text-center">
            <h1 class="text-base font-black text-purple-700 tracking-tight flex items-center justify-center gap-2" id="dashTitle">
                <span class="text-2xl">🏛</span> داشبورد کلان دانشکده
            </h1>
            <p class="text-[11px] font-bold text-slate-500 mt-1" id="dashSubtitle">آمار، مقایسه و جستجوی جامع</p>
        </div>
        
        <!-- Segmented Control (Tabs) -->
        <div class="px-5 pb-4">
            <div class="flex bg-slate-100/80 p-1 rounded-2xl border border-slate-200/50 relative">
                <button onclick="switchTab('stats')" id="tab_stats" class="flex-1 py-2.5 text-xs font-black rounded-xl bg-white text-purple-700 shadow-sm transition-all z-10">📊 آمار و مقایسه</button>
                <button onclick="switchTab('list')" id="tab_list" class="flex-1 py-2.5 text-xs font-black rounded-xl text-slate-500 hover:text-slate-700 transition-all z-10">👥 لیست دستیاران</button>
            </div>
        </div>
    </div>

    <div class="flex-grow overflow-y-auto p-5 pb-32">
        <!-- VIEW 1: STATS -->
        <div id="view_stats" class="space-y-6 fade-in">
            <!-- Total Card -->
            <div class="bg-gradient-to-br from-fuchsia-500 to-purple-600 rounded-[2rem] p-6 text-white shadow-xl shadow-purple-200/60 flex justify-between items-center relative overflow-hidden">
                <div class="absolute -right-4 -top-4 text-8xl opacity-10 blur-sm">👥</div>
                <div class="relative z-10">
                    <p class="text-[11px] font-bold text-purple-100 uppercase tracking-wider mb-1" id="totalLabel">کل دستیاران فعال دانشکده</p>
                    <p class="text-5xl font-black tracking-tight" id="stat_total">0</p>
                </div>
                <div class="w-14 h-14 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-2xl border border-white/20 relative z-10">
                    📈
                </div>
            </div>

            <!-- Groups Chart -->
            <div id="stat_groups_container" class="bg-white p-5 rounded-[1.5rem] shadow-sm border border-slate-100 slide-up" style="animation-delay: 0.1s;">
                <h3 class="text-xs font-black text-slate-800 mb-5 flex items-center gap-2">
                    <span class="w-8 h-8 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg">📁</span> 
                    مقایسه دپارتمان‌ها
                </h3>
                <div id="stat_groups" class="space-y-4"></div>
            </div>

            <!-- Years Chart -->
            <div class="bg-white p-5 rounded-[1.5rem] shadow-sm border border-slate-100 slide-up" style="animation-delay: 0.2s;">
                <h3 class="text-xs font-black text-slate-800 mb-5 flex items-center gap-2">
                    <span class="w-8 h-8 rounded-xl bg-fuchsia-50 text-fuchsia-600 flex items-center justify-center text-lg">🎓</span> 
                    مقایسه سال تحصیلی
                </h3>
                <div id="stat_years" class="space-y-4"></div>
            </div>
        </div>

        <!-- VIEW 2: LIST -->
        <div id="view_list" class="hidden space-y-5 fade-in">
            <div class="bg-white p-4 rounded-[1.5rem] shadow-sm border border-slate-100 space-y-3">
                <div class="relative group">
                    <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-slate-400 group-focus-within:text-purple-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="searchInput" onkeyup="renderList()" class="w-full bg-slate-50 border-2 border-transparent rounded-xl py-3 pr-10 pl-3 text-sm font-bold text-slate-700 focus:border-purple-100 focus:bg-white focus:ring-4 focus:ring-purple-50/50 transition-all outline-none placeholder-slate-400" placeholder="جستجوی نام...">
                </div>
                <div class="flex gap-2">
                    <select id="filterGroup" onchange="renderList()" class="flex-1 bg-slate-50 border border-slate-100 rounded-xl p-3 text-xs font-bold text-slate-700 outline-none appearance-none focus:ring-2 focus:ring-purple-200">
                        <option value="all">همه گروه‌ها</option>
                    </select>
                    <select id="filterYear" onchange="renderList()" class="flex-1 bg-slate-50 border border-slate-100 rounded-xl p-3 text-xs font-bold text-slate-700 outline-none appearance-none focus:ring-2 focus:ring-purple-200">
                        <option value="all">همه سال‌ها</option>
                        <option value="سال ۱">سال ۱ (R1)</option>
                        <option value="سال ۲">سال ۲ (R2)</option>
                        <option value="سال ۳">سال ۳ (R3)</option>
                        <option value="سال ۴">سال ۴ (R4)</option>
                        <option value="سال ۵">سال ۵ (R5)</option>
                    </select>
                </div>
            </div>

            <div id="membersList" class="space-y-3"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center fade-in">
        <div class="bg-white w-full sm:max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl slide-up">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>
            
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center text-amber-600 text-lg">✏️</div>
                <h3 class="text-base font-black text-slate-800">ویرایش دستیار</h3>
            </div>
            
            <input type="hidden" id="m_id">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5 ml-1">نام و نام خانوادگی</label>
                    <input type="text" id="m_name" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-amber-400 focus:bg-white transition-colors outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5 ml-1">گروه آموزشی</label>
                    <select id="m_group" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-indigo-700 outline-none appearance-none"></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5 ml-1">سال تحصیلی</label>
                    <select id="m_year" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-indigo-700 outline-none appearance-none">
                        <option value="سال ۱">سال ۱ (R1)</option>
                        <option value="سال ۲">سال ۲ (R2)</option>
                        <option value="سال ۳">سال ۳ (R3)</option>
                        <option value="سال ۴">سال ۴ (R4)</option>
                        <option value="سال ۵">سال ۵ (R5)</option>
                    </select>
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="closeModal()" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-black p-4 rounded-2xl text-sm active:scale-95 transition-all">انصراف</button>
                <button onclick="saveEditLocally()" class="w-2/3 bg-amber-500 hover:bg-amber-600 text-white font-black p-4 rounded-2xl text-sm shadow-lg shadow-amber-200/50 active:scale-95 transition-all">💾 ذخیره موقت</button>
            </div>
        </div>
    </div>

    <!-- Footer Buttons -->
    <div class="absolute bottom-0 left-0 right-0 glass-bottom px-5 py-4 pb-6 z-20 border-t border-slate-100 flex gap-3">
        <button id="backBtn" onclick="closeApp()" class="w-full bg-white border-2 border-slate-200 text-slate-600 font-black p-4 rounded-2xl text-sm active:scale-[0.98] transition-all hover:bg-slate-50 flex justify-center items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            بازگشت به منوی اصلی
        </button>
        <button id="submitBtn" onclick="submitData()" class="w-2/3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-black p-4 rounded-2xl text-sm shadow-xl shadow-teal-200/50 active:scale-[0.98] transition-all flex justify-between items-center hidden group">
            <span>📤 اعمال تغییرات</span>
            <span id="changesCount" class="bg-white/20 backdrop-blur-sm px-2 py-0.5 rounded-lg text-xs border border-white/10">0</span>
        </button>
    </div>

    <script>
        let db_members = []; 
        let db_groups = [];
        let isAdmin = 0;
        let isLocal = "";
        let edited_members = {}; 
        let deleted_members = []; 

        function showAlert(msg, type = 'error') {
            const existing = document.getElementById('customAlert');
            if(existing) existing.remove();
            const bgClass = type === 'error' ? 'bg-rose-500' : 'bg-emerald-500';
            const alertBox = document.createElement('div');
            alertBox.id = 'customAlert';
            alertBox.className = `fixed top-6 left-1/2 -translate-x-1/2 ${bgClass} text-white px-6 py-3.5 rounded-2xl shadow-xl shadow-${type === 'error' ? 'rose' : 'emerald'}-200/50 z-[100] text-sm font-black text-center w-11/12 max-w-sm slide-up flex items-center justify-center gap-2`;
            alertBox.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span> <span>${msg}</span>`;
            document.body.appendChild(alertBox);
            setTimeout(() => { if(document.getElementById('customAlert')) document.getElementById('customAlert').remove(); }, 3500);
        }

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                if (compressedData) {
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    const data = JSON.parse(decompressed);
                    db_members = data.m || [];
                    db_groups = data.g || [];
                    isAdmin = data.a || 0;
                    isLocal = data.local || "";
                }
                
                const grpSelect = document.getElementById('filterGroup');
                const mGroupSelect = document.getElementById('m_group');
                db_groups.forEach(g => {
                    grpSelect.innerHTML += `<option value="${g}">${g}</option>`;
                    mGroupSelect.innerHTML += `<option value="${g}">${g}</option>`;
                });

                if (isLocal) {
                    document.getElementById('dashTitle').innerHTML = `<span class="text-2xl">🏛</span> داشبورد ${isLocal}`;
                    document.getElementById('dashSubtitle').innerText = "آمار و لیست اختصاصی دپارتمان شما";
                    document.getElementById('totalLabel').innerText = "کل دستیاران فعال دپارتمان";
                    document.getElementById('stat_groups_container').classList.add('hidden');
                    document.getElementById('filterGroup').classList.add('hidden');
                }

                renderStats();
                renderList();
                
                // Trigger progress bar animations
                setTimeout(() => {
                    document.querySelectorAll('.progress-fill').forEach(el => {
                        el.style.width = el.getAttribute('data-width');
                    });
                }, 100);
            } catch(e) { showAlert("خطا در بارگذاری اطلاعات از سرور."); }
        }

        function switchTab(tab) {
            document.getElementById('view_stats').classList.add('hidden');
            document.getElementById('view_list').classList.add('hidden');
            
            document.getElementById('tab_stats').className = "flex-1 py-2.5 text-xs font-black rounded-xl text-slate-500 hover:text-slate-700 transition-all z-10 bg-transparent shadow-none";
            document.getElementById('tab_list').className = "flex-1 py-2.5 text-xs font-black rounded-xl text-slate-500 hover:text-slate-700 transition-all z-10 bg-transparent shadow-none";
            
            document.getElementById(`view_${tab}`).classList.remove('hidden');
            document.getElementById(`tab_${tab}`).className = "flex-1 py-2.5 text-xs font-black rounded-xl bg-white text-purple-700 shadow-sm transition-all z-10";
        }

        function renderStats() {
            const activeMembers = db_members.filter(m => !deleted_members.includes(m[0]));
            document.getElementById('stat_total').innerText = activeMembers.length;

            if (!isLocal) {
                const grpCounts = {};
                db_groups.forEach(g => grpCounts[g] = 0);
                activeMembers.forEach(m => { 
                    const grp = edited_members[m[0]] ? edited_members[m[0]].group : m[2];
                    if(grpCounts[grp] !== undefined) grpCounts[grp]++; 
                });
                
                let maxGrp = Math.max(...Object.values(grpCounts), 1);
                let grpHtml = '';
                const sortedGrps = Object.entries(grpCounts).sort((a,b) => b[1] - a[1]);
                
                sortedGrps.forEach(([g, count]) => {
                    const percent = (count / maxGrp) * 100;
                    grpHtml += `
                        <div>
                            <div class="flex justify-between text-xs font-black text-slate-700 mb-1.5">
                                <span>${g}</span>
                                <span>${count} نفر</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                <div class="bg-gradient-to-r from-indigo-400 to-purple-500 h-full rounded-full progress-fill w-0" data-width="${percent}%"></div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('stat_groups').innerHTML = grpHtml;
            }

            const yrCounts = {'سال ۱':0, 'سال ۲':0, 'سال ۳':0, 'سال ۴':0, 'سال ۵':0};
            activeMembers.forEach(m => { 
                let y = edited_members[m[0]] ? edited_members[m[0]].year : m[3];
                y = String(y).replace(/1/g, '۱').replace(/2/g, '۲').replace(/3/g, '۳').replace(/4/g, '۴').replace(/5/g, '۵');
                if(yrCounts[y] !== undefined) yrCounts[y]++; 
            });
            
            let maxYr = Math.max(...Object.values(yrCounts), 1);
            let yrHtml = '';
            
            Object.entries(yrCounts).forEach(([y, count]) => {
                const percent = (count / maxYr) * 100;
                yrHtml += `
                    <div>
                        <div class="flex justify-between text-xs font-black text-slate-700 mb-1.5">
                            <span>${y}</span>
                            <span>${count} نفر</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                            <div class="bg-gradient-to-r from-fuchsia-400 to-pink-500 h-full rounded-full progress-fill w-0" data-width="${percent}%"></div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('stat_years').innerHTML = yrHtml;
        }

        function renderList() {
            const filterText = document.getElementById('searchInput').value.toLowerCase();
            const filterGrp = document.getElementById('filterGroup').value;
            const filterYr = document.getElementById('filterYear').value;
            
            const container = document.getElementById('membersList');
            container.innerHTML = '';
            
            let count = 0;
            db_members.forEach(m => {
                const id = m[0];
                if (deleted_members.includes(id)) return; 
                
                const name = edited_members[id] ? edited_members[id].name : m[1];
                const grp = edited_members[id] ? edited_members[id].group : m[2];
                let y = edited_members[id] ? edited_members[id].year : m[3];
                y = String(y).replace(/1/g, '۱').replace(/2/g, '۲').replace(/3/g, '۳').replace(/4/g, '۴').replace(/5/g, '۵');
                
                if (filterGrp !== 'all' && grp !== filterGrp) return;
                if (filterYr !== 'all' && y !== filterYr) return;
                if (filterText && !name.toLowerCase().includes(filterText)) return;
                
                count++;
                
                let editBtn = '';
                if (isAdmin === 1) {
                    editBtn = `
                        <div class="flex flex-col gap-2 flex-shrink-0">
                            <button onclick="openEditModal(${id})" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center text-sm hover:bg-amber-50 hover:text-amber-600 hover:scale-105 active:scale-95 transition-all"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                            <button onclick="deleteMember(${id}, '${name}')" class="w-9 h-9 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center text-sm hover:bg-rose-100 hover:scale-105 active:scale-95 transition-all"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    `;
                }
                
                let bgClass = edited_members[id] ? 'bg-amber-50/30 border-amber-100' : 'bg-white border-slate-100';
                let badge = edited_members[id] ? '<span class="bg-amber-100 text-amber-600 text-[9px] font-black px-2 py-0.5 rounded-lg border border-amber-200/50 ml-2">ویرایش شده</span>' : '';
                let avatarBg = edited_members[id] ? 'from-amber-100 to-orange-100 text-amber-600' : 'from-slate-100 to-slate-200 text-slate-500';

                container.innerHTML += `
                    <div class="${bgClass} p-4 rounded-[1.5rem] shadow-[0_4px_20px_-4px_rgba(0,0,0,0.03)] border flex items-center justify-between gap-3 slide-up hover:shadow-md transition-all">
                        <div class="flex items-center gap-4 overflow-hidden">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-br ${avatarBg} flex items-center justify-center text-xl font-black border-2 border-white shadow-sm flex-shrink-0">
                                ${name.charAt(0)}
                            </div>
                            <div class="overflow-hidden">
                                <p class="text-sm font-black text-slate-800 truncate flex items-center">${name} ${badge}</p>
                                <p class="text-[11px] font-bold text-slate-500 mt-1 truncate">📚 ${grp}</p>
                                <p class="text-[10px] font-bold text-indigo-500 mt-0.5 truncate">🎓 ${y}</p>
                            </div>
                        </div>
                        ${editBtn}
                    </div>
                `;
            });
            
            if(count === 0) {
                container.innerHTML = `
                    <div class="bg-white border border-slate-100 rounded-[1.5rem] p-8 text-center shadow-sm slide-up mt-4">
                        <div class="w-16 h-16 bg-slate-50 text-slate-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">📭</div>
                        <p class="text-sm font-bold text-slate-500">هیچ دستیاری یافت نشد.</p>
                    </div>`;
            }
            
            updateFooter();
        }

        function deleteMember(id, name) {
            if (confirm(`آیا از حذف دستیار «${name}» اطمینان دارید؟`)) {
                deleted_members.push(id);
                if (edited_members[id]) delete edited_members[id];
                renderStats();
                renderList();
                showAlert("دستیار حذف شد. برای تایید نهایی روی «اعمال تغییرات» کلیک کنید.", "success");
            }
        }

        function openEditModal(id) {
            const member = db_members.find(m => m[0] === id);
            if (!member) return;
            
            const name = edited_members[id] ? edited_members[id].name : member[1];
            const grp = edited_members[id] ? edited_members[id].group : member[2];
            let y = edited_members[id] ? edited_members[id].year : member[3];
            y = String(y).replace(/1/g, '۱').replace(/2/g, '۲').replace(/3/g, '۳').replace(/4/g, '۴').replace(/5/g, '۵');
            
            document.getElementById('m_id').value = id;
            document.getElementById('m_name').value = name;
            document.getElementById('m_group').value = grp;
            document.getElementById('m_year').value = y;
            
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveEditLocally() {
            const id = parseInt(document.getElementById('m_id').value);
            const name = document.getElementById('m_name').value.trim();
            const group = document.getElementById('m_group').value;
            const year = document.getElementById('m_year').value;
            
            if (!name) { showAlert("نام دستیار نمی‌تواند خالی باشد."); return; }

            edited_members[id] = { id: id, name: name, group: group, year: year };
            
            closeModal();
            renderStats();
            renderList();
            showAlert("تغییرات موقتاً ذخیره شد.", "success");
        }

        function updateFooter() {
            const count = Object.keys(edited_members).length + deleted_members.length;
            const backBtn = document.getElementById('backBtn');
            const submitBtn = document.getElementById('submitBtn');
            
            if (count > 0) {
                backBtn.className = "w-1/3 bg-white border-2 border-slate-200 text-slate-600 font-black p-4 rounded-2xl text-sm active:scale-[0.98] transition-all hover:bg-slate-50 flex justify-center items-center gap-2";
                submitBtn.classList.remove('hidden');
                document.getElementById('changesCount').innerText = count;
            } else {
                backBtn.className = "w-full bg-white border-2 border-slate-200 text-slate-600 font-black p-4 rounded-2xl text-sm active:scale-[0.98] transition-all hover:bg-slate-50 flex justify-center items-center gap-2";
                submitBtn.classList.add('hidden');
            }
            
            setTimeout(() => {
                document.querySelectorAll('.progress-fill').forEach(el => {
                    el.style.width = el.getAttribute('data-width');
                });
            }, 50);
        }

        window.Bale.WebApp.ready();

        function submitData() {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> در حال ارسال...';
            btn.classList.add('opacity-90', 'cursor-wait');

            try {
                window.Bale.WebApp.sendData(JSON.stringify({ 
                    action: "submit_roster_batch", 
                    edited_members: Object.values(edited_members),
                    deleted_members: deleted_members
                }));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                showAlert("خطا در ارتباط با سرور بله.");
                btn.innerHTML = '<span>📤 اعمال تغییرات</span><span class="bg-white/20 px-2 py-0.5 rounded-lg text-xs">' + (Object.keys(edited_members).length + deleted_members.length) + '</span>';
                btn.classList.remove('opacity-90', 'cursor-wait');
            }
        }

        function closeApp() {
            try { window.Bale.WebApp.close(); } catch (e) { console.log(e); }
        }

        init();
    </script>
</body>
</html>
