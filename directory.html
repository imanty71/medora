<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دفترچه تلفن سازمانی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glass-bottom { background: linear-gradient(to top, rgba(255,255,255,1) 60%, rgba(255,255,255,0.8)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

        /* Custom Checkbox Animation */
        .custom-checkbox:checked + div { background-color: #4f46e5; border-color: #4f46e5; transform: scale(1.05); }
        .custom-checkbox:checked + div svg { display: block; animation: checkPop 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes checkPop { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        
        /* Card Selected State */
        .card-selected { border-color: #c7d2fe !important; background-color: #eef2ff !important; }
    </style>
</head>
<body class="flex flex-col h-screen selection:bg-indigo-100 overflow-hidden">

    <div class="sticky top-0 z-30 glass-header border-b border-slate-200/50 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)]">
        <div class="p-5 flex items-center gap-3">
            <div class="w-12 h-12 rounded-[1.25rem] bg-gradient-to-br from-indigo-500 to-sky-500 flex items-center justify-center text-white text-xl shadow-lg shadow-indigo-200/50">
                📖
            </div>
            <div>
                <h1 class="text-base font-black text-slate-800 tracking-tight">دفترچه تلفن سازمانی</h1>
                <p class="text-[11px] font-bold text-slate-500 mt-0.5">گیرندگان پیام را انتخاب کنید</p>
            </div>
        </div>
        
        <!-- Tabs -->
        <div class="px-5 pb-2">
            <div class="flex bg-slate-100/80 p-1 rounded-2xl border border-slate-200/50">
                <button onclick="switchTab('users')" id="tab_users" class="flex-1 py-2.5 text-xs font-black rounded-xl bg-white text-indigo-600 shadow-sm transition-all z-10 flex justify-center items-center gap-1.5"><span class="text-sm">👤</span> اشخاص</button>
                <button onclick="switchTab('groups')" id="tab_groups" class="flex-1 py-2.5 text-xs font-black rounded-xl text-slate-500 hover:text-slate-700 transition-all z-10 flex justify-center items-center gap-1.5"><span class="text-sm">📁</span> گروه‌ها</button>
                <button onclick="switchTab('roles')" id="tab_roles" class="flex-1 py-2.5 text-xs font-black rounded-xl text-slate-500 hover:text-slate-700 transition-all z-10 flex justify-center items-center gap-1.5"><span class="text-sm">🔰</span> مقامات</button>
            </div>
        </div>

        <!-- Search -->
        <div id="searchContainer" class="px-5 pb-4 pt-2">
            <div class="relative group">
                <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                    <svg class="w-4 h-4 text-slate-400 group-focus-within:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="searchInput" onkeyup="renderUsers()" class="w-full bg-slate-100/80 border-2 border-transparent rounded-2xl py-3 pr-11 pl-4 text-sm font-bold text-slate-700 focus:border-indigo-100 focus:bg-white focus:ring-4 focus:ring-indigo-50/50 transition-all outline-none placeholder-slate-400" placeholder="جستجوی نام شخص...">
            </div>
        </div>
    </div>

    <div class="flex-grow overflow-y-auto px-5 pt-4 pb-32">
        <div id="list_users" class="space-y-3 fade-in"></div>
        <div id="list_groups" class="space-y-3 hidden fade-in"></div>
        <div id="list_roles" class="space-y-3 hidden fade-in"></div>
    </div>

    <div class="absolute bottom-0 left-0 right-0 glass-bottom px-5 py-4 pb-6 z-20 border-t border-slate-100">
        <button id="submitBtn" onclick="submitData()" class="w-full bg-gradient-to-r from-indigo-500 to-sky-500 hover:from-indigo-600 hover:to-sky-600 text-white font-black p-4 rounded-2xl text-sm shadow-xl shadow-indigo-200/60 transition-all active:scale-[0.98] flex justify-between items-center group">
            <span class="flex items-center gap-2">
                <svg class="w-5 h-5 opacity-80 group-hover:-translate-y-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                تایید گیرندگان و ادامه
            </span>
            <span id="selectedCount" class="bg-white/20 backdrop-blur-sm px-3 py-1 rounded-xl text-xs border border-white/10">0 انتخاب</span>
        </button>
    </div>

    <script>
        let db_users = [];
        let db_groups = [];
        let db_roles = [];
        let selected_targets = new Map();

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                let data = {};
                
                if (compressedData) {
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    data = JSON.parse(decompressed);
                } else {
                    data = JSON.parse(decodeURIComponent(urlParams.get('data') || '{}'));
                }

                db_groups = data.g || [];
                db_roles = data.r || [];
                db_users = data.u || []; 
                
                renderUsers();
                renderGroups();
                renderRoles();
            } catch(e) { 
                console.error("Error decompressing data:", e); 
                alert("خطا در بارگذاری اطلاعات دفترچه تلفن.");
            }
        }

        function switchTab(tab) {
            ['users', 'groups', 'roles'].forEach(t => {
                document.getElementById(`list_${t}`).classList.add('hidden');
                document.getElementById(`tab_${t}`).className = "flex-1 py-2.5 text-xs font-black rounded-xl text-slate-500 hover:text-slate-700 transition-all z-10 flex justify-center items-center gap-1.5 bg-transparent shadow-none";
            });
            
            document.getElementById(`list_${tab}`).classList.remove('hidden');
            document.getElementById(`tab_${tab}`).className = "flex-1 py-2.5 text-xs font-black rounded-xl bg-white text-indigo-600 shadow-sm transition-all z-10 flex justify-center items-center gap-1.5";
            
            if(tab === 'users') document.getElementById('searchContainer').classList.remove('hidden');
            else document.getElementById('searchContainer').classList.add('hidden');
        }

        function toggleSelect(id, name, isChecked) {
            if (isChecked) selected_targets.set(id, name);
            else selected_targets.delete(id);
            
            document.getElementById('selectedCount').innerText = `${selected_targets.size} انتخاب`;
            
            // Update Card Style
            const card = document.getElementById(`card_${id.replace(/[:|]/g, '_')}`);
            if (card) {
                if (isChecked) card.classList.add('card-selected');
                else card.classList.remove('card-selected');
            }
        }

        function createCard(id, name, subtitle, icon, iconBg) {
            const isChecked = selected_targets.has(id);
            const safeId = id.replace(/[:|]/g, '_');
            const cardClass = isChecked ? 'card-selected' : '';
            
            return `
                <label id="card_${safeId}" class="flex items-center justify-between bg-white p-3.5 rounded-[1.25rem] shadow-sm border border-slate-100 cursor-pointer transition-all hover:shadow-md slide-up ${cardClass}">
                    <div class="flex items-center gap-4">
                        <div class="relative flex items-center justify-center flex-shrink-0">
                            <input type="checkbox" class="custom-checkbox opacity-0 absolute h-0 w-0" ${isChecked ? 'checked' : ''} onchange="toggleSelect('${id}', '${name}', this.checked)">
                            <div class="w-6 h-6 rounded-lg border-2 border-slate-300 bg-slate-50 flex items-center justify-center transition-all">
                                <svg class="w-3.5 h-3.5 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-br ${iconBg} flex items-center justify-center text-lg font-black border-2 border-white shadow-sm flex-shrink-0">
                                ${icon}
                            </div>
                            <div class="overflow-hidden">
                                <p class="text-sm font-black text-slate-800 truncate">${name}</p>
                                ${subtitle ? `<p class="text-[10px] font-bold text-slate-400 mt-0.5 truncate">${subtitle}</p>` : ''}
                            </div>
                        </div>
                    </div>
                </label>
            `;
        }

        function renderUsers() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('list_users');
            container.innerHTML = '';
            
            let count = 0;
            db_users.forEach(u => {
                if (filter && !u[1].toLowerCase().includes(filter)) return;
                count++;
                let subtitle = u[2] ? `${u[2]}` : '';
                if (u[3]) subtitle += ` <span class="text-slate-300 mx-1">•</span> <span class="text-indigo-500">${u[3]}</span>`;
                container.innerHTML += createCard(u[0], u[1], subtitle, u[1].charAt(0), 'from-slate-100 to-slate-200 text-slate-500');
            });
            
            if(count === 0) container.innerHTML = `<div class="text-center p-5 text-sm font-bold text-slate-400">شخصی یافت نشد.</div>`;
        }

        function renderGroups() {
            const container = document.getElementById('list_groups');
            container.innerHTML = '';
            db_groups.forEach(g => {
                container.innerHTML += createCard(`group:${g}`, `گروه ${g}`, 'ارسال به کارتابل این دپارتمان', '📁', 'from-blue-100 to-indigo-100 text-blue-600');
            });
        }

        function renderRoles() {
            const container = document.getElementById('list_roles');
            container.innerHTML = '';
            db_roles.forEach(r => {
                const id = r === 'مدیر ارشد سامانه' ? 'ADMIN' : `role:${r}`;
                container.innerHTML += createCard(id, r, 'ارسال به کارتابل این مقام', '🔰', 'from-amber-100 to-orange-100 text-amber-600');
            });
        }

        window.Bale.WebApp.ready();

        function submitData() {
            if (selected_targets.size === 0) {
                alert("لطفاً حداقل یک گیرنده را انتخاب کنید.");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> در حال ارسال...';
            btn.classList.add('opacity-90', 'cursor-wait');
            
            const targets = Array.from(selected_targets.keys());
            const target_names = Array.from(selected_targets.values());

            const payload = {
                action: "submit_directory",
                targets: targets,
                target_names: target_names
            };

            try {
                window.Bale.WebApp.sendData(JSON.stringify(payload));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                btn.innerHTML = '<span>📤 تایید گیرندگان و ادامه</span><span class="bg-white/20 px-2 py-0.5 rounded-lg text-xs">' + selected_targets.size + ' انتخاب</span>';
                btn.classList.remove('opacity-90', 'cursor-wait');
                alert("خطا در ارتباط با سرور.");
            }
        }

        init();
    </script>
</body>
</html>
