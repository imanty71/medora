<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دفترچه تلفن سازمانی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- اضافه شدن کتابخانه Pako برای خارج کردن دیتا از حالت فشرده -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-checkbox:checked + div { background-color: #4f46e5; border-color: #4f46e5; }
        .custom-checkbox:checked + div svg { display: block; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen selection:bg-indigo-100">

    <div class="sticky top-0 z-20 bg-white/90 backdrop-blur-xl border-b border-slate-200/60 shadow-sm">
        <div class="p-4 text-center">
            <h1 class="text-sm font-extrabold text-indigo-700">📖 دفترچه تلفن سازمانی</h1>
            <p class="text-[11px] text-slate-500 mt-1">گیرندگان پیام خود را انتخاب کنید</p>
        </div>
        
        <div class="flex overflow-x-auto no-scrollbar px-2 pb-2 gap-2">
            <button onclick="switchTab('users')" id="tab_users" class="flex-1 min-w-[100px] py-2 text-xs font-bold rounded-xl bg-indigo-100 text-indigo-700 transition-colors">👤 اشخاص</button>
            <button onclick="switchTab('groups')" id="tab_groups" class="flex-1 min-w-[100px] py-2 text-xs font-bold rounded-xl bg-slate-100 text-slate-500 transition-colors">📁 گروه‌ها</button>
            <button onclick="switchTab('roles')" id="tab_roles" class="flex-1 min-w-[100px] py-2 text-xs font-bold rounded-xl bg-slate-100 text-slate-500 transition-colors">🔰 مقامات</button>
        </div>
        
        <div id="searchContainer" class="px-4 pb-3">
            <div class="relative">
                <span class="absolute inset-y-0 right-3 flex items-center text-slate-400">🔍</span>
                <input type="text" id="searchInput" onkeyup="renderUsers()" class="w-full bg-slate-100 border-none rounded-xl py-2.5 pr-9 pl-3 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-indigo-400 focus:bg-white transition-all placeholder-slate-400" placeholder="جستجوی نام شخص...">
            </div>
        </div>
    </div>

    <div class="flex-grow overflow-y-auto p-4 pb-32">
        <div id="list_users" class="space-y-2 fade-in"></div>
        <div id="list_groups" class="space-y-2 hidden fade-in"></div>
        <div id="list_roles" class="space-y-2 hidden fade-in"></div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg p-4 border-t border-slate-200/60 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
        <button id="submitBtn" onclick="submitData()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-4 rounded-2xl text-sm shadow-lg shadow-indigo-200/50 transition-all active:scale-[0.98] flex justify-between items-center">
            <span>📤 تایید گیرندگان و ادامه</span>
            <span id="selectedCount" class="bg-white/20 px-2.5 py-0.5 rounded-lg text-xs">0 انتخاب</span>
        </button>
    </div>

    <script>
        let db_users = [];
        let db_groups = [];
        let db_roles = [];
        
        let selected_targets = new Map();

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                let data = {};
                
                if (compressedData) {
                    // دیکد کردن Base64 به بایت
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    // خارج کردن از حالت فشرده Zlib
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    data = JSON.parse(decompressed);
                } else {
                    // برای پشتیبانی از حالت‌های قدیمی
                    data = JSON.parse(decodeURIComponent(urlParams.get('data') || '{}'));
                }

                db_groups = data.g || [];
                db_roles = data.r || [];
                db_users = data.u || []; 
                
                renderUsers();
                renderGroups();
                renderRoles();
            } catch(e) { 
                console.error("Error decompressing data:", e); 
                alert("خطا در بارگذاری اطلاعات دفترچه تلفن.");
            }
        }

        function switchTab(tab) {
            ['users', 'groups', 'roles'].forEach(t => {
                document.getElementById(`list_${t}`).classList.add('hidden');
                document.getElementById(`tab_${t}`).className = "flex-1 min-w-[100px] py-2 text-xs font-bold rounded-xl bg-slate-100 text-slate-500 transition-colors";
            });
            
            document.getElementById(`list_${tab}`).classList.remove('hidden');
            document.getElementById(`tab_${tab}`).className = "flex-1 min-w-[100px] py-2 text-xs font-bold rounded-xl bg-indigo-100 text-indigo-700 transition-colors";
            
            if(tab === 'users') document.getElementById('searchContainer').classList.remove('hidden');
            else document.getElementById('searchContainer').classList.add('hidden');
        }

        function toggleSelect(id, name, isChecked) {
            if (isChecked) selected_targets.set(id, name);
            else selected_targets.delete(id);
            document.getElementById('selectedCount').innerText = `${selected_targets.size} انتخاب`;
        }

        function createCard(id, name, subtitle, icon) {
            const isChecked = selected_targets.has(id);
            return `
                <label class="flex items-center justify-between bg-white p-3.5 rounded-2xl shadow-[0_2px_8px_rgb(0,0,0,0.02)] border border-slate-100 cursor-pointer">
                    <div class="flex items-center gap-3">
                        <div class="relative flex items-center justify-center">
                            <input type="checkbox" class="custom-checkbox opacity-0 absolute h-0 w-0" ${isChecked ? 'checked' : ''} onchange="toggleSelect('${id}', '${name}', this.checked)">
                            <div class="w-6 h-6 rounded-lg border-2 border-slate-300 bg-slate-50 flex items-center justify-center transition-all">
                                <svg class="w-3.5 h-3.5 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                        </div>
                        <div>
                            <p class="text-sm font-extrabold text-slate-700">${icon} ${name}</p>
                            ${subtitle ? `<p class="text-[10px] font-bold text-slate-400 mt-0.5">${subtitle}</p>` : ''}
                        </div>
                    </div>
                </label>
            `;
        }

        function renderUsers() {
            const filter = document.getElementById('searchInput').value;
            const container = document.getElementById('list_users');
            container.innerHTML = '';
            
            db_users.forEach(u => {
                if (filter && !u[1].includes(filter)) return;
                let subtitle = u[2] ? `${u[2]}` : '';
                if (u[3]) subtitle += ` (${u[3]})`;
                container.innerHTML += createCard(u[0], u[1], subtitle, '👤');
            });
        }

        function renderGroups() {
            const container = document.getElementById('list_groups');
            container.innerHTML = '';
            db_groups.forEach(g => {
                container.innerHTML += createCard(`group:${g}`, `گروه ${g}`, '', '📁');
            });
        }

        function renderRoles() {
            const container = document.getElementById('list_roles');
            container.innerHTML = '';
            db_roles.forEach(r => {
                const id = r === 'مدیر ارشد سامانه' ? 'ADMIN' : `role:${r}`;
                container.innerHTML += createCard(id, r, '', '🔰');
            });
        }

        window.Bale.WebApp.ready();

        function submitData() {
            if (selected_targets.size === 0) {
                alert("لطفاً حداقل یک گیرنده را انتخاب کنید.");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '⏳ در حال ارسال...';
            btn.classList.add('opacity-90', 'cursor-wait');
            
            const targets = Array.from(selected_targets.keys());
            const target_names = Array.from(selected_targets.values());

            const payload = {
                action: "submit_directory",
                targets: targets,
                target_names: target_names
            };

            try {
                window.Bale.WebApp.sendData(JSON.stringify(payload));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                btn.innerHTML = '📤 تایید گیرندگان و ادامه';
                btn.classList.remove('opacity-90', 'cursor-wait');
                alert("خطا در ارتباط با سرور.");
            }
        }

        init();
    </script>
</body>
</html>
