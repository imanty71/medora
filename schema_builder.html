<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استودیوی طراحی فیلدها</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* استایل اختصاصی برای Toggle Switch مدرن */
        .toggle-checkbox:checked { right: 0; border-color: #6366f1; }
        .toggle-checkbox:checked + .toggle-label { background-color: #6366f1; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { width: 3rem; height: 1.5rem; background-color: #cbd5e1; border-radius: 9999px; transition: all 0.3s; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen selection:bg-indigo-100">

    <!-- هدر شیشه‌ای -->
    <div class="sticky top-0 z-20 bg-white/80 backdrop-blur-xl border-b border-slate-200/60 px-5 py-4 shadow-sm">
        <div class="max-w-lg mx-auto flex items-center gap-4">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center text-2xl shadow-inner border border-indigo-100/50">🛠</div>
            <div>
                <h1 class="text-base font-extrabold text-slate-800 tracking-tight">استودیوی طراحی فیلدها</h1>
                <p class="text-[11px] text-slate-500 font-medium mt-0.5">ستون‌های فرم را مدیریت کنید</p>
            </div>
        </div>
    </div>

    <div class="p-5 flex-grow overflow-y-auto space-y-6 pb-28 max-w-lg w-full mx-auto">
        
        <div id="fieldsContainer" class="space-y-4">
            <!-- فیلدها اینجا رندر می‌شوند -->
        </div>

        <!-- دکمه افزودن فیلد جدید -->
        <button onclick="addNewField()" class="w-full bg-indigo-50/50 border-2 border-dashed border-indigo-200 text-indigo-600 hover:bg-indigo-50 hover:border-indigo-300 font-bold p-4 rounded-2xl text-sm transition-all flex justify-center items-center gap-2 active:scale-95">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            افزودن فیلد جدید به فرم
        </button>

    </div>

    <!-- دکمه نهایی ثابت -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg p-4 border-t border-slate-200/60 pb-safe">
        <div class="max-w-lg mx-auto">
            <button onclick="submitSchema()" id="submitBtn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold p-4 rounded-2xl text-sm shadow-lg shadow-teal-200/50 transition-all duration-200 active:scale-[0.98] flex justify-center items-center gap-2">
                💾 ذخیره و اعمال نهایی در ربات
            </button>
        </div>
    </div>

    <script>
        // پیش‌فرض‌های هوشمند شرکتی
        let schema = [
            { id: generateId(), label: 'نام و نام خانوادگی', type: 'text', req: true, isDefault: true },
            { id: generateId(), label: 'کد ملی', type: 'nid', req: true, isDefault: true },
            { id: generateId(), label: 'شماره موبایل', type: 'phone', req: true, isDefault: true },
            { id: generateId(), label: 'ایمیل', type: 'mixed', req: false, isDefault: true },
            { id: generateId(), label: 'سابقه علمی', type: 'text', req: false, isDefault: true }
        ];

        function generateId() { return 'f_' + Math.random().toString(36).substr(2, 9); }

        function renderFields() {
            const container = document.getElementById('fieldsContainer');
            container.innerHTML = '';

            schema.forEach((field, index) => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-[0_2px_10px_rgb(0,0,0,0.03)] border border-slate-100 flex flex-col gap-4 relative slide-up group";
                
                // دکمه حذف (برای پیش‌فرض‌ها کمرنگ‌تر است اما قابل حذف است)
                const deleteBtn = `<button onclick="removeField(${index})" class="absolute top-4 left-4 text-rose-400 hover:text-rose-600 bg-rose-50 p-1.5 rounded-lg transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>`;

                card.innerHTML = `
                    ${deleteBtn}
                    
                    <div class="pr-8">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">عنوان فیلد</label>
                        <input type="text" value="${field.label}" onchange="updateField(${index}, 'label', this.value)" class="w-full bg-transparent border-b-2 border-slate-100 focus:border-indigo-500 text-sm font-extrabold text-slate-800 pb-1 focus:outline-none transition-colors" placeholder="مثلاً: آدرس محل سکونت">
                    </div>

                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <div class="flex items-center gap-2">
                            <span class="text-lg">⚙️</span>
                            <div class="flex flex-col">
                                <span class="text-[10px] font-bold text-slate-400 uppercase">نوع پاسخ</span>
                                <select onchange="updateField(${index}, 'type', this.value)" class="bg-transparent text-xs font-bold text-indigo-700 focus:outline-none cursor-pointer appearance-none">
                                    <option value="text" ${field.type === 'text' ? 'selected' : ''}>🔠 فقط حروف</option>
                                    <option value="number" ${field.type === 'number' ? 'selected' : ''}>🔢 فقط عدد</option>
                                    <option value="nid" ${field.type === 'nid' ? 'selected' : ''}>🆔 کد ملی (۱۰ رقم)</option>
                                    <option value="phone" ${field.type === 'phone' ? 'selected' : ''}>📱 موبایل (۱۱ رقم)</option>
                                    <option value="mixed" ${field.type === 'mixed' ? 'selected' : ''}>📧 ترکیبی / ایمیل</option>
                                </select>
                            </div>
                        </div>

                        <div class="w-px h-8 bg-slate-200 mx-2"></div>

                        <div class="flex items-center gap-3">
                            <span class="text-[10px] font-bold text-slate-500 uppercase">الزامی</span>
                            <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" id="toggle_${index}" onchange="updateField(${index}, 'req', this.checked)" ${field.req ? 'checked' : ''} class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer mt-0.5 ml-0.5"/>
                                <label for="toggle_${index}" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 cursor-pointer"></label>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateField(index, key, value) {
            schema[index][key] = value;
        }

        function removeField(index) {
            schema.splice(index, 1);
            renderFields();
        }

        function addNewField() {
            schema.push({ id: generateId(), label: '', type: 'text', req: true, isDefault: false });
            renderFields();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        window.Bale.WebApp.ready();

        function submitSchema() {
            // اعتبارسنجی
            let hasError = false;
            schema.forEach((f, i) => {
                if (!f.label.trim()) {
                    alert(`لطفاً عنوان فیلد شماره ${i+1} را وارد کنید.`);
                    hasError = true;
                }
            });
            if (hasError) return;
            if (schema.length === 0) {
                alert("حداقل یک فیلد باید در فرم وجود داشته باشد.");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<span class="animate-spin text-lg">⏳</span> در حال ذخیره‌سازی...';
            btn.classList.add('opacity-90', 'cursor-wait');

            const payload = {
                action: "submit_schema",
                schema: schema
            };

            // ترفند طلایی: ارسال پیام به صورت متنی در چت ادمین برای شکار توسط هندلر پایتون
            try {
                window.Bale.WebApp.sendText(JSON.stringify(payload));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                alert("خطا در ارتباط با سرور.");
                btn.innerHTML = '💾 ذخیره و اعمال نهایی در ربات';
                btn.classList.remove('opacity-90', 'cursor-wait');
            }
        }

        // رندر اولیه
        renderFields();
    </script>
</body>
</html>
