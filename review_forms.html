<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بررسی فرم‌های ارسالی</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen selection:bg-indigo-100">

    <!-- ========================================== -->
    <!-- VIEW 1: لیست فرم‌های در انتظار بررسی -->
    <!-- ========================================== -->
    <div id="listView" class="flex flex-col h-full fade-in">
        <div class="sticky top-0 z-20 bg-white/90 backdrop-blur-xl border-b border-slate-200/60 p-4 shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl shadow-inner border border-indigo-100">📥</div>
                <div>
                    <h1 class="text-sm font-extrabold text-indigo-700">کارتابل بررسی فرم‌ها</h1>
                    <p class="text-[11px] text-slate-400 mt-0.5">فرم مورد نظر را برای مشاهده جزئیات انتخاب کنید</p>
                </div>
            </div>
        </div>

        <div class="flex-grow overflow-y-auto p-4 pb-28">
            <div id="formsListContainer" class="space-y-3">
                <!-- کارت‌ها اینجا رندر می‌شوند -->
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg p-4 border-t border-slate-200/60 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
            <button onclick="closeApp()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold p-3.5 rounded-2xl text-sm transition-all active:scale-[0.98] flex justify-center items-center gap-2">
                🔙 بازگشت به منوی اصلی
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 2: جزئیات فرم و پاسخ‌ها -->
    <!-- ========================================== -->
    <div id="detailView" class="hidden flex flex-col h-full bg-slate-50 fade-in">
        <div class="sticky top-0 z-20 bg-white/90 backdrop-blur-xl border-b border-slate-200/60 p-4 shadow-sm flex items-center gap-3">
            <button onclick="backToList()" class="w-9 h-9 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center hover:bg-slate-200 transition-colors active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
            <div class="flex-1 min-w-0">
                <h2 id="detailTitle" class="text-xs font-extrabold text-slate-800 truncate">عنوان فرم</h2>
                <p id="detailSubtitle" class="text-[10px] text-slate-400 font-bold truncate mt-0.5">توسط...</p>
            </div>
        </div>

        <div class="flex-grow overflow-y-auto p-4 pb-32 space-y-4">
            <!-- اطلاعات پایه -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-3 slide-up">
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400">کد رهگیری</p>
                        <p id="detailCode" class="text-xs font-black text-indigo-600 mt-0.5">5000</p>
                    </div>
                    <div class="text-left">
                        <p class="text-[10px] font-bold text-slate-400">زمان ارسال</p>
                        <p id="detailTime" class="text-xs font-bold text-slate-700 mt-0.5">-</p>
                    </div>
                </div>
                <div class="flex justify-between items-center px-1">
                    <span class="text-[11px] font-bold text-slate-500">فاصله تا تکمیل:</span>
                    <span id="detailElapsed" class="text-xs font-extrabold text-indigo-600">-</span>
                </div>
                <div id="detailReasonBox" class="hidden pt-3 border-t border-rose-100">
                    <p class="text-[10px] font-bold text-rose-500 mb-1">⚠️ سابقه ارجاع قبلی:</p>
                    <p id="detailReason" class="text-xs font-medium text-rose-600 bg-rose-50 p-2.5 rounded-xl border border-rose-100"></p>
                </div>
            </div>

            <!-- پاسخ‌ها -->
            <div class="space-y-3 slide-up" style="animation-delay: 0.1s;">
                <h3 class="text-xs font-extrabold text-slate-700 px-1 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span> پاسخ‌های ثبت شده
                </h3>
                <div id="answersContainer" class="space-y-3">
                    <!-- پاسخ‌ها اینجا رندر می‌شوند -->
                </div>
            </div>
        </div>

        <!-- دکمه‌های عملیاتی -->
        <div class="fixed bottom-0 left-0 right-0 bg-white p-4 border-t border-slate-200/80 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)] flex gap-2.5 pb-safe z-40">
            <button onclick="openReturnModal()" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold p-3.5 rounded-2xl text-xs transition-all active:scale-[0.98] flex justify-center items-center gap-1">
                🔄 ارجاع
            </button>
            <button id="btnApprove" onclick="submitAction('approve')" class="flex-[2] bg-emerald-500 hover:bg-emerald-600 text-white font-bold p-3.5 rounded-2xl text-xs shadow-md shadow-emerald-200 transition-all active:scale-[0.98] flex justify-center items-center gap-1">
                ✅ تایید نهایی
            </button>
            <button id="btnSyncApprove" onclick="submitAction('sync_and_approve')" class="hidden flex-[2] bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3.5 rounded-2xl text-xs shadow-md shadow-indigo-200 transition-all active:scale-[0.98] flex justify-center items-center gap-1">
                📂 همگام‌سازی و تایید
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL: دلیل ارجاع -->
    <!-- ========================================== -->
    <div id="returnModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 fade-in">
        <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl slide-up">
            <h3 class="text-sm font-extrabold text-slate-800 mb-2">🔄 ارجاع فرم به کارشناس</h3>
            <p class="text-xs text-slate-500 mb-4">لطفاً دلیل ارجاع و نیاز به اصلاح را بنویسید:</p>
            
            <textarea id="returnReasonInput" rows="3" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 focus:ring-2 focus:ring-rose-400 outline-none resize-none placeholder-slate-400" placeholder="مثلاً: فایل پیوست ناقص است..."></textarea>
            
            <div class="mt-5 flex gap-3">
                <button onclick="closeReturnModal()" class="w-1/3 bg-slate-100 text-slate-600 font-bold p-3 rounded-xl text-xs active:scale-95">انصراف</button>
                <button onclick="submitAction('return')" class="w-2/3 bg-rose-500 text-white font-bold p-3 rounded-xl text-xs shadow-md shadow-rose-200 active:scale-95">ارسال ارجاع</button>
            </div>
        </div>
    </div>

    <script>
        let formsData = [];
        let currentFormId = null;

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                if (compressedData) {
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    formsData = JSON.parse(decompressed);
                    renderList();
                }
            } catch(e) { console.error(e); }
        }

        function renderList() {
            const container = document.getElementById('formsListContainer');
            container.innerHTML = '';

            if (formsData.length === 0) {
                container.innerHTML = `<div class="text-center p-8 text-slate-400 font-bold text-sm bg-white rounded-2xl border border-slate-200/60 shadow-sm mt-4">📭 کارتابل خالی است.</div>`;
                return;
            }

            formsData.forEach((form, index) => {
                const delay = index * 0.05;
                const rosterBadge = form.is_roster === 1 ? '<span class="bg-indigo-50 text-indigo-600 border border-indigo-100 text-[9px] font-extrabold px-2 py-0.5 rounded-lg">نیاز به همگام‌سازی</span>' : '';
                const reasonBadge = form.reason ? '<span class="bg-rose-50 text-rose-600 border border-rose-100 text-[9px] font-extrabold px-2 py-0.5 rounded-lg">سابقه ارجاع</span>' : '';

                const card = document.createElement('div');
                card.className = `bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 slide-up cursor-pointer hover:border-indigo-400 hover:shadow-md transition-all`;
                card.style.animationDelay = `${delay}s`;
                card.onclick = () => openDetail(index);
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <h3 class="text-xs font-extrabold text-slate-800 line-clamp-1 flex-1">${form.title}</h3>
                        <span class="text-[10px] font-black text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md border border-slate-200">${form.t_code}</span>
                    </div>
                    <div class="flex items-center gap-1.5 text-xs font-bold text-slate-600 mb-3">
                        <span class="text-slate-400 text-sm">👤</span>
                        <span class="truncate">${form.u_name} <span class="text-[10px] text-slate-400 font-normal">(${form.u_group})</span></span>
                    </div>
                    <div class="flex justify-between items-center pt-2.5 border-t border-slate-50 text-[10px] font-bold text-slate-400">
                        <span>🕒 ${form.sub_at}</span>
                        <div class="flex gap-1">${rosterBadge}${reasonBadge}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openDetail(index) {
            const form = formsData[index];
            currentFormId = form.r_id;

            document.getElementById('detailTitle').innerText = form.title;
            document.getElementById('detailSubtitle').innerText = `${form.u_name} (${form.u_group})`;
            document.getElementById('detailCode').innerText = form.t_code;
            document.getElementById('detailTime').innerText = form.sub_at;
            document.getElementById('detailElapsed').innerText = form.elapsed;

            if (form.reason) {
                document.getElementById('detailReasonBox').classList.remove('hidden');
                document.getElementById('detailReason').innerText = form.reason;
            } else {
                document.getElementById('detailReasonBox').classList.add('hidden');
            }

            if (form.is_roster === 1) {
                document.getElementById('btnApprove').classList.add('hidden');
                document.getElementById('btnSyncApprove').classList.remove('hidden');
            } else {
                document.getElementById('btnApprove').classList.remove('hidden');
                document.getElementById('btnSyncApprove').classList.add('hidden');
            }

            const ansContainer = document.getElementById('answersContainer');
            ansContainer.innerHTML = '';

            form.answers.forEach((ans, i) => {
                let ansHtml = '';
                
                if (ans.t === 'member_checklist' && Array.isArray(ans.a)) {
                    let listHtml = '';
                    ans.a.forEach((item, j) => {
                        listHtml += `<div class="text-xs font-bold text-slate-700 py-2 px-1 border-b border-slate-100 last:border-0 flex items-center justify-between"><div class="flex items-center gap-2"><span class="text-indigo-600 bg-indigo-50 w-5 h-5 flex items-center justify-center rounded-md text-[10px] font-black">${j+1}</span> ${item.n}</div> <span class="text-[10px] text-slate-500 font-bold bg-slate-100 px-2 py-0.5 rounded">${item.y}</span></div>`;
                    });
                    ansHtml = `<div class="bg-slate-50 rounded-xl p-2.5 border border-slate-200/60 mt-2">${listHtml || '<span class="text-xs text-slate-400 p-2 block text-center">خالی</span>'}</div>`;
                } 
                else if (ans.t === 'multi_record' && typeof ans.a === 'object' && ans.a.recs) {
                    let recsHtml = '';
                    ans.a.recs.forEach((rec, j) => {
                        let fieldsHtml = '';
                        ans.a.schema.forEach(sch => {
                            fieldsHtml += `<div class="flex justify-between py-1.5 border-b border-slate-100 last:border-0"><span class="text-[10px] font-bold text-slate-400">${sch.label}</span><span class="text-xs font-black text-slate-700">${rec[sch.id] || '-'}</span></div>`;
                        });
                        recsHtml += `<div class="bg-white border border-slate-200/80 rounded-xl p-3 mb-2 last:mb-0 shadow-2xs"><div class="text-[10px] font-black text-indigo-600 mb-2 bg-indigo-50 px-2 py-0.5 rounded inline-block">مورد ${j+1}</div>${fieldsHtml}</div>`;
                    });
                    ansHtml = `<div class="bg-slate-50 rounded-xl p-2.5 border border-slate-200/60 mt-2">${recsHtml || '<span class="text-xs text-slate-400 p-2 block text-center">خالی</span>'}</div>`;
                }
                else {
                    ansHtml = `<div class="bg-slate-50 rounded-xl p-3 border border-slate-200/60 mt-2"><p class="text-xs font-bold text-slate-800 whitespace-pre-wrap leading-relaxed">${ans.a}</p></div>`;
                }

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80";
                card.innerHTML = `
                    <h4 class="text-[11px] font-black text-slate-400 uppercase leading-relaxed flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>
                        ${ans.q}
                    </h4>
                    ${ansHtml}
                `;
                ansContainer.appendChild(card);
            });

            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function backToList() {
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('listView').classList.remove('hidden');
            currentFormId = null;
        }

        function openReturnModal() {
            document.getElementById('returnReasonInput').value = '';
            document.getElementById('returnModal').classList.remove('hidden');
        }

        function closeReturnModal() {
            document.getElementById('returnModal').classList.add('hidden');
        }

        window.Bale.WebApp.ready();

        function submitAction(actionType) {
            let reason = "";
            if (actionType === 'return') {
                reason = document.getElementById('returnReasonInput').value.trim();
                if (!reason) reason = "نیاز به بررسی و اصلاح مجدد";
                closeReturnModal();
            }

            const btns = document.querySelectorAll('#detailView button');
            btns.forEach(b => { b.classList.add('opacity-50', 'pointer-events-none'); });

            if (actionType === 'approve') {
                document.getElementById('btnApprove').innerHTML = '⏳ در حال تایید...';
            } else if (actionType === 'sync_and_approve') {
                document.getElementById('btnSyncApprove').innerHTML = '⏳ در حال همگام‌سازی...';
            }

            const payload = {
                action: "submit_review_form",
                sub_action: actionType,
                r_id: currentFormId,
                reason: reason
            };

            try {
                window.Bale.WebApp.sendData(JSON.stringify(payload));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                btns.forEach(b => { b.classList.remove('opacity-50', 'pointer-events-none'); });
                if (actionType === 'approve') {
                    document.getElementById('btnApprove').innerHTML = '✅ تایید نهایی';
                } else if (actionType === 'sync_and_approve') {
                    document.getElementById('btnSyncApprove').innerHTML = '📂 همگام‌سازی و تایید';
                }
            }
        }

        function closeApp() {
            try { window.Bale.WebApp.close(); } catch (e) { console.log(e); }
        }

        init();
    </script>
</body>
</html>
