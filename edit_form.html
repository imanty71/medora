<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استودیوی ویرایش فرم</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Toggle Switch Styles */
        .toggle-checkbox:checked { right: 0; border-color: #4f46e5; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4f46e5; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { width: 3rem; height: 1.5rem; background-color: #cbd5e1; border-radius: 9999px; transition: all 0.3s; }
        .toggle-checkbox:checked { transform: translateX(-1.5rem); }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen selection:bg-indigo-100">

    <!-- هدر شیشه‌ای -->
    <div class="sticky top-0 z-30 bg-white/80 backdrop-blur-xl border-b border-slate-200/60 px-5 py-4 shadow-sm">
        <div class="max-w-lg mx-auto flex items-center gap-4">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl shadow-inner border border-indigo-100/50">🛠</div>
            <div>
                <h1 class="text-base font-extrabold text-slate-800 tracking-tight">استودیوی جامع ویرایش</h1>
                <p class="text-[11px] text-slate-500 font-medium mt-0.5" id="headerSubtitle">در حال بارگذاری اطلاعات فرم...</p>
            </div>
        </div>
    </div>

    <div class="p-5 flex-grow overflow-y-auto space-y-6 pb-28 max-w-lg w-full mx-auto fade-in">
        
        <!-- ========================================== -->
        <!-- بخش ۱: اطلاعات پایه -->
        <!-- ========================================== -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4 slide-up">
            <h2 class="text-xs font-black text-indigo-600 uppercase tracking-wider mb-2 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-indigo-500"></span> اطلاعات پایه فرم
            </h2>
            
            <div>
                <label class="block text-[11px] font-bold text-slate-500 mb-1.5 ml-1">عنوان فرم <span class="text-rose-500">*</span></label>
                <input type="text" id="inpTitle" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 focus:ring-2 focus:ring-indigo-400 focus:bg-white transition-all outline-none">
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-500 mb-1.5 ml-1">توضیحات فرم</label>
                <textarea id="inpDesc" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 focus:ring-2 focus:ring-indigo-400 focus:bg-white transition-all outline-none resize-none"></textarea>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-500 mb-1.5 ml-1">گروه‌های هدف (با کاما جدا کنید)</label>
                <input type="text" id="inpGroups" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 focus:ring-2 focus:ring-indigo-400 focus:bg-white transition-all outline-none" placeholder="مثال: بیماری‌های داخلی, جراحی عمومی">
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-500 mb-1.5 ml-1">تغییر مهلت عمومی</label>
                <select id="inpDeadline" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-indigo-700 focus:ring-2 focus:ring-indigo-400 outline-none appearance-none cursor-pointer">
                    <option value="-1">بدون تغییر (حفظ مهلت فعلی)</option>
                    <option value="0">حذف مهلت (بدون محدودیت)</option>
                    <option value="1">تنظیم مهلت جدید: ۱ روز</option>
                    <option value="3">تنظیم مهلت جدید: ۳ روز</option>
                    <option value="7">تنظیم مهلت جدید: ۷ روز</option>
                    <option value="14">تنظیم مهلت جدید: ۱۴ روز</option>
                </select>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- بخش ۲: تنظیمات پیشرفته -->
        <!-- ========================================== -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-5 slide-up" style="animation-delay: 0.1s;">
            <h2 class="text-xs font-black text-indigo-600 uppercase tracking-wider mb-2 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-indigo-500"></span> تنظیمات پیشرفته
            </h2>

            <div class="flex items-center justify-between bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                <div>
                    <p class="text-sm font-bold text-slate-700">بروزرسانی آرشیو دستیاران</p>
                    <p class="text-[10px] text-slate-400 mt-0.5">اعمال تغییرات در دیتابیس اصلی دانشگاه</p>
                </div>
                <div class="relative inline-block w-12 h-6 align-middle select-none">
                    <input type="checkbox" id="tglRoster" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer m-0 p-0"/>
                    <label for="tglRoster" class="toggle-label block overflow-hidden h-6 rounded-full cursor-pointer"></label>
                </div>
            </div>

            <div class="flex items-center justify-between bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                <div>
                    <p class="text-sm font-bold text-slate-700">ذخیره به عنوان الگو (Template)</p>
                    <p class="text-[10px] text-slate-400 mt-0.5">اضافه شدن به بانک الگوهای آماده</p>
                </div>
                <div class="relative inline-block w-12 h-6 align-middle select-none">
                    <input type="checkbox" id="tglTemplate" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer m-0 p-0"/>
                    <label for="tglTemplate" class="toggle-label block overflow-hidden h-6 rounded-full cursor-pointer"></label>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- بخش ۳: هسته سوالات -->
        <!-- ========================================== -->
        <div class="slide-up" style="animation-delay: 0.2s;">
            <div class="flex justify-between items-center mb-4 px-1">
                <h2 class="text-xs font-black text-indigo-600 uppercase tracking-wider flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-500"></span> ویرایش سوالات
                </h2>
                <span id="lockBadge" class="hidden bg-amber-100 text-amber-600 text-[10px] font-bold px-2 py-1 rounded-lg">🔒 دارای پاسخ</span>
            </div>

            <div id="questionsContainer" class="space-y-4">
                <!-- سوالات اینجا رندر می‌شوند -->
            </div>

            <button onclick="addNewQuestion()" class="mt-5 w-full bg-indigo-50/50 border-2 border-dashed border-indigo-200 text-indigo-600 hover:bg-indigo-50 font-bold p-4 rounded-2xl text-sm transition-all flex justify-center items-center gap-2 active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                افزودن سوال جدید به انتهای فرم
            </button>
        </div>

    </div>

    <!-- دکمه نهایی ثابت -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg p-4 border-t border-slate-200/60 pb-safe z-40">
        <div class="max-w-lg mx-auto">
            <button onclick="submitFormEdit()" id="submitBtn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold p-4 rounded-2xl text-sm shadow-lg shadow-teal-200/50 transition-all duration-200 active:scale-[0.98] flex justify-center items-center gap-2">
                💾 اعمال تغییرات و بروزرسانی فرم
            </button>
        </div>
    </div>

    <script>
        // متغیرهای سراسری
        let f_id = "";
        let resp_count = 0;
        let questions = []; // آرایه نگهداری وضعیت سوالات
        let newQCounter = 1;

        // خواندن و دیکد کردن دیتای ارسال شده از پایتون
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawData = urlParams.get('data');
            
            if (!rawData) {
                alert("خطا: اطلاعات فرم دریافت نشد.");
                return;
            }

            try {
                const data = JSON.parse(decodeURIComponent(rawData));
                
                f_id = data.f_id;
                resp_count = parseInt(data.rc) || 0;
                
                document.getElementById('headerSubtitle').innerText = `کد فرم: ${f_id.replace('frm_', '')}`;
                document.getElementById('inpTitle').value = data.t || "";
                document.getElementById('inpDesc').value = data.d || "";
                document.getElementById('inpGroups').value = data.g || "";
                document.getElementById('tglRoster').checked = data.ru === 1;

                if (resp_count > 0) {
                    document.getElementById('lockBadge').classList.remove('hidden');
                }

                // آماده‌سازی آرایه سوالات
                const qList = data.q || [];
                qList.forEach(qItem => {
                    let qId = qItem[0];
                    let qType = qItem[1];
                    let qTextRaw = qItem[2];
                    
                    let qText = qTextRaw;
                    let schemaStr = null;

                    // محافظت از اسکیمای فرم‌های داینامیک
                    if (qType === 'multi_record' && qTextRaw.includes('{')) {
                        try {
                            let parsed = JSON.parse(qTextRaw);
                            qText = parsed.q;
                            schemaStr = JSON.stringify(parsed.schema);
                        } catch(e) {}
                    }

                    questions.push({
                        id: qId,
                        type: qType,
                        q: qText,
                        schema: schemaStr,
                        is_new: false,
                        is_deleted: false
                    });
                });

                renderQuestions();

            } catch (error) {
                console.error("Parse Error:", error);
                alert("خطا در پردازش اطلاعات فرم.");
            }
        }

        // رندر کردن لیست سوالات
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            let visibleIndex = 1;

            questions.forEach((q, arrayIndex) => {
                if (q.is_deleted) return;

                // اگر سوال دارای پاسخ است، تغییر نوع آن قفل می‌شود
                const isTypeLocked = (resp_count > 0 && !q.is_new);
                const lockIcon = isTypeLocked ? '🔒' : '⚙️';

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-[0_2px_10px_rgb(0,0,0,0.03)] border border-slate-100 flex flex-col gap-3 relative slide-up group";
                
                // دکمه حذف
                const deleteBtn = `
                    <button onclick="deleteQuestion(${arrayIndex})" class="absolute top-4 left-4 text-rose-400 hover:text-rose-600 bg-rose-50 p-1.5 rounded-lg transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;

                card.innerHTML = `
                    ${deleteBtn}
                    <div class="pr-2 pl-8">
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">سوال ${visibleIndex}</label>
                        <textarea rows="2" onchange="updateQText(${arrayIndex}, this.value)" class="w-full bg-transparent border-b-2 border-slate-100 focus:border-indigo-500 text-sm font-extrabold text-slate-800 pb-1 focus:outline-none transition-colors resize-none placeholder-slate-300" placeholder="متن سوال را بنویسید...">${q.q}</textarea>
                    </div>

                    <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-100 mt-1">
                        <div class="flex items-center gap-2 w-full">
                            <span class="text-sm">${lockIcon}</span>
                            <div class="flex flex-col w-full">
                                <span class="text-[9px] font-bold text-slate-400 uppercase">نوع پاسخ</span>
                                <select onchange="updateQType(${arrayIndex}, this.value)" ${isTypeLocked ? 'disabled' : ''} class="bg-transparent text-xs font-bold text-indigo-700 focus:outline-none cursor-pointer appearance-none w-full">
                                    <option value="text" ${q.type === 'text' ? 'selected' : ''}>🔠 متن ساده</option>
                                    <option value="number" ${q.type === 'number' ? 'selected' : ''}>🔢 عدد صحیح</option>
                                    <option value="mixed" ${q.type === 'mixed' ? 'selected' : ''}>📧 ترکیبی (متن و عدد)</option>
                                    <option value="member_checklist" ${q.type === 'member_checklist' ? 'selected' : ''}>👥 چک‌لیست اعضای گروه</option>
                                    <option value="multi_record" ${q.type === 'multi_record' ? 'selected' : ''}>📋 فرم داینامیک چندگانه</option>
                                </select>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
                visibleIndex++;
            });
        }

        function updateQText(index, val) {
            questions[index].q = val;
        }

        function updateQType(index, val) {
            // اگر نوع سوال به چیزی غیر از multi_record تغییر کرد، اسکیمای آن را پاک کن
            if (val !== 'multi_record') {
                questions[index].schema = null;
            } else if (val === 'multi_record' && !questions[index].schema) {
                // اگر به multi_record تغییر کرد و اسکیما نداشت، یک اسکیمای پیش‌فرض بساز
                questions[index].schema = JSON.stringify([
                    { id: "f_def1", label: "نام و نام خانوادگی", type: "text", req: true }
                ]);
            }
            questions[index].type = val;
        }

        function deleteQuestion(index) {
            if (resp_count > 0 && !questions[index].is_new) {
                if (!confirm("⚠️ هشدار خطرناک: این فرم دارای پاسخ ثبت شده است. حذف این سوال باعث می‌شود دیتای پاسخ‌های قبلی مربوط به این سوال برای همیشه از بین برود! آیا مطمئن هستید؟")) {
                    return;
                }
            }
            questions[index].is_deleted = true;
            renderQuestions();
        }

        function addNewQuestion() {
            questions.push({
                id: `new_${newQCounter++}`,
                type: 'text',
                q: '',
                schema: null,
                is_new: true,
                is_deleted: false
            });
            renderQuestions();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        window.Bale.WebApp.ready();

        function submitFormEdit() {
            // ۱. اعتبارسنجی
            const title = document.getElementById('inpTitle').value.trim();
            if (!title) {
                alert("لطفاً عنوان فرم را وارد کنید.");
                return;
            }

            const activeQuestions = questions.filter(q => !q.is_deleted);
            if (activeQuestions.length === 0) {
                alert("فرم باید حداقل دارای یک سوال باشد.");
                return;
            }

            let hasEmptyQ = false;
            activeQuestions.forEach(q => {
                if (!q.q.trim()) hasEmptyQ = true;
            });
            if (hasEmptyQ) {
                alert("متن هیچ سوالی نمی‌تواند خالی باشد.");
                return;
            }

            // ۲. آماده‌سازی پکیج نهایی
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<span class="animate-spin text-lg">⏳</span> در حال ذخیره‌سازی...';
            btn.classList.add('opacity-90', 'cursor-wait');

            // بازسازی JSON برای سوالات multi_record
            const finalQuestions = questions.map(q => {
                let finalQText = q.q;
                if (q.type === 'multi_record' && q.schema) {
                    try {
                        finalQText = JSON.stringify({
                            q: q.q,
                            schema: JSON.parse(q.schema)
                        });
                    } catch(e) {}
                }
                return {
                    id: q.id,
                    is_deleted: q.is_deleted,
                    is_new: q.is_new,
                    q: finalQText,
                    type: q.type
                };
            });

            const payload = {
                action: "submit_form_edit",
                f_id: f_id,
                title: title,
                desc: document.getElementById('inpDesc').value.trim(),
                groups: document.getElementById('inpGroups').value.trim(),
                deadline_days: parseInt(document.getElementById('inpDeadline').value),
                is_roster: document.getElementById('tglRoster').checked ? 1 : 0,
                save_template: document.getElementById('tglTemplate').checked,
                questions: finalQuestions
            };

            // ۳. ارسال به پایتون
            try {
                window.Bale.WebApp.sendData(JSON.stringify(payload));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                alert("خطا در ارتباط با سرور.");
                btn.innerHTML = '💾 اعمال تغییرات و بروزرسانی فرم';
                btn.classList.remove('opacity-90', 'cursor-wait');
            }
        }

        // اجرا در زمان لود صفحه
        init();
    </script>
</body>
</html>
