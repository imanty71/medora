<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مرکز نظرسنجی و ارزشیابی</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://tapi.bale.ai/miniapp.js?3"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
body{font-family:Vazirmatn,sans-serif;background:#020617;color:#e2e8f0;-webkit-font-smoothing:antialiased}
.card{background:linear-gradient(145deg,rgba(15,23,42,.94),rgba(2,6,23,.98));border:1px solid rgba(148,163,184,.14);box-shadow:0 20px 55px rgba(0,0,0,.24)}
.inp{background:rgba(15,23,42,.86);border:1px solid rgba(148,163,184,.18)}
.on{background:rgba(37,99,235,.30)!important;border-color:rgba(96,165,250,.72)!important;color:#dbeafe!important;box-shadow:0 0 0 1px rgba(96,165,250,.12) inset}
.progress-track{height:7px;background:rgba(148,163,184,.13);border-radius:999px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#2563eb,#14b8a6);border-radius:999px;transition:width .2s ease}
.err{background:rgba(244,63,94,.12);border:1px solid rgba(251,113,133,.35);color:#fecdd3}
.ok{background:rgba(16,185,129,.12);border:1px solid rgba(52,211,153,.3);color:#a7f3d0}
</style>
</head>
<body class="min-h-screen pb-32">
<header class="sticky top-0 z-20 bg-slate-950 border-b border-white/10 p-4">
  <div class="max-w-2xl mx-auto">
    <div class="flex justify-between gap-3 items-start">
      <div class="min-w-0"><h1 id="title" class="text-sm font-black text-white">مرکز نظرسنجی و ارزشیابی</h1><p id="desc" class="text-[10px] text-slate-400 leading-5 mt-1">در حال دریافت اطلاعات...</p></div>
      <button type="button" id="drawerBtn" class="text-[10px] font-black bg-white/5 px-3 py-2 rounded-xl">فرم‌ها ▾</button>
    </div>
    <div class="flex gap-2 mt-2 flex-wrap">
      <span id="sourceBadge" class="hidden text-[9px] bg-violet-500/10 text-violet-300 border border-violet-400/20 px-2.5 py-1 rounded-full"></span>
      <span id="codeBadge" class="hidden text-[9px] bg-amber-500/10 text-amber-200 border border-amber-400/20 px-2.5 py-1 rounded-full"></span>
      <span id="statusBadge" class="hidden text-[9px] bg-rose-500/10 text-rose-300 border border-rose-400/20 px-2.5 py-1 rounded-full"></span>
      <span id="anonBadge" class="hidden text-[9px] bg-emerald-500/10 text-emerald-300 border border-emerald-400/20 px-2.5 py-1 rounded-full"></span>
    </div>
  </div>
</header>
<div id="drawer" class="hidden fixed inset-0 z-40 bg-black/70 p-0">
  <div class="absolute bottom-0 left-0 right-0 card rounded-t-[28px] p-4 max-h-[72vh] overflow-y-auto">
    <div class="flex justify-between mb-3"><b class="text-xs">نظرسنجی‌ها و ارزشیابی‌های شما</b><button type="button" id="drawerClose">✕</button></div>
    <div id="surveyList" class="space-y-2"></div>
  </div>
</div>
<main class="max-w-2xl mx-auto p-4 space-y-4">
  <section id="progressBox" class="card rounded-3xl p-4 hidden">
    <div class="flex items-center justify-between gap-3 mb-2"><b id="progressText" class="text-[10px] text-slate-200">—</b><span id="answeredText" class="text-[9px] text-slate-400">—</span></div>
    <div class="progress-track"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
  </section>
  <div id="notice" class="hidden rounded-2xl p-3 text-[10px] font-bold leading-6"></div>
  <section id="questionHost"></section>
</main>
<footer class="fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-white/10 p-3">
  <div class="max-w-2xl mx-auto grid grid-cols-3 gap-2">
    <button id="prevBtn" type="button" class="bg-slate-800 text-slate-200 font-black text-[10px] p-3.5 rounded-2xl">→ قبلی</button>
    <button id="nextBtn" type="button" class="col-span-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black text-[10px] p-3.5 rounded-2xl">بعدی ←</button>
  </div>
</footer>
<script>
(function(){
var payload={},surveys=[],currentSurvey=null,answers={},qIndex=0,sending=false;
function byId(id){return document.getElementById(id);}
function esc(v){return String(v===undefined||v===null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function enc(v){return encodeURIComponent(String(v===undefined||v===null?'':v));}
function faNum(v){return String(v).replace(/[0-9]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[Number(d)];});}
function show(el){if(el){el.className=el.className.replace(/\bhidden\b/g,'').replace(/\s+/g,' ').trim();}}
function hide(el){if(el&&(' '+el.className+' ').indexOf(' hidden ')<0){el.className+=' hidden';}}
function notice(msg,type){var n=byId('notice');n.innerText=msg;n.className='rounded-2xl p-3 text-[10px] font-bold leading-6 '+(type==='ok'?'ok':'err');show(n);window.scrollTo(0,0);}
function clearNotice(){var n=byId('notice');hide(n);n.innerText='';}
function statusText(s){if(s.expired){return '⛔ منقضی';}if(s.answered&&!s.allow_multiple){return '✅ پاسخ داده‌اید';}if(s.answered&&s.allow_multiple){return '✅ پاسخ ثبت شده؛ پاسخ مجدد مجاز است';}return '🔴 در انتظار پاسخ';}
function toggleDrawer(){var d=byId('drawer');if(!d){return;}if((' '+d.className+' ').indexOf(' hidden ')>=0){show(d);}else{hide(d);}}
function readPayload(){var q=window.location.search||'',m=q.match(/[?&]d=([^&]+)/),p,b,a,i;if(!m){throw new Error('payload-missing');}if(typeof window.pako==='undefined'){throw new Error('pako-missing');}p=m[1];b=window.atob(p.replace(/-/g,'+').replace(/_/g,'/'));a=new Uint8Array(b.length);for(i=0;i<b.length;i++){a[i]=b.charCodeAt(i);}return JSON.parse(window.pako.inflate(a,{to:'string'}));}
function renderDrawer(){var box=byId('surveyList'),i,s,btn,meta;if(!box){return;}box.innerHTML='';if(!surveys.length){box.innerHTML='<div class="text-center text-xs text-slate-500 py-5">نظرسنجی‌ای برای شما ثبت نشده است.</div>';return;}for(i=0;i<surveys.length;i++){s=surveys[i];btn=document.createElement('button');btn.type='button';btn.className='w-full inp rounded-2xl p-3 text-right';meta='🏢 '+esc(s.source||'—')+' • 📟 '+esc(s.tracking_code===undefined||s.tracking_code===null?'—':s.tracking_code)+' • '+esc((s.questions||[]).length)+' سؤال';btn.innerHTML='<div class="flex justify-between gap-2"><b class="text-xs text-white">'+esc(s.title)+'</b><span class="text-[8px] text-slate-400">'+esc(statusText(s))+'</span></div><div class="text-[9px] text-slate-400 mt-1">'+meta+'</div>';(function(idx){btn.onclick=function(){currentSurvey=surveys[idx];answers={};qIndex=0;clearNotice();toggleDrawer();render();};})(i);box.appendChild(btn);}}
function scaleButtons(q,vals){var html='<div class="grid grid-cols-2 gap-2">',i,v;for(i=0;i<vals.length;i++){v=vals[i];html+='<button type="button" data-scale="'+esc(q.id)+'" data-val="'+esc(v.v)+'" class="inp rounded-2xl p-3 text-[11px] font-bold '+(answers[q.id]===v.v?'on':'')+'">'+esc(v.l)+'</button>';}return html+'</div>';}
function body(q){var t=q.type,opts=q.options||[],v=answers[q.id],i,x,html,a,sv,ranks,rows,cols,obj,r,c;if(t==='likert3'){return scaleButtons(q,[{v:1,l:'ضعیف'},{v:2,l:'متوسط'},{v:3,l:'خوب'}]);}if(t==='likert5'){return scaleButtons(q,[{v:1,l:'کاملاً مخالف'},{v:2,l:'مخالف'},{v:3,l:'نظری ندارم'},{v:4,l:'موافق'},{v:5,l:'کاملاً موافق'}]);}if(t==='likert7'){a=[];for(i=1;i<=7;i++){a.push({v:i,l:faNum(i)});}return scaleButtons(q,a);}if(t==='star'){html='<div class="flex justify-center gap-4 py-3" dir="ltr">';for(i=1;i<=5;i++){html+='<button type="button" data-star="'+esc(q.id)+'" data-val="'+i+'" class="text-4xl '+(i<=(v||0)?'text-amber-300':'text-slate-700')+'">★</button>';}return html+'</div>';}if(t==='score10'||t==='nps'){a=[];for(i=(t==='nps'?0:1);i<=10;i++){a.push({v:i,l:faNum(i)});}return scaleButtons(q,a);}if(t==='yesno'){return '<div class="grid grid-cols-2 gap-2"><button type="button" data-choice="'+esc(q.id)+'" data-val="'+enc('بله')+'" class="inp rounded-2xl p-4 text-sm font-bold '+(v==='بله'?'on':'')+'">✅ بله</button><button type="button" data-choice="'+esc(q.id)+'" data-val="'+enc('خیر')+'" class="inp rounded-2xl p-4 text-sm font-bold '+(v==='خیر'?'on':'')+'">❌ خیر</button></div>';}if(t==='choice'){html='<div class="space-y-2">';for(i=0;i<opts.length;i++){x=opts[i];html+='<button type="button" data-choice="'+esc(q.id)+'" data-val="'+enc(x)+'" class="w-full inp rounded-2xl p-4 text-right text-xs font-bold '+(v===x?'on':'')+'">'+esc(x)+'</button>';}return html+'</div>';}if(t==='checkbox'){a=(v instanceof Array)?v:[];html='<div class="space-y-2">';for(i=0;i<opts.length;i++){x=opts[i];html+='<button type="button" data-check="'+esc(q.id)+'" data-val="'+enc(x)+'" class="w-full inp rounded-2xl p-4 text-right text-xs font-bold '+(a.indexOf(x)>=0?'on':'')+'">'+(a.indexOf(x)>=0?'☑':'☐')+' '+esc(x)+'</button>';}return html+'</div>';}if(t==='select'){html='<select data-input="'+esc(q.id)+'" class="inp w-full rounded-2xl p-4 text-xs"><option value="">انتخاب کنید...</option>';for(i=0;i<opts.length;i++){x=opts[i];html+='<option value="'+esc(x)+'" '+(v===x?'selected':'')+'>'+esc(x)+'</option>';}return html+'</select>';}if(t==='number'||t==='text'||t==='date'||t==='time'){return '<input type="'+(t==='text'?'text':t)+'" data-input="'+esc(q.id)+'" value="'+esc(v===undefined?'':v)+'" class="inp w-full rounded-2xl p-4 text-sm">';}if(t==='textarea'){return '<textarea rows="6" data-input="'+esc(q.id)+'" class="inp w-full rounded-2xl p-4 text-sm resize-none">'+esc(v===undefined?'':v)+'</textarea>';}if(t==='slider'){if(v===undefined||v===null){answers[q.id]=50;v=50;}sv=v;return '<div class="py-3"><input data-slider="'+esc(q.id)+'" type="range" min="0" max="100" value="'+esc(sv)+'" class="w-full"><div class="text-center text-blue-300 text-2xl font-black mt-3">'+faNum(sv)+'</div><div class="flex justify-between text-[9px] text-slate-500"><span>۰</span><span>۱۰۰</span></div></div>';}if(t==='ranking'){ranks=(v&&typeof v==='object')?v:{};html='<div class="space-y-3">';for(i=0;i<opts.length;i++){x=opts[i];html+='<div class="inp rounded-2xl p-3 flex justify-between items-center gap-3"><span class="text-xs font-bold flex-1">'+esc(x)+'</span><select data-rank-q="'+esc(q.id)+'" data-rank-o="'+enc(x)+'" class="bg-slate-900 rounded-xl p-2 text-xs"><option value="">رتبه</option>';for(r=1;r<=opts.length;r++){html+='<option value="'+r+'" '+(String(ranks[x])===String(r)?'selected':'')+'>'+faNum(r)+'</option>';}html+='</select></div>';}return html+'</div>';}if(t==='matrix'){rows=(q.config&&q.config.rows)?q.config.rows:[];cols=(q.config&&q.config.cols)?q.config.cols:['ضعیف','متوسط','خوب','عالی'];obj=(v&&typeof v==='object')?v:{};html='<div class="overflow-x-auto"><table class="w-full text-[10px]"><thead><tr><th class="p-2"></th>';for(i=0;i<cols.length;i++){html+='<th class="p-2 text-slate-400">'+esc(cols[i])+'</th>';}html+='</tr></thead><tbody>';for(r=0;r<rows.length;r++){html+='<tr><td class="p-2 font-bold">'+esc(rows[r])+'</td>';for(c=0;c<cols.length;c++){html+='<td class="p-2 text-center"><input type="radio" data-matrix-q="'+esc(q.id)+'" data-matrix-r="'+enc(rows[r])+'" data-matrix-c="'+enc(cols[c])+'" name="m_'+esc(q.id)+'_'+r+'" '+(obj[rows[r]]===cols[c]?'checked':'')+'></td>';}html+='</tr>';}return html+'</tbody></table></div>';}return '<div class="err rounded-2xl p-3 text-xs">نوع این سؤال در این نسخه پشتیبانی نمی‌شود.</div>';}
function bind(){var host=byId('questionHost'),els,i,el;els=host.querySelectorAll('[data-scale]');for(i=0;i<els.length;i++){el=els[i];el.onclick=function(){var raw=this.getAttribute('data-val');answers[this.getAttribute('data-scale')]=/^-?\d+(\.\d+)?$/.test(raw)?Number(raw):raw;clearNotice();renderQuestion();};}els=host.querySelectorAll('[data-star]');for(i=0;i<els.length;i++){el=els[i];el.onclick=function(){answers[this.getAttribute('data-star')]=Number(this.getAttribute('data-val'));clearNotice();renderQuestion();};}els=host.querySelectorAll('[data-choice]');for(i=0;i<els.length;i++){el=els[i];el.onclick=function(){answers[this.getAttribute('data-choice')]=decodeURIComponent(this.getAttribute('data-val'));clearNotice();renderQuestion();};}els=host.querySelectorAll('[data-check]');for(i=0;i<els.length;i++){el=els[i];el.onclick=function(){var id=this.getAttribute('data-check'),o=decodeURIComponent(this.getAttribute('data-val')),a=(answers[id] instanceof Array)?answers[id].slice():[],ix=a.indexOf(o);if(ix>=0){a.splice(ix,1);}else{a.push(o);}answers[id]=a;clearNotice();renderQuestion();};}els=host.querySelectorAll('[data-input]');for(i=0;i<els.length;i++){el=els[i];el.oninput=function(){answers[this.getAttribute('data-input')]=this.value;};}els=host.querySelectorAll('[data-slider]');for(i=0;i<els.length;i++){el=els[i];el.oninput=function(){answers[this.getAttribute('data-slider')]=Number(this.value);if(this.nextElementSibling){this.nextElementSibling.innerText=faNum(this.value);}clearNotice();};}els=host.querySelectorAll('[data-rank-q]');for(i=0;i<els.length;i++){el=els[i];el.onchange=function(){var id=this.getAttribute('data-rank-q'),o=decodeURIComponent(this.getAttribute('data-rank-o')),x=(answers[id]&&typeof answers[id]==='object')?answers[id]:{};if(this.value){x[o]=Number(this.value);}else{delete x[o];}answers[id]=x;};}els=host.querySelectorAll('[data-matrix-q]');for(i=0;i<els.length;i++){el=els[i];el.onchange=function(){var id=this.getAttribute('data-matrix-q'),r=decodeURIComponent(this.getAttribute('data-matrix-r')),c=decodeURIComponent(this.getAttribute('data-matrix-c')),x=(answers[id]&&typeof answers[id]==='object')?answers[id]:{};x[r]=c;answers[id]=x;};}}
function empty(v){var k;if(v===undefined||v===null||v===''){return true;}if(v instanceof Array&&v.length===0){return true;}if(typeof v==='object'&&!(v instanceof Array)){for(k in v){if(Object.prototype.hasOwnProperty.call(v,k)){return false;}}return true;}return false;}
function validateQuestion(q){var v=answers[q.id],vals=[],seen={},k,rows,j;if(q.required&&empty(v)){return 'این سؤال اجباری است؛ لطفاً یک پاسخ انتخاب یا وارد کنید.';}if(q.type==='ranking'&&v){for(k in v){if(Object.prototype.hasOwnProperty.call(v,k)&&v[k]){vals.push(String(v[k]));}}for(j=0;j<vals.length;j++){if(seen[vals[j]]){return 'هر رتبه باید فقط یک‌بار استفاده شود.';}seen[vals[j]]=1;}if(q.required&&(q.options||[]).length!==vals.length){return 'برای تمام گزینه‌ها باید رتبه تعیین کنید.';}}if(q.type==='matrix'&&q.required){rows=(q.config&&q.config.rows)?q.config.rows:[];v=v||{};for(j=0;j<rows.length;j++){if(!Object.prototype.hasOwnProperty.call(v,rows[j])){return 'تمام ردیف‌های جدول باید پاسخ داده شوند.';}}}return '';}
function renderQuestion(){var qs=(currentSurvey&&currentSurvey.questions)||[],q,host,total,answered=0,i,pct,prev,next;if(!currentSurvey){return;}total=qs.length;for(i=0;i<total;i++){if(!empty(answers[qs[i].id])){answered++;}}byId('answeredText').innerText=faNum(answered)+' پاسخ از '+faNum(total);byId('progressText').innerText='سؤال '+faNum(qIndex+1)+' از '+faNum(total);pct=total?Math.round(((qIndex+1)/total)*100):0;byId('progressFill').style.width=pct+'%';show(byId('progressBox'));host=byId('questionHost');host.innerHTML='';if(!total){host.innerHTML='<div class="err rounded-3xl p-4 text-xs">این نظرسنجی هیچ سؤالی ندارد.</div>';return;}q=qs[qIndex];host.innerHTML='<div class="card rounded-[30px] p-5 space-y-5"><div class="flex items-start gap-3"><span class="w-9 h-9 shrink-0 flex items-center justify-center rounded-full bg-blue-500/15 text-blue-200 text-sm font-black">'+faNum(qIndex+1)+'</span><div class="min-w-0"><div class="text-[9px] text-slate-500 mb-1">'+(q.required?'پاسخ اجباری':'پاسخ اختیاری')+'</div><h2 class="text-base font-black text-white leading-8">'+esc(q.q)+'</h2></div></div>'+body(q)+'</div>';bind();prev=byId('prevBtn');next=byId('nextBtn');prev.disabled=(qIndex===0);prev.className=qIndex===0?'bg-slate-900 text-slate-600 font-black text-[10px] p-3.5 rounded-2xl':'bg-slate-800 text-slate-100 font-black text-[10px] p-3.5 rounded-2xl';if(qIndex===total-1){next.innerText='📤 ثبت نهایی پاسخ‌ها';next.className='col-span-2 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-black text-[10px] p-3.5 rounded-2xl';}else{next.innerText='بعدی ←';next.className='col-span-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black text-[10px] p-3.5 rounded-2xl';}}
function render(){var b;if(!currentSurvey){byId('title').innerText='نظرسنجی‌ای وجود ندارد';byId('desc').innerText='مورد فعالی برای این حساب پیدا نشد.';byId('questionHost').innerHTML='<div class="card rounded-3xl p-4 text-center text-xs text-slate-400">موردی برای نمایش وجود ندارد.</div>';return;}byId('title').innerText=currentSurvey.title||'نظرسنجی';byId('desc').innerText=currentSurvey.description||'';b=byId('sourceBadge');b.innerText='🏢 '+(currentSurvey.source||'—');show(b);b=byId('codeBadge');b.innerText='📟 '+(currentSurvey.tracking_code===undefined||currentSurvey.tracking_code===null?'—':currentSurvey.tracking_code);show(b);b=byId('statusBadge');b.innerText=statusText(currentSurvey);show(b);b=byId('anonBadge');b.innerText=currentSurvey.is_anonymous?'🔒 پاسخ ناشناس':'👤 پاسخ با هویت';show(b);if(currentSurvey.expired){byId('questionHost').innerHTML='<div class="card rounded-3xl p-5 text-center text-xs text-slate-300">⛔ مهلت این نظرسنجی به پایان رسیده است.</div>';hide(byId('progressBox'));byId('prevBtn').disabled=true;byId('nextBtn').disabled=true;return;}if(currentSurvey.answered&&!currentSurvey.allow_multiple){byId('questionHost').innerHTML='<div class="card rounded-3xl p-5 text-center text-xs text-emerald-300">✅ پاسخ شما قبلاً ثبت شده است.</div>';hide(byId('progressBox'));byId('prevBtn').disabled=true;byId('nextBtn').disabled=true;return;}renderQuestion();}
function submitAll(){var qs=currentSurvey.questions||[],i,e;if(sending){return;}for(i=0;i<qs.length;i++){e=validateQuestion(qs[i]);if(e){qIndex=i;renderQuestion();notice('سؤال '+faNum(i+1)+': '+e,'err');return;}}try{if(!window.Bale||!window.Bale.WebApp||!window.Bale.WebApp.sendData){throw new Error('bale-api-missing');}sending=true;byId('nextBtn').disabled=true;byId('prevBtn').disabled=true;byId('nextBtn').innerText='⏳ در حال ارسال پاسخ‌ها...';notice('پاسخ‌ها کامل هستند و برای ثبت به ربات ارسال می‌شوند.','ok');window.Bale.WebApp.sendData(JSON.stringify({action:'submit_survey_response',survey_id:currentSurvey.id||currentSurvey.survey_id,answers:answers}));setTimeout(function(){try{if(window.Bale&&window.Bale.WebApp&&window.Bale.WebApp.close){window.Bale.WebApp.close();}}catch(ignore){}},1400);}catch(ex){sending=false;notice('ارسال پاسخ انجام نشد. لطفاً صفحه را ببندید و دوباره از ربات وارد شوید.','err');renderQuestion();}}
function goNext(){var qs=(currentSurvey&&currentSurvey.questions)||[],q,e;if(!qs.length||sending){return;}q=qs[qIndex];e=validateQuestion(q);if(e){notice('سؤال '+faNum(qIndex+1)+': '+e,'err');return;}clearNotice();if(qIndex<qs.length-1){qIndex++;renderQuestion();window.scrollTo(0,0);}else{submitAll();}}
function goPrev(){if(qIndex>0&&!sending){qIndex--;clearNotice();renderQuestion();window.scrollTo(0,0);}}
function boot(){try{payload=readPayload();surveys=payload.all_surveys||[];for(var i=0;i<surveys.length;i++){if(surveys[i].can_submit){currentSurvey=surveys[i];break;}}if(!currentSurvey&&surveys.length){currentSurvey=surveys[0];}renderDrawer();render();}catch(e){byId('title').innerText='خطا در بارگذاری نظرسنجی';byId('desc').innerText='اطلاعات صفحه دریافت نشد.';notice('خطا در خواندن اطلاعات نظرسنجی: '+String(e&&e.message?e.message:e),'err');}byId('drawerBtn').onclick=toggleDrawer;byId('drawerClose').onclick=toggleDrawer;byId('drawer').onclick=function(e){if(e.target===this){toggleDrawer();}};byId('prevBtn').onclick=goPrev;byId('nextBtn').onclick=goNext;try{if(window.Bale&&window.Bale.WebApp){window.Bale.WebApp.ready();}}catch(e){}}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();}
})();
</script>
