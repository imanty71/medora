<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>اتصال دستیاران به بله</title><link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet"><script src="https://tapi.bale.ai/miniapp.js?3"></script><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script><style>body{font-family:Vazirmatn,sans-serif;background:#020617;color:#e2e8f0}.card{background:linear-gradient(145deg,rgba(15,23,42,.86),rgba(2,6,23,.92));border:1px solid rgba(148,163,184,.12);backdrop-filter:blur(18px)}.inp{background:rgba(15,23,42,.78);border:1px solid rgba(148,163,184,.16)}.inp:focus{outline:none;border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.12)}</style></head><body class="min-h-screen pb-28"><header class="sticky top-0 z-20 bg-slate-950/90 backdrop-blur-xl border-b border-white/[.06] p-4"><h1 class="text-sm font-black text-white">📱 اتصال دستیاران به ربات بله</h1><p id="subtitle" class="text-[10px] text-slate-400 mt-1">شماره‌ای را وارد کنید که دستیار با همان شماره در بله فعال است.</p></header><main id="rows" class="p-4 max-w-2xl mx-auto space-y-3"></main><footer class="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-xl border-t border-white/[.06] p-3"><div class="max-w-2xl mx-auto"><button onclick="submitAll()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-black p-4 rounded-2xl text-xs">✅ بررسی و ارسال نهایی همه شماره‌ها</button></div></footer><script>
const qs=new URLSearchParams(location.search);const rId=+(qs.get('r_id')||0),fId=+(qs.get('f_id')||0),idx=+(qs.get('idx')||0);let data={members:[]};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function init(){try{const p=qs.get('d');if(p){const b=atob(p.replace(/-/g,'+').replace(/_/g,'/'));const a=Uint8Array.from(b,c=>c.charCodeAt(0));data=JSON.parse(pako.inflate(a,{to:'string'}));}}catch(e){console.error(e)}document.getElementById('subtitle').innerText=`گروه ${data.group||''} — ${data.members?.length||0} دستیار`;render();window.Bale.WebApp.ready()}function render(){const box=document.getElementById('rows');box.innerHTML='';(data.members||[]).forEach((m,i)=>box.innerHTML+=`<div class="card rounded-3xl p-4 space-y-3"><div class="flex justify-between"><div><b class="text-xs text-white">${i+1}. ${esc(m.name)}</b><div class="text-[9px] text-slate-500 mt-1">${esc(m.year||'')}</div></div><span class="text-[9px] text-emerald-300 bg-emerald-500/10 border border-emerald-400/20 px-2 py-1 rounded-full h-fit">دستیار</span></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2"><input id="p_${m.id}" value="${esc(m.phone||'')}" class="inp rounded-xl p-3 text-xs" inputmode="tel" placeholder="شماره فعال بله: 09..."><input id="n_${m.id}" value="${esc(m.nid||'')}" class="inp rounded-xl p-3 text-xs" inputmode="numeric" placeholder="کد ملی (اختیاری)"></div></div>`)}function submitAll(){const rec=[];for(const m of data.members||[]){const p=document.getElementById('p_'+m.id).value.replace(/\s|-/g,'').trim(),n=document.getElementById('n_'+m.id).value.trim();if(!/^0?9\d{9}$/.test(p)){alert(`شماره بله برای «${m.name}» معتبر نیست.`);return}if(n&&!/^\d{10}$/.test(n)){alert(`کد ملی «${m.name}» باید ۱۰ رقم باشد.`);return}rec.push({member_id:m.id,res_name:m.name,bale_phone:p,nid:n})}if(!rec.length){alert('هیچ دستیاری در این گروه وجود ندارد.');return}window.Bale.WebApp.sendData(JSON.stringify({action:'submit_multi_record',r_id:rId,f_id:fId,idx:idx,records:rec}))}init();
</script></body></html>
