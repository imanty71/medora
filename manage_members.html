<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت دستیاران</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen selection:bg-indigo-100">

    <!-- کانتینر اصلی محتوا -->
    <div class="p-5 flex-grow overflow-y-auto space-y-4 pb-28 fade-in">
        
        <!-- هدر پورتال -->
        <div class="text-center mt-2 mb-4 bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
            <span class="text-4xl drop-shadow-sm inline-block mb-2">👥</span>
            <h1 class="text-sm font-extrabold text-slate-800" id="groupTitle">مدیریت دستیاران گروه</h1>
            <p class="text-[11px] text-slate-400 mt-1">لیست اعضا را ویرایش، حذف یا اضافه کرده و در پایان ثبت کنید:</p>
        </div>

        <!-- کانتینر لیست دستیاران -->
        <div id="membersList" class="space-y-2.5">
            <!-- ردیف‌های اسامی داینامیک -->
        </div>

        <!-- باکس افزودن عضو جدید -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 mt-4">
            <h3 class="text-xs font-bold text-slate-700 mb-2.5 flex items-center gap-1.5">
                <span class="text-indigo-600">➕</span> افزودن دستیار جدید به این دپارتمان
            </h3>
            <div class="flex gap-2">
                <input type="text" id="newMemberName" class="flex-grow p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400 font-bold text-slate-700" placeholder="نام و نام خانوادگی دستیار...">
                <select id="newMemberYear" class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-600 focus:outline-none">
                    <option value="سال ۱">سال ۱</option>
                    <option value="سال ۲">سال ۲</option>
                    <option value="سال ۳">سال ۳</option>
                    <option value="سال ۴">سال ۴</option>
                    <option value="سال ۵">سال ۵</option>
                </select>
                <button id="addBtn" onclick="addNewMember()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 rounded-xl text-xs active:scale-95 transition-all shadow-md shadow-indigo-100">
                    افزودن
                </button>
            </div>
        </div>
    </div>

    <!-- دکمه ثابت ثبت نهایی در پایین صفحه -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg p-4 border-t border-slate-200/60 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)] z-30">
        <button id="saveBtn" onclick="submitData()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold p-4 rounded-2xl text-sm shadow-lg shadow-teal-200/50 transition-all active:scale-[0.98] flex justify-center items-center gap-2">
            💾 ثبت و اعمال نهایی تغییرات دپارتمان
        </button>
    </div>

    <script>
        // سیستم اعلان اختصاصی جایگزین Alert مرورگر
        function showAlert(msg, type = 'error') {
            const existing = document.getElementById('customAlert');
            if(existing) existing.remove();
            
            const alertBox = document.createElement('div');
            alertBox.id = 'customAlert';
            const bgClass = type === 'error' ? 'bg-rose-600' : 'bg-emerald-600';
            alertBox.className = `fixed top-6 left-1/2 -translate-x-1/2 ${bgClass} text-white px-5 py-3 rounded-2xl shadow-2xl z-[100] text-sm font-bold text-center w-11/12 max-w-sm slide-up`;
            alertBox.innerText = msg;
            
            document.body.appendChild(alertBox);
            setTimeout(() => {
                if(document.getElementById('customAlert')) document.getElementById('customAlert').remove();
            }, 4000);
        }

        const urlParams = new URLSearchParams(window.location.search);
        
        let rawGroup = urlParams.get('group_name') || 'نامشخص';
        try { rawGroup = decodeURIComponent(rawGroup); } catch(e) {}
        const groupName = rawGroup;

        document.getElementById('groupTitle').innerText = `مدیریت دستیاران گروه ${groupName}`;

        let membersArray = [];
        const rawMembers = urlParams.get('members');
        if (rawMembers) {
            try {
                let parsedStr = rawMembers;
                try { parsedStr = decodeURIComponent(rawMembers); } catch(e) {}
                membersArray = JSON.parse(parsedStr);
            } catch (e) {
                console.error("Error parsing members:", e);
            }
        }

        function renderMembers() {
            const container = document.getElementById('membersList');
            container.innerHTML = '';

            if (!membersArray || membersArray.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 bg-white/60 border-2 border-dashed border-slate-200 rounded-3xl p-6 fade-in">
                        <span class="text-3xl inline-block mb-2">📭</span>
                        <p class="text-xs font-bold text-slate-500">هیچ دستیاری در این گروه ثبت نشده است.</p>
                        <p class="text-[10px] text-slate-400 mt-1">با فرم پایین می‌توانید دستیاران جدید اضافه کرده یا دکمه ثبت نهایی را بزنید.</p>
                    </div>
                `;
                return;
            }

            membersArray.forEach((member, index) => {
                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between gap-2 slide-up";
                
                card.innerHTML = `
                    <div class="flex-grow flex items-center gap-2">
                        <span class="text-xs text-indigo-500 font-black w-6 text-center bg-indigo-50 py-1 rounded-lg">${index + 1}</span>
                        <input type="text" value="${member.name || ''}" onchange="updateName(${index}, this.value)" class="w-full p-1.5 border-b border-transparent hover:border-slate-200 focus:border-indigo-500 text-xs font-extrabold text-slate-700 focus:outline-none transition-colors">
                    </div>
                    <div class="flex items-center gap-2">
                        <select onchange="updateYear(${index}, this.value)" class="p-1.5 border border-slate-200 rounded-xl text-[11px] font-bold text-slate-600 focus:outline-none bg-slate-50">
                            <option value="سال ۱" ${member.year === 'سال ۱' ? 'selected' : ''}>سال ۱</option>
                            <option value="سال ۲" ${member.year === 'سال ۲' ? 'selected' : ''}>سال ۲</option>
                            <option value="سال ۳" ${member.year === 'سال ۳' ? 'selected' : ''}>سال ۳</option>
                            <option value="سال ۴" ${member.year === 'سال ۴' ? 'selected' : ''}>سال ۴</option>
                            <option value="سال ۵" ${member.year === 'سال ۵' ? 'selected' : ''}>سال ۵</option>
                        </select>
                        <button onclick="deleteMember(${index})" class="p-2 text-rose-500 hover:bg-rose-50 rounded-xl active:scale-95 transition-all" title="حذف">
                            🗑️
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateName(index, val) {
            if (val.trim()) membersArray[index].name = val.trim();
        }

        function updateYear(index, val) {
            membersArray[index].year = val;
        }

        function deleteMember(index) {
            membersArray.splice(index, 1);
            renderMembers();
        }

        function addNewMember() {
            const input = document.getElementById('newMemberName');
            const yearSelect = document.getElementById('newMemberYear');
            const name = input.value.trim();
            if (!name) {
                showAlert("لطفاً نام دستیار را وارد کنید.");
                return;
            }

            membersArray.push({
                id: -1,
                name: name,
                year: yearSelect.value
            });

            input.value = '';
            renderMembers();
        }

        window.Bale.WebApp.ready();

        function submitData() {
            try {
                const btn = document.getElementById('saveBtn');
                btn.innerHTML = '<span class="animate-spin inline-block mr-1">⏳</span> در حال ثبت و همگام‌سازی...';
                btn.classList.add('opacity-90', 'cursor-wait');

                const payload = {
                    action: "sync_members",
                    group_name: groupName,
                    members: membersArray
                };

                const jsonStr = JSON.stringify(payload);

                // استفاده از هر دو متد بله و تلگرام برای اطمینان ۱۰۰ درصدی
                if (window.Bale && window.Bale.WebApp) {
                    window.Bale.WebApp.sendData(jsonStr);
                } else if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.sendData(jsonStr);
                } else {
                    throw new Error("وب‌اپلیکیشن به درستی در بله لود نشده است.");
                }

                setTimeout(() => {
                    try { window.Bale.WebApp.close(); } catch(e) {}
                    try { window.Telegram.WebApp.close(); } catch(e) {}
                }, 150);

            } catch (error) {
                showAlert("خطا در ارسال اطلاعات: " + error.message);
                const btn = document.getElementById('saveBtn');
                btn.innerHTML = '💾 ثبت و اعمال نهایی تغییرات دپارتمان';
                btn.classList.remove('opacity-90', 'cursor-wait');
            }
        }

        renderMembers();
    </script>
</body>
</html>
