<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت دستیاران</title>
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex flex-col justify-between h-screen">

    <div class="p-5 flex-grow overflow-y-auto space-y-4 pb-24">
        <div class="text-center mt-2 mb-4">
            <span class="text-3xl">👥</span>
            <h1 class="text-lg font-bold text-gray-800 mt-1" id="groupTitle">در حال بارگذاری...</h1>
            <p class="text-xs text-gray-500 mt-1">لیست اعضا را ویرایش، حذف یا اضافه کنید و در پایان ذخیره نمایید:</p>
        </div>

        <div id="membersList" class="space-y-3"></div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mt-4">
            <h3 class="text-xs font-bold text-gray-800 mb-2">➕ افزودن دستیار جدید به این دپارتمان</h3>
            <div class="flex space-x-2 space-x-reverse">
                <input type="text" id="newMemberName" class="flex-grow p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500 font-semibold" placeholder="نام دستیار جدید...">
                <select id="newMemberYear" class="p-2.5 border border-gray-300 rounded-lg text-xs font-semibold focus:outline-none">
                    <option value="سال ۱">سال ۱</option>
                    <option value="سال ۲">سال ۲</option>
                    <option value="سال ۳">سال ۳</option>
                    <option value="سال ۴">سال ۴</option>
                    <option value="سال ۵">سال ۵</option>
                </select>
                <button id="addBtn" class="bg-blue-500 text-white font-bold px-4 rounded-lg text-sm active:scale-95">افزودن</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white p-4 border-t border-gray-200">
        <button id="saveBtn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold p-3.5 rounded-xl text-sm shadow-md transition duration-200 active:scale-95 flex justify-center items-center gap-2">
            💾 ثبت و اعمال نهایی تغییرات دپارتمان
        </button>
    </div>

    <script>
        let groupName = 'نامشخص';
        let membersArray = [];

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                if (compressedData) {
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    const data = JSON.parse(decompressed);
                    groupName = data.g || 'نامشخص';
                    membersArray = data.m || [];
                }
                document.getElementById('groupTitle').innerText = `مدیریت دستیاران گروه ${groupName}`;
                renderMembers();
            } catch(e) {
                console.error(e);
                alert("خطا در بارگذاری اطلاعات از سرور.");
            }
        }

        function renderMembers() {
            const container = document.getElementById('membersList');
            container.innerHTML = '';

            if (membersArray.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-sm text-gray-400">📭 هیچ دستیاری در این گروه ثبت نشده است.</div>';
                return;
            }

            membersArray.forEach((member, index) => {
                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between space-x-2 space-x-reverse";
                
                card.innerHTML = `
                    <div class="flex-grow flex items-center space-x-2 space-x-reverse">
                        <span class="text-xs text-gray-400 font-bold w-5">${index + 1}</span>
                        <input type="text" value="${member.name}" onchange="updateName(${index}, this.value)" class="w-full p-2 border-b border-transparent hover:border-gray-300 focus:border-green-500 text-sm font-semibold text-gray-700 focus:outline-none">
                    </div>
                    <div class="flex items-center space-x-2 space-x-reverse">
                        <select onchange="updateYear(${index}, this.value)" class="p-2 border border-gray-200 rounded-lg text-xs font-semibold focus:outline-none bg-gray-50 text-gray-600">
                            <option value="سال ۱" ${member.year === 'سال ۱' ? 'selected' : ''}>سال ۱</option>
                            <option value="سال ۲" ${member.year === 'سال ۲' ? 'selected' : ''}>سال ۲</option>
                            <option value="سال ۳" ${member.year === 'سال ۳' ? 'selected' : ''}>سال ۳</option>
                            <option value="سال ۴" ${member.year === 'سال ۴' ? 'selected' : ''}>سال ۴</option>
                            <option value="سال ۵" ${member.year === 'سال ۵' ? 'selected' : ''}>سال ۵</option>
                        </select>
                        <button onclick="deleteMember(${index})" class="p-2 text-red-500 hover:bg-red-50 text-sm rounded-lg active:scale-95 transition">
                            🗑️
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateName(index, val) {
            if (val.trim()) membersArray[index].name = val.trim();
        }

        function updateYear(index, val) {
            membersArray[index].year = val;
        }

        function deleteMember(index) {
            membersArray.splice(index, 1);
            renderMembers();
        }

        document.getElementById('addBtn').addEventListener('click', () => {
            const input = document.getElementById('newMemberName');
            const yearSelect = document.getElementById('newMemberYear');
            const name = input.value.trim();
            if (!name) return;

            membersArray.push({
                id: -1,
                name: name,
                year: yearSelect.value
            });

            input.value = '';
            renderMembers();
        });

        window.Bale.WebApp.ready();

        document.getElementById('saveBtn').addEventListener('click', () => {
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '⏳ در حال ارسال...';
            btn.classList.add('opacity-90', 'cursor-wait');

            try {
                window.Bale.WebApp.sendData(JSON.stringify({
                    action: "sync_members",
                    group_name: groupName,
                    members: membersArray
                }));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                alert("خطا در ارتباط با سرور.");
                btn.innerHTML = '💾 ثبت و اعمال نهایی تغییرات دپارتمان';
                btn.classList.remove('opacity-90', 'cursor-wait');
            }
        });

        init();
    </script>
</body>
</html>
