<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت دستیاران</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glass-bottom { background: linear-gradient(to top, rgba(255,255,255,1) 60%, rgba(255,255,255,0.8)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        
        /* استایل ورودی‌های مخفی (Inline Edit) */
        .inline-input { transition: all 0.3s ease; }
        .inline-input:focus { background: #fff; box-shadow: 0 0 0 2px #10b981; border-color: transparent; }
    </style>
</head>
<body class="flex flex-col h-screen selection:bg-emerald-100 overflow-hidden">

    <div class="flex flex-col h-full fade-in relative">
        <!-- Header -->
        <div class="sticky top-0 z-30 glass-header border-b border-slate-200/50 px-5 py-4 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)]">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-[1.25rem] bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center text-white text-xl shadow-lg shadow-emerald-200/50">
                    👥
                </div>
                <div>
                    <h1 class="text-base font-black text-slate-800 tracking-tight" id="groupTitle">در حال بارگذاری...</h1>
                    <p class="text-[11px] font-bold text-slate-500 mt-0.5">ویرایش، حذف و افزودن دستیار</p>
                </div>
            </div>
        </div>

        <!-- Content -->
        <div class="flex-grow overflow-y-auto px-5 pt-5 pb-32 space-y-6">
            
            <!-- Add New Member Card -->
            <div class="bg-white p-4 rounded-[1.5rem] shadow-sm border border-slate-100 slide-up">
                <h3 class="text-xs font-black text-emerald-600 mb-3 flex items-center gap-2">
                    <span class="w-6 h-6 rounded-lg bg-emerald-50 flex items-center justify-center">➕</span> افزودن دستیار جدید
                </h3>
                <div class="flex flex-col gap-3">
                    <input type="text" id="newMemberName" class="w-full bg-slate-50 border-2 border-transparent rounded-xl py-3 px-4 text-sm font-bold text-slate-700 focus:border-emerald-100 focus:bg-white focus:ring-4 focus:ring-emerald-50/50 transition-all outline-none placeholder-slate-400" placeholder="نام و نام خانوادگی دستیار...">
                    <div class="flex gap-2">
                        <select id="newMemberYear" class="flex-grow bg-slate-50 border-2 border-transparent rounded-xl py-3 px-4 text-sm font-bold text-emerald-700 focus:border-emerald-100 focus:bg-white focus:ring-4 focus:ring-emerald-50/50 transition-all outline-none appearance-none">
                            <option value="سال ۱">سال ۱ (R1)</option>
                            <option value="سال ۲">سال ۲ (R2)</option>
                            <option value="سال ۳">سال ۳ (R3)</option>
                            <option value="سال ۴">سال ۴ (R4)</option>
                            <option value="سال ۵">سال ۵ (R5)</option>
                        </select>
                        <button id="addBtn" class="w-1/3 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-xl text-sm active:scale-95 transition-all shadow-md shadow-emerald-200/50">افزودن</button>
                    </div>
                </div>
            </div>

            <!-- Members List -->
            <div>
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-3 ml-1">لیست دستیاران فعلی</h3>
                <div id="membersList" class="space-y-3"></div>
            </div>
            
        </div>

        <!-- Bottom Action Bar -->
        <div class="absolute bottom-0 left-0 right-0 glass-bottom px-5 py-4 pb-6 z-20 border-t border-slate-100">
            <button id="saveBtn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-black p-4 rounded-2xl text-sm shadow-xl shadow-teal-200/60 transition-all active:scale-[0.98] flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                ثبت و اعمال نهایی تغییرات
            </button>
        </div>
    </div>

    <script>
        let groupName = 'نامشخص';
        let membersArray = [];

        function showAlert(msg, type = 'error') {
            const existing = document.getElementById('customAlert');
            if(existing) existing.remove();
            const bgClass = type === 'error' ? 'bg-rose-500' : 'bg-emerald-500';
            const alertBox = document.createElement('div');
            alertBox.id = 'customAlert';
            alertBox.className = `fixed top-6 left-1/2 -translate-x-1/2 ${bgClass} text-white px-6 py-3.5 rounded-2xl shadow-xl shadow-${type === 'error' ? 'rose' : 'emerald'}-200/50 z-[100] text-sm font-black text-center w-11/12 max-w-sm slide-up flex items-center justify-center gap-2`;
            alertBox.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span> <span>${msg}</span>`;
            document.body.appendChild(alertBox);
            setTimeout(() => { if(document.getElementById('customAlert')) document.getElementById('customAlert').remove(); }, 3500);
        }

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                if (compressedData) {
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    const data = JSON.parse(decompressed);
                    groupName = data.g || 'نامشخص';
                    membersArray = data.m || [];
                }
                document.getElementById('groupTitle').innerText = `دپارتمان ${groupName}`;
                renderMembers();
            } catch(e) {
                showAlert("خطا در بارگذاری اطلاعات از سرور.");
            }
        }

        function renderMembers() {
            const container = document.getElementById('membersList');
            container.innerHTML = '';

            if (membersArray.length === 0) {
                container.innerHTML = `
                    <div class="bg-white border border-slate-100 rounded-[1.5rem] p-8 text-center shadow-sm slide-up">
                        <div class="w-16 h-16 bg-slate-50 text-slate-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">📭</div>
                        <p class="text-sm font-bold text-slate-500">هیچ دستیاری در این گروه ثبت نشده است.</p>
                    </div>`;
                return;
            }

            membersArray.forEach((member, index) => {
                const isNew = member.id === -1;
                const bgClass = isNew ? 'bg-emerald-50/30 border-emerald-100' : 'bg-white border-slate-100';
                const avatarBg = isNew ? 'from-emerald-100 to-teal-100 text-emerald-600' : 'from-slate-100 to-slate-200 text-slate-500';
                const badge = isNew ? '<span class="absolute -top-2 -right-2 bg-emerald-100 text-emerald-600 text-[9px] font-black px-2 py-0.5 rounded-lg border border-emerald-200/50">جدید</span>' : '';

                const card = document.createElement('div');
                card.className = `${bgClass} p-3.5 rounded-[1.5rem] shadow-[0_4px_20px_-4px_rgba(0,0,0,0.03)] border flex items-center justify-between gap-3 slide-up relative hover:shadow-md transition-all`;
                
                card.innerHTML = `
                    ${badge}
                    <div class="flex items-center gap-3 w-full overflow-hidden">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br ${avatarBg} flex items-center justify-center text-lg font-black border-2 border-white shadow-sm flex-shrink-0">
                            ${index + 1}
                        </div>
                        <div class="flex-grow flex flex-col gap-1.5 w-full">
                            <input type="text" value="${member.name}" onchange="updateName(${index}, this.value)" class="inline-input w-full bg-transparent border-b border-slate-200 py-1 text-sm font-black text-slate-800 focus:outline-none placeholder-slate-300" placeholder="نام دستیار...">
                            <div class="flex items-center justify-between gap-2">
                                <select onchange="updateYear(${index}, this.value)" class="inline-input bg-slate-50 border border-slate-200 rounded-lg py-1 px-2 text-xs font-bold text-indigo-600 focus:outline-none appearance-none cursor-pointer">
                                    <option value="سال ۱" ${member.year === 'سال ۱' ? 'selected' : ''}>سال ۱</option>
                                    <option value="سال ۲" ${member.year === 'سال ۲' ? 'selected' : ''}>سال ۲</option>
                                    <option value="سال ۳" ${member.year === 'سال ۳' ? 'selected' : ''}>سال ۳</option>
                                    <option value="سال ۴" ${member.year === 'سال ۴' ? 'selected' : ''}>سال ۴</option>
                                    <option value="سال ۵" ${member.year === 'سال ۵' ? 'selected' : ''}>سال ۵</option>
                                </select>
                                <button onclick="deleteMember(${index})" class="w-8 h-8 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center text-xs hover:bg-rose-100 hover:scale-105 active:scale-95 transition-all flex-shrink-0">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateName(index, val) {
            if (val.trim()) membersArray[index].name = val.trim();
        }

        function updateYear(index, val) {
            membersArray[index].year = val;
        }

        function deleteMember(index) {
            if(confirm("آیا از حذف این دستیار از لیست مطمئن هستید؟")) {
                membersArray.splice(index, 1);
                renderMembers();
            }
        }

        document.getElementById('addBtn').addEventListener('click', () => {
            const input = document.getElementById('newMemberName');
            const yearSelect = document.getElementById('newMemberYear');
            const name = input.value.trim();
            if (!name) {
                showAlert("لطفاً نام دستیار را وارد کنید.");
                return;
            }

            membersArray.unshift({ // اضافه کردن به بالای لیست
                id: -1,
                name: name,
                year: yearSelect.value
            });

            input.value = '';
            renderMembers();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showAlert("دستیار به لیست اضافه شد.", "success");
        });

        window.Bale.WebApp.ready();

        document.getElementById('saveBtn').addEventListener('click', () => {
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> در حال ارسال...';
            btn.classList.add('opacity-90', 'cursor-wait');

            try {
                window.Bale.WebApp.sendData(JSON.stringify({
                    action: "sync_members",
                    group_name: groupName,
                    members: membersArray
                }));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                showAlert("خطا در ارتباط با سرور.");
                btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg> ثبت و اعمال نهایی تغییرات';
                btn.classList.remove('opacity-90', 'cursor-wait');
            }
        });

        init();
    </script>
</body>
</html>
