<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رهگیری و مانیتورینگ جامع</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen selection:bg-indigo-100">

    <!-- VIEW: گزارش (Report) -->
    <div id="reportView" class="flex flex-col h-full fade-in">
        <div class="sticky top-0 z-20 bg-white/90 backdrop-blur-xl border-b border-slate-200/60 p-5 shadow-sm">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-sm font-black text-indigo-700 leading-relaxed pr-2" id="rTitle">در حال بارگذاری...</h1>
                    <p class="text-[11px] text-slate-500 font-bold mt-1" id="rSubtitle">لطفاً صبر کنید</p>
                </div>
                <div id="rBadge" class="bg-indigo-50 text-indigo-600 text-[10px] font-black px-2.5 py-1 rounded-lg border border-indigo-100">...</div>
            </div>
            
            <div class="flex mt-4 gap-2">
                <button onclick="filterTabs('all')" id="tab_all" class="flex-1 py-2 text-[10px] font-bold rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-200 transition-all">همه دپارتمان‌ها</button>
                <button onclick="filterTabs('done')" id="tab_done" class="flex-1 py-2 text-[10px] font-bold rounded-xl bg-slate-100 text-slate-500 transition-all">✅ تکمیل شده</button>
                <button onclick="filterTabs('pending')" id="tab_pending" class="flex-1 py-2 text-[10px] font-bold rounded-xl bg-slate-100 text-slate-500 transition-all">⚠️ معوقه</button>
            </div>
        </div>
        
        <div class="flex-grow overflow-y-auto p-4 pb-32 space-y-3" id="groupsList"></div>
        
        <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg p-4 border-t border-slate-200/60 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)] flex gap-2 overflow-x-auto no-scrollbar pb-safe" id="actionButtons"></div>
    </div>

    <script>
        let reportData = {};

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                if (compressedData) {
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    reportData = JSON.parse(decompressed);
                    
                    renderReport('all');
                } else {
                    alert("خطا: دیتای گزارش دریافت نشد.");
                }
            } catch(e) {
                alert("خطا در پردازش اطلاعات گزارش.");
            }
        }
        
        function filterTabs(filter) {
            ['all', 'done', 'pending'].forEach(t => {
                document.getElementById('tab_'+t).className = "flex-1 py-2 text-[10px] font-bold rounded-xl bg-slate-100 text-slate-500 transition-all";
            });
            document.getElementById('tab_'+filter).className = "flex-1 py-2 text-[10px] font-bold rounded-xl bg-indigo-600 text-white shadow-md shadow-indigo-200 transition-all";
            renderReport(filter);
        }
        
        function renderReport(filter) {
            document.getElementById('rTitle').innerText = reportData.ti;
            document.getElementById('rSubtitle').innerText = `کد رهگیری: ${reportData.c}`;
            document.getElementById('rBadge').innerText = reportData.ty === 'frm' ? 'فرم ارزیابی' : 'سند اداری';
            
            const container = document.getElementById('groupsList');
            container.innerHTML = '';
            
            let filtered = reportData.dt;
            if(filter === 'done') filtered = reportData.dt.filter(g => g.s === 1);
            if(filter === 'pending') filtered = reportData.dt.filter(g => g.s <= 0);
            
            filtered.forEach((g, idx) => {
                let icon = g.s === 1 ? '✅' : (g.s === 0 ? '⏳' : '❌');
                let bg = g.s === 1 ? 'bg-emerald-50/50 border-emerald-100' : (g.s === 0 ? 'bg-amber-50/50 border-amber-100' : 'bg-rose-50/50 border-rose-100');
                let textCol = g.s === 1 ? 'text-emerald-700' : (g.s === 0 ? 'text-amber-700' : 'text-rose-700');
                
                let viewBtn = '';
                if(reportData.ty === 'frm' && g.s === 1) {
                    viewBtn = `<button onclick="sendAction('view_group', '${g.g}')" class="mt-2.5 text-[10px] bg-white border border-slate-200 px-3 py-1.5 rounded-lg font-bold text-indigo-600 hover:bg-indigo-50 active:scale-95 transition-all flex items-center gap-1"><span>👁</span> مشاهده پاسخ کارشناس</button>`;
                }
                
                const delay = idx * 0.05;
                
                container.innerHTML += `
                    <div class="${bg} p-4 rounded-2xl shadow-[0_2px_10px_rgb(0,0,0,0.02)] border slide-up" style="animation-delay: ${delay}s">
                        <div class="flex gap-3">
                            <div class="text-xl mt-0.5">${icon}</div>
                            <div>
                                <h3 class="text-xs font-black text-slate-800">${g.g}</h3>
                                <p class="text-[10px] font-bold ${textCol} mt-1.5 leading-relaxed">${g.t}</p>
                                ${viewBtn}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            if(filtered.length === 0) {
                container.innerHTML = `<div class="text-center p-8 text-slate-400 font-bold text-xs bg-white rounded-2xl border border-slate-100 mt-4">هیچ دپارتمانی در این وضعیت یافت نشد.</div>`;
            }
            
            // دکمه‌های عملیاتی پایین صفحه
            const btnContainer = document.getElementById('actionButtons');
            btnContainer.innerHTML = '';
            
            if(reportData.ty === 'frm') {
                btnContainer.innerHTML += `<button onclick="sendAction('excel')" class="flex-1 min-w-[120px] bg-emerald-100 text-emerald-700 px-4 py-3.5 rounded-xl text-[11px] font-black active:scale-95 transition-all flex justify-center items-center gap-1.5"><span>📊</span> خروجی اکسل</button>`;
                btnContainer.innerHTML += `<button onclick="sendAction('view_all')" class="flex-1 min-w-[120px] bg-indigo-100 text-indigo-700 px-4 py-3.5 rounded-xl text-[11px] font-black active:scale-95 transition-all flex justify-center items-center gap-1.5"><span>📋</span> پاسخ کل کاربران</button>`;
            }
            
            if(reportData.pc > 0 && reportData.had) {
                btnContainer.innerHTML += `<button onclick="sendAction('remind')" class="flex-1 min-w-[120px] bg-amber-100 text-amber-700 px-4 py-3.5 rounded-xl text-[11px] font-black active:scale-95 transition-all flex justify-center items-center gap-1.5"><span>🔔</span> ارسال اخطار دستی</button>`;
            }
            
            if(reportData.admin === 1) {
                btnContainer.innerHTML += `<button onclick="sendAction('remove')" class="flex-1 min-w-[120px] bg-rose-100 text-rose-700 px-4 py-3.5 rounded-xl text-[11px] font-black active:scale-95 transition-all flex justify-center items-center gap-1.5"><span>❌</span> خروج از پایش</button>`;
            }
        }
        
        window.Bale.WebApp.ready();
        
        function sendAction(sub, grp='') {
            window.Bale.WebApp.sendData(JSON.stringify({action: 'report_action', sub: sub, id: reportData.id, grp: grp}));
            setTimeout(() => window.Bale.WebApp.close(), 150);
        }

        init();
    </script>
</body>
</html>
