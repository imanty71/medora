<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویرایش نام دستیار</title>
    <!-- استفاده از استایل شیک و واکنش‌گرا -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- لود کیت توسعه وب‌اپ تلگرام و بله -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-2xl shadow-md p-6 w-full max-w-md border border-gray-100">
        <h2 class="text-xl font-bold text-gray-800 mb-2 text-center">✏️ ویرایش نام دستیار</h2>
        <p class="text-gray-500 text-sm mb-6 text-center">لطفاً نام اصلاح‌شده‌ی دستیار را وارد نمایید:</p>
        
        <div class="mb-6">
            <label for="nameInput" class="block text-gray-700 text-sm font-semibold mb-2">نام و نام خانوادگی:</label>
            <input type="text" id="nameInput" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-gray-800" placeholder="نام جدید را وارد کنید...">
        </div>
        
        <button id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition duration-200">
            💾 ثبت و بروزرسانی
        </button>
    </div>

    <script>
        // تعریف و فعال‌سازی کیت وب‌اپ بله و تلگرام
        const webApp = window.Telegram?.WebApp || window.Bale?.WebApp;
        
        if (webApp) {
            webApp.ready();
            webApp.expand(); // باز شدن کامل صفحه در موبایل
        }

        // پارس کردن هوشمند متغیرهای آدرس (هم شتری و هم مارآبی)
        const urlParams = new URLSearchParams(window.location.search);
        const m_id = urlParams.get('m_id');
        const response_id = urlParams.get('response_id') || urlParams.get('responseId');
        const field_id = urlParams.get('field_id') || urlParams.get('fieldId');
        const idx = urlParams.get('idx') || urlParams.get('index');
        const old_name = urlParams.get('old_name');

        // قرار دادن نام قدیمی دستیار در کادر ورودی
        const nameInput = document.getElementById('nameInput');
        if (old_name) {
            nameInput.value = decodeURIComponent(old_name);
        }

        // عملکرد دکمه ثبت
        // عملکرد دکمه ثبت مجهز به بلاک‌های امنیتی ضد فریز
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.addEventListener('click', () => {
            const newName = nameInput.value.trim();
            if (!newName) {
                alert('لطفاً نام معتبری وارد کنید.');
                return;
            }

            const payload = {
                action: 'edit_name',
                m_id: m_id,
                new_name: newName,
                response_id: response_id,
                field_id: field_id,
                idx: idx
            };

            // ارسال دیتا در بلاک امن جهت جلوگیری از فریز شدن دکمه در صورت خطای کلاینت
            try {
                if (window.Telegram?.WebApp?.sendData) {
                    window.Telegram.WebApp.sendData(JSON.stringify(payload));
                } else if (window.Bale?.WebApp?.sendData) {
                    window.Bale.WebApp.sendData(JSON.stringify(payload));
                } else {
                    console.log("عدم پشتیبانی کلاینت از وب‌اپ", payload);
                }
            } catch (e_send) {
                console.error("خطا در ارسال داده به بله:", e_send);
            }

            // بستن مینی‌اپلیکیشن
            try {
                if (webApp && typeof webApp.close === 'function') {
                    webApp.close();
                }
            } catch (e_close) {
                console.error("خطا در بستن وب‌اپ:", e_close);
            }
        });
    </script>
</body>
</html>
