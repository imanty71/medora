<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رادار رفتارنگار و جعبه سیاه</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .fade-in { animation: fadeIn 0.25s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen selection:bg-indigo-500">

    <!-- ========================================== -->
    <!-- VIEW 1: لیست کاربران (Audience Radar) -->
    <!-- ========================================== -->
    <div id="radarListView" class="flex flex-col h-full fade-in">
        <div class="sticky top-0 z-20 bg-slate-900/90 backdrop-blur-xl border-b border-slate-800 p-4 space-y-3 shadow-lg">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <h1 class="text-sm font-black text-indigo-400">🛰 رادار رفتارنگار و جعبه سیاه</h1>
                </div>
                <span class="text-[10px] font-bold text-slate-400 bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700" id="totalAudienceBadge">0 کاربر</span>
            </div>
            
            <div class="relative">
                <span class="absolute inset-y-0 right-3 flex items-center text-slate-500">🔍</span>
                <input type="text" id="userSearchInput" onkeyup="filterUsers()" class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl py-2.5 pr-9 pl-3 text-xs font-bold text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:bg-slate-800 outline-none transition-all placeholder-slate-500" placeholder="جستجوی نام یا گروه کارشناس...">
            </div>
        </div>

        <div class="flex-grow overflow-y-auto p-4 pb-28 space-y-2.5" id="usersListContainer">
            <!-- کارت‌های کاربران -->
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md p-3.5 border-t border-slate-800 shadow-2xl z-20">
            <button onclick="closeApp()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-black p-3.5 rounded-2xl text-xs transition-all active:scale-[0.98] border border-slate-700 flex justify-center items-center gap-2">
                🔙 بازگشت به ربات
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 2: پرونده ۲ تبه کاربر (Detail View) -->
    <!-- ========================================== -->
    <div id="userDetailView" class="hidden flex flex-col h-full bg-slate-900 fade-in">
        <!-- هدر کاربر -->
        <div class="sticky top-0 z-20 bg-slate-900/90 backdrop-blur-xl border-b border-slate-800 p-4 space-y-3 shadow-lg">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-10 h-10 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-lg font-black border border-indigo-500/30">👤</div>
                    <div>
                        <h2 class="text-xs font-black text-slate-100" id="currentUserName">نام کارشناس</h2>
                        <p class="text-[10px] font-bold text-slate-400 mt-0.5" id="currentUserSub">دپارتمان</p>
                    </div>
                </div>
                <button onclick="backToUserList()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2 rounded-xl transition-all border border-slate-700 active:scale-95">
                    🔙 بازگشت
                </button>
            </div>

            <!-- دو تب تفکیکی (خواسته کلیدی شما) -->
            <div class="flex bg-slate-800/90 p-1 rounded-xl border border-slate-700/80 gap-1">
                <button onclick="switchUserTab('milestones')" id="subtab_milestones" class="flex-1 py-2 text-[11px] font-black rounded-lg bg-indigo-600 text-white shadow-md transition-all flex justify-center items-center gap-1.5">
                    <span>📌</span> اقدامات اصلی
                </button>
                <button onclick="switchUserTab('journey')" id="subtab_journey" class="flex-1 py-2 text-[11px] font-bold rounded-lg text-slate-400 transition-all flex justify-center items-center gap-1.5">
                    <span>🛰</span> جعبه سیاه و خطاها
                </button>
            </div>
        </div>

        <!-- محتوای تب‌ها -->
        <div class="flex-grow overflow-y-auto p-4 pb-28 space-y-3">
            
            <!-- تب ۱: اقدامات و رویدادهای اصلی (Milestones) -->
            <div id="pane_milestones" class="space-y-2.5 fade-in">
                <div id="milestonesContainer" class="space-y-2"></div>
            </div>

            <!-- تب ۲: رفتارنگار، تله‌های باگ و لاگ‌های ترمینال (Journey & Telemetry) -->
            <div id="pane_journey" class="hidden space-y-2.5 fade-in">
                <div class="flex justify-between items-center px-1 text-[10px] font-bold text-slate-400">
                    <span>ثبت ثانیه‌به‌ثانیه کلیک‌ها و استثناها:</span>
                    <span id="journeyCountBadge" class="text-indigo-400">۰ رویداد</span>
                </div>
                <div id="journeyContainer" class="space-y-2.5"></div>
            </div>

        </div>
    </div>

    <script>
        let radarData = { users: [], milestones: {}, journey: {} };
        let selectedUserId = null;

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                if (compressedData) {
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    radarData = JSON.parse(decompressed);

                    document.getElementById('totalAudienceBadge').innerText = `${radarData.users.length} کاربر`;
                    renderUsers();
                } else {
                    alert("خطا: دیتای رادار دریافت نشد.");
                }
            } catch(e) {
                console.error(e);
                alert("خطا در بازگشایی اطلاعات جعبه سیاه.");
            }
        }

        function renderUsers(filter = "") {
            const container = document.getElementById('usersListContainer');
            container.innerHTML = '';
            
            radarData.users.forEach((u, idx) => {
                if (filter && !u.name.includes(filter) && !u.group.includes(filter)) return;
                
                const uJourney = radarData.journey[u.id] || [];
                const errorCount = uJourney.filter(j => j.status === 'error' || j.terminal).length;
                
                let healthBadge = `<span class="text-[9px] font-black text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">🟢 پاک</span>`;
                if (errorCount > 0) {
                    healthBadge = `<span class="text-[9px] font-black text-rose-400 bg-rose-500/15 px-2 py-0.5 rounded border border-rose-500/30 animate-pulse">🔴 ${errorCount} خطا</span>`;
                }

                const card = document.createElement('div');
                card.className = "bg-slate-800/60 border border-slate-700/60 hover:border-indigo-500/50 p-3.5 rounded-2xl cursor-pointer transition-all active:scale-[0.99] flex justify-between items-center slide-up";
                card.onclick = () => openUserDetail(u);
                
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl bg-slate-700/60 text-slate-300 flex items-center justify-center text-sm font-black">👤</div>
                        <div>
                            <p class="text-xs font-black text-slate-100">${u.name}</p>
                            <p class="text-[10px] font-bold text-slate-400 mt-0.5">📚 ${u.group} | 🔰 ${u.role}</p>
                        </div>
                    </div>
                    <div>${healthBadge}</div>
                `;
                container.appendChild(card);
            });
        }

        function filterUsers() {
            renderUsers(document.getElementById('userSearchInput').value.trim());
        }

        function openUserDetail(u) {
            selectedUserId = String(u.id);
            document.getElementById('currentUserName').innerText = u.name;
            document.getElementById('currentUserSub').innerText = `${u.role} — دپارتمان ${u.group} (📱 ${u.phone})`;

            renderMilestones(selectedUserId);
            renderJourney(selectedUserId);

            switchUserTab('milestones'); // باز شدن روی تب اول طبق خواسته شما
            document.getElementById('radarListView').classList.add('hidden');
            document.getElementById('userDetailView').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function backToUserList() {
            document.getElementById('userDetailView').classList.add('hidden');
            document.getElementById('radarListView').classList.remove('hidden');
            selectedUserId = null;
        }

        function switchUserTab(tab) {
            const btnM = document.getElementById('subtab_milestones');
            const btnJ = document.getElementById('subtab_journey');
            const paneM = document.getElementById('pane_milestones');
            const paneJ = document.getElementById('pane_journey');

            if (tab === 'milestones') {
                btnM.className = "flex-1 py-2 text-[11px] font-black rounded-lg bg-indigo-600 text-white shadow-md transition-all flex justify-center items-center gap-1.5";
                btnJ.className = "flex-1 py-2 text-[11px] font-bold rounded-lg text-slate-400 transition-all flex justify-center items-center gap-1.5";
                paneM.classList.remove('hidden');
                paneJ.classList.add('hidden');
            } else {
                btnJ.className = "flex-1 py-2 text-[11px] font-black rounded-lg bg-indigo-600 text-white shadow-md transition-all flex justify-center items-center gap-1.5";
                btnM.className = "flex-1 py-2 text-[11px] font-bold rounded-lg text-slate-400 transition-all flex justify-center items-center gap-1.5";
                paneJ.classList.remove('hidden');
                paneM.classList.add('hidden');
            }
        }

        // رندر تب ۱: اقدامات و رویدادهای اصلی
        function renderMilestones(uid) {
            const container = document.getElementById('milestonesContainer');
            container.innerHTML = '';
            const list = radarData.milestones[uid] || [];

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-xs font-bold text-slate-500 bg-slate-800/40 rounded-2xl border border-slate-800">📭 هیچ اقدام رسمی یا دانلودی برای این کاربر ثبت نشده است.</div>`;
                return;
            }

            list.forEach((m, idx) => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/70 border border-slate-700/70 p-3.5 rounded-2xl space-y-1.5 slide-up";
                card.innerHTML = `
                    <div class="flex justify-between items-center text-[10px]">
                        <span class="text-indigo-400 font-black">🕒 ${m.rel}</span>
                        <span class="text-slate-500 font-bold">${m.time}</span>
                    </div>
                    <p class="text-xs font-extrabold text-slate-200 leading-relaxed">📝 ${m.action}</p>
                `;
                container.appendChild(card);
            });
        }

        // رندر تب ۲: جعبه سیاه و باگ‌های ترمینال
        function renderJourney(uid) {
            const container = document.getElementById('journeyContainer');
            container.innerHTML = '';
            const list = radarData.journey[uid] || [];
            document.getElementById('journeyCountBadge').innerText = `${list.length} رویداد`;

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-xs font-bold text-slate-500 bg-slate-800/40 rounded-2xl border border-slate-800">📭 جعبه سیاه خالی است (هیچ حرکتی ثبت نشده است).</div>`;
                return;
            }

            list.forEach((j, idx) => {
                const isError = j.status === 'error' || j.terminal;
                const statusColor = isError ? 'border-rose-500/40 bg-rose-500/10' : 'border-slate-700/60 bg-slate-800/60';
                const statusDot = isError ? '🔴' : (j.type === 'click' ? '🔘' : '🔹');

                let terminalHtml = '';
                if (j.terminal) {
                    const encodedTerm = encodeURIComponent(j.terminal);
                    terminalHtml = `
                        <div class="mt-2.5 pt-2.5 border-t border-rose-500/20 space-y-2">
                            <div class="bg-black/80 rounded-xl p-2.5 text-[10px] font-mono text-rose-300 overflow-x-auto max-h-36 whitespace-pre border border-rose-500/30">
${j.terminal}
                            </div>
                            <button onclick="copyForAI('${encodeURIComponent(j.title)}', '${encodeURIComponent(j.payload || '')}', '${encodedTerm}')" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-900 font-black py-2 rounded-xl text-[10px] transition-all active:scale-95 flex justify-center items-center gap-1.5 shadow-md shadow-amber-500/10">
                                📋 کپی لاگ برای هوش مصنوعی (Surgical Debug)
                            </button>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = `${statusColor} border p-3 rounded-2xl space-y-1.5 slide-up`;
                card.innerHTML = `
                    <div class="flex justify-between items-center text-[10px]">
                        <span class="font-black text-slate-400 flex items-center gap-1.5">
                            <span>${statusDot}</span> ${j.title}
                        </span>
                        <span class="text-slate-500 font-bold">${j.rel}</span>
                    </div>
                    ${j.payload ? `<p class="text-[10px] font-mono text-indigo-300 bg-slate-900/60 px-2 py-1 rounded-lg border border-slate-700/50 truncate">📦 کلید: ${j.payload}</p>` : ''}
                    ${terminalHtml}
                `;
                container.appendChild(card);
            });
        }

        // تابع کمکی کپی ضدگلوله با پشتیبانی کامل از وب‌ویوی بله
        function executeCopy(text) {
            let success = false;
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                textArea.style.top = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                success = document.execCommand('copy');
                document.body.removeChild(textArea);
            } catch (e) {
                success = false;
            }
            return success;
        }

        // تابع طلایی کپی گزارش آماده برای هوش مصنوعی
        function copyForAI(titleEnc, payloadEnc, termEnc) {
            const title = decodeURIComponent(titleEnc);
            const payload = decodeURIComponent(payloadEnc);
            const terminal = decodeURIComponent(termEnc);
            const uName = document.getElementById('currentUserName').innerText;
            const uSub = document.getElementById('currentUserSub').innerText;

            const promptText = `🚨 گزارش باگ سیستمی از جعبه سیاه مدورا (Medora Flight Recorder):\n\n👤 کاربر: ${uName}\n🔰 سمت و دپارتمان: ${uSub}\n📍 مرحله و اقدام: ${title}\n📦 کلید/ورودی: ${payload}\n\n❌ متن کامل خطای ترمینال پایتون:\n\`\`\`\n${terminal}\n\`\`\`\n\nلطفاً طبق پروتکل جراحی کد، این خطا را بررسی و پچ جراحی آن را ارائه بده.`;

            // روش اول: Clipboard API با فال‌بک سریع به execCommand
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(promptText).then(() => {
                    showCopyFeedback();
                }).catch(() => {
                    if (executeCopy(promptText)) {
                        showCopyFeedback();
                    } else {
                        alert("⚠️ امکان کپی خودکار توسط پیام‌رسان مسدود است. لطفاً متن داخل کادر مشکی را با موس انتخاب و کپی فرمایید.");
                    }
                });
            } else {
                if (executeCopy(promptText)) {
                    showCopyFeedback();
                } else {
                    alert("⚠️ امکان کپی خودکار توسط پیام‌رسان مسدود است. لطفاً متن داخل کادر مشکی را با موس انتخاب و کپی فرمایید.");
                }
            }
        }

        function showCopyFeedback() {
            const btn = event.currentTarget || document.activeElement;
            if (btn && btn.tagName === 'BUTTON') {
                const origText = btn.innerHTML;
                const origBg = btn.className;
                btn.innerHTML = '✅ لاگ با موفقیت کپی شد! در چت Paste کنید';
                btn.className = "w-full bg-emerald-500 text-slate-900 font-black py-2 rounded-xl text-[10px] transition-all flex justify-center items-center gap-1.5 shadow-lg shadow-emerald-500/20";
                setTimeout(() => {
                    btn.innerHTML = origText;
                    btn.className = origBg;
                }, 3000);
            } else {
                alert("✅ لاگ با موفقیت در حافظه کپی شد! اکنون می‌توانید در چت هوش مصنوعی Paste کنید.");
            }
        }

        function closeApp() {
            try { window.Bale.WebApp.close(); } catch(e) {}
        }

        window.Bale.WebApp.ready();
        init();
    </script>
</body>
</html>
