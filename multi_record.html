<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فرم ثبت مشخصات</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen selection:bg-indigo-100">

    <div id="mainView" class="flex flex-col h-full fade-in">
        <div class="flex-grow overflow-y-auto p-5 space-y-5 pb-28">
            <div class="text-center mt-2 mb-4 bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <span class="text-4xl drop-shadow-sm inline-block mb-3">📋</span>
                <h1 class="text-sm font-extrabold text-indigo-700 leading-relaxed" id="formQuestionTitle">در حال بارگذاری سوال...</h1>
            </div>

            <div id="addedListContainer" class="hidden space-y-3 mb-4 slide-up">
                <h3 class="text-xs font-bold text-slate-500 border-b border-slate-200 pb-2 px-1">👥 موارد اضافه‌شده تا این لحظه:</h3>
                <div id="recordsList" class="space-y-2"></div>
            </div>

            <div id="formScrollTarget" class="bg-white p-5 rounded-3xl shadow-md border border-slate-100 relative overflow-hidden transition-all duration-300">
                <h3 id="formBoxTitle" class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <span class="bg-indigo-50 text-indigo-600 rounded-lg p-1 text-xs">➕</span> ورود اطلاعات جدید
                </h3>
                
                <div id="dynamicFormContainer" class="space-y-4"></div>

                <div class="mt-5 space-y-2">
                    <button id="addRecordBtn" onclick="addRecord()" class="w-full bg-slate-50 text-indigo-600 border border-slate-200 hover:bg-indigo-50 hover:border-indigo-200 font-bold p-3.5 rounded-2xl text-sm transition-all flex justify-center items-center gap-2 active:scale-95">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        <span>افزودن این مورد به لیست</span>
                    </button>
                    <button id="cancelEditBtn" onclick="cancelEdit()" class="hidden w-full bg-slate-100 text-slate-500 hover:bg-slate-200 font-bold p-3 rounded-2xl text-sm transition-all flex justify-center items-center gap-2 active:scale-95">
                        ❌ انصراف از ویرایش
                    </button>
                </div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg p-4 border-t border-slate-200/60 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
            <button id="reviewBtn" onclick="showPreview()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-4 rounded-2xl text-sm shadow-lg shadow-indigo-200/50 transition-all active:scale-[0.98] flex justify-center gap-2 items-center disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <span id="btnCounter" class="bg-white text-indigo-600 text-xs py-0.5 px-2.5 rounded-full font-black hidden shadow-sm">0</span>
                👁️ مرور و پیش‌نمایش لیست نهایی
            </button>
        </div>
    </div>

    <div id="previewView" class="hidden flex flex-col h-full bg-slate-100 fade-in">
        <div class="flex-grow overflow-y-auto p-5 space-y-4 pb-32">
            <div class="text-center mb-6 mt-4">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-3 shadow-inner border border-emerald-200">✅</div>
                <h2 class="text-lg font-extrabold text-slate-800">پیش‌نمایش اطلاعات</h2>
                <p class="text-xs text-slate-500 mt-1">لطفاً قبل از ارسال به ربات، اطلاعات را بررسی کنید.</p>
            </div>
            <div id="previewContent" class="space-y-3"></div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white p-4 border-t border-slate-200 shadow-[0_-10px_20px_rgba(0,0,0,0.03)] flex gap-3">
            <button onclick="hidePreview()" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold p-4 rounded-2xl text-sm transition-all active:scale-[0.98]">🔙 بازگشت</button>
            <button id="submitBtn" onclick="submitToBot()" class="w-2/3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold p-4 rounded-2xl text-sm shadow-lg shadow-teal-200/50 transition-all active:scale-[0.98] flex justify-center gap-2 items-center">📤 تایید و ارسال به ربات</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const r_id = urlParams.get('r_id');
        const f_id = urlParams.get('f_id');
        const idx = urlParams.get('idx');
        
        let data = {};
        try {
            const compressedData = urlParams.get('d');
            if (compressedData) {
                const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                const decompressed = pako.inflate(bytes, { to: 'string' });
                data = JSON.parse(decompressed);
            }
        } catch(e) { console.error(e); }

        document.getElementById('formQuestionTitle').innerText = data.q || 'مشخصات را وارد کنید:';

        let schema = data.s || [];
        let records = [];
        let editingIndex = -1;

        try { 
            const rawAns = data.ans;
            if (rawAns && rawAns !== '-') records = JSON.parse(rawAns); 
        } catch(e) { console.error(e); }

        function renderDynamicForm() {
            const container = document.getElementById('dynamicFormContainer');
            container.innerHTML = '';
            
            schema.forEach(field => {
                const wrapper = document.createElement('div');
                const isRequired = field.req ? '<span class="text-rose-500 mr-1">*</span>' : '<span class="text-slate-400 text-[10px] mr-1">(اختیاری)</span>';
                const inputType = (field.type === 'number' || field.type === 'phone' || field.type === 'nid') ? 'tel' : 'text';
                const placeholder = field.type === 'nid' ? '10 رقم' : (field.type === 'phone' ? '09...' : '');

                wrapper.innerHTML = `
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 ml-1">${field.label} ${isRequired}</label>
                    <input type="${inputType}" id="${field.id}" class="w-full p-3.5 bg-slate-50/50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white font-bold text-slate-700 transition-all placeholder-slate-300" placeholder="${placeholder}">
                `;
                container.appendChild(wrapper);
            });
        }

        function editRecord(index) {
            if (!document.getElementById('previewView').classList.contains('hidden')) hidePreview();

            const record = records[index];
            editingIndex = index;

            schema.forEach(field => document.getElementById(field.id).value = record[field.id] || '');
            document.getElementById('formBoxTitle').innerHTML = `<span class="bg-amber-100 text-amber-600 rounded-lg p-1 text-xs">✏️</span> ویرایش اطلاعات مورد ${index + 1}`;
            
            const btn = document.getElementById('addRecordBtn');
            btn.className = "w-full bg-amber-50 text-amber-600 border border-amber-200 hover:bg-amber-100 font-bold p-3.5 rounded-2xl text-sm transition-all flex justify-center items-center gap-2 active:scale-95";
            btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span>💾 ثبت تغییرات این مورد</span>`;
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('formScrollTarget').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function cancelEdit() {
            editingIndex = -1;
            schema.forEach(field => document.getElementById(field.id).value = '');
            document.getElementById('formBoxTitle').innerHTML = `<span class="bg-indigo-50 text-indigo-600 rounded-lg p-1 text-xs">➕</span> ورود اطلاعات جدید`;
            const btn = document.getElementById('addRecordBtn');
            btn.className = "w-full bg-slate-50 text-indigo-600 border border-slate-200 hover:bg-indigo-50 hover:border-indigo-200 font-bold p-3.5 rounded-2xl text-sm transition-all flex justify-center items-center gap-2 active:scale-95";
            btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> <span>افزودن این مورد به لیست</span>`;
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function addRecord() {
            let recordData = {};
            let hasError = false;

            schema.forEach(field => {
                const val = document.getElementById(field.id).value.trim();
                if (field.req && !val) { alert(`پر کردن فیلد "${field.label}" الزامی است!`); hasError = true; return; }
                if (val) {
                    if (field.type === 'nid' && !/^\d{10}$/.test(val)) { alert(`فیلد "${field.label}" باید دقیقاً شامل ۱۰ رقم باشد!`); hasError = true; return; }
                    if (field.type === 'phone' && !/^\d{10,11}$/.test(val)) { alert(`فیلد "${field.label}" باید یک شماره تماس معتبر باشد!`); hasError = true; return; }
                    if (field.type === 'number' && isNaN(val)) { alert(`فیلد "${field.label}" فقط عدد قبول می‌کند!`); hasError = true; return; }
                }
                recordData[field.id] = val;
            });

            if (hasError) return;

            if (editingIndex > -1) { records[editingIndex] = recordData; cancelEdit(); } 
            else { records.push(recordData); schema.forEach(field => document.getElementById(field.id).value = ''); }
            
            renderList();
        }

        function removeRecord(index) {
            records.splice(index, 1);
            if (editingIndex === index) cancelEdit();
            else if (editingIndex > index) editingIndex--;
            renderList();
            if (records.length === 0) hidePreview();
            else if (!document.getElementById('previewView').classList.contains('hidden')) renderPreviewList();
        }

        function renderList() {
            const container = document.getElementById('addedListContainer');
            const listObj = document.getElementById('recordsList');
            const btn = document.getElementById('reviewBtn');
            const counter = document.getElementById('btnCounter');

            listObj.innerHTML = '';

            if (records.length > 0) {
                container.classList.remove('hidden');
                btn.disabled = false;
                counter.classList.remove('hidden');
                counter.innerText = records.length;

                records.forEach((r, i) => {
                    const firstFieldVal = r[schema[0].id] || `مورد ${i+1}`;
                    const card = document.createElement('div');
                    card.className = "bg-white p-3.5 rounded-2xl shadow-[0_2px_10px_rgb(0,0,0,0.03)] border border-slate-100 flex justify-between items-center slide-up";
                    card.innerHTML = `
                        <div class="text-sm flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-xs font-bold text-slate-400">${i+1}</div>
                            <p class="font-extrabold text-slate-700 truncate max-w-[150px]">${firstFieldVal}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editRecord(${i})" class="text-indigo-600 bg-indigo-50 px-3 py-2 rounded-xl text-xs font-bold hover:bg-indigo-100 active:scale-95 transition-all">ویرایش</button>
                            <button onclick="removeRecord(${i})" class="text-rose-500 bg-rose-50 px-3 py-2 rounded-xl text-xs font-bold hover:bg-rose-100 active:scale-95 transition-all">حذف</button>
                        </div>
                    `;
                    listObj.appendChild(card);
                });
            } else {
                container.classList.add('hidden');
                btn.disabled = true;
                counter.classList.add('hidden');
            }
        }

        function showPreview() {
            if (records.length === 0) return;
            if (editingIndex > -1) {
                if (!confirm("شما در حال ویرایش یک مورد هستید که هنوز ذخیره نشده است. آیا می‌خواهید بدون ذخیره آن به پیش‌نمایش بروید؟")) return;
                cancelEdit();
            }
            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('previewView').classList.remove('hidden');
            renderPreviewList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hidePreview() {
            document.getElementById('previewView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
        }

        function renderPreviewList() {
            const container = document.getElementById('previewContent');
            container.innerHTML = '';
            records.forEach((r, i) => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-200 slide-up";
                let fieldsHtml = '';
                schema.forEach(field => {
                    const val = r[field.id] || '-';
                    fieldsHtml += `
                        <div class="flex justify-between items-center border-b border-slate-50 last:border-0 py-2">
                            <span class="text-[11px] font-bold text-slate-400">${field.label}</span>
                            <span class="text-sm font-extrabold text-slate-700">${val}</span>
                        </div>
                    `;
                });
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <div class="bg-indigo-50 text-indigo-600 text-xs font-bold px-3 py-1 rounded-lg">مورد ${i+1}</div>
                        <div class="flex gap-3">
                            <button onclick="editRecord(${i})" class="text-indigo-500 hover:text-indigo-700 text-xs font-bold flex items-center gap-1">✏️ ویرایش</button>
                            <button onclick="removeRecord(${i})" class="text-rose-400 hover:text-rose-600 text-xs font-bold flex items-center gap-1">🗑 حذف</button>
                        </div>
                    </div>
                    <div class="bg-slate-50/50 rounded-xl p-3 border border-slate-100">${fieldsHtml}</div>
                `;
                container.appendChild(card);
            });
        }

        renderDynamicForm();
        renderList();
        window.Bale.WebApp.ready();

        function submitToBot() {
            if (records.length === 0) return;
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '⏳ در حال ارسال...';
            btn.classList.add('opacity-90', 'cursor-wait');

            const payload = { action: "submit_multi_record", r_id: r_id, f_id: f_id, idx: idx, records: records };
            try {
                window.Bale.WebApp.sendData(JSON.stringify(payload));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                btn.innerHTML = '📤 تایید و ارسال به ربات';
                btn.classList.remove('opacity-90', 'cursor-wait');
                alert("خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.");
            }
        }
    </script>
</body>
</html>
