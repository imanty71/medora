<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فرم ثبت مشخصات</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen selection:bg-indigo-100">

    <div class="flex-grow overflow-y-auto p-5 space-y-5 pb-28">
        
        <!-- هدر فرم شامل متن سوال منتقل شده از تلگرام -->
        <div class="text-center mt-2 mb-4 bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
            <span class="text-4xl drop-shadow-sm inline-block mb-3">📋</span>
            <h1 class="text-sm font-extrabold text-indigo-700 leading-relaxed" id="formQuestionTitle">
                در حال بارگذاری سوال...
            </h1>
        </div>

        <!-- لیست افراد ثبت شده -->
        <div id="addedListContainer" class="hidden space-y-3 mb-4 slide-up">
            <h3 class="text-xs font-bold text-slate-500 border-b border-slate-200 pb-2 px-1">👥 موارد اضافه‌شده تا این لحظه:</h3>
            <div id="recordsList" class="space-y-2"></div>
        </div>

        <!-- باکس داینامیک فرم ورود اطلاعات -->
        <div class="bg-white p-5 rounded-3xl shadow-md border border-slate-100 relative overflow-hidden">
            <h3 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span class="bg-indigo-50 text-indigo-600 rounded-lg p-1 text-xs">➕</span> ورود اطلاعات جدید
            </h3>
            
            <div id="dynamicFormContainer" class="space-y-4">
                <!-- فیلدها توسط جاوااسکریپت اینجا رندر می‌شوند -->
            </div>

            <button onclick="addRecord()" class="w-full bg-slate-50 text-indigo-600 border border-slate-200 hover:bg-indigo-50 hover:border-indigo-200 font-bold p-3.5 rounded-2xl text-sm transition-all mt-4 flex justify-center items-center gap-2 active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                افزودن این مورد به لیست
            </button>
        </div>
    </div>

    <!-- دکمه نهایی ثابت -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg p-4 border-t border-slate-200/60 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
        <button id="submitBtn" onclick="submitToBot()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold p-4 rounded-2xl text-sm shadow-lg shadow-teal-200/50 transition-all active:scale-[0.98] flex justify-center gap-2 items-center disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            <span id="btnCounter" class="bg-white text-emerald-600 text-xs py-0.5 px-2.5 rounded-full font-black hidden shadow-sm">0</span>
            📤 ارسال لیست نهایی به ربات
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const r_id = urlParams.get('r_id');
        const f_id = urlParams.get('f_id');
        const idx = urlParams.get('idx');
        
        const rawQuestion = urlParams.get('q') || 'مشخصات را وارد کنید:';
        document.getElementById('formQuestionTitle').innerText = decodeURIComponent(rawQuestion);

        let schema = [];
        try { schema = JSON.parse(decodeURIComponent(urlParams.get('s') || '[]')); } 
        catch(e) { console.error(e); }

        let records = [];

        // رندر داینامیک فیلدها براساس دیتای دریافتی از پایتون
        function renderDynamicForm() {
            const container = document.getElementById('dynamicFormContainer');
            container.innerHTML = '';
            
            schema.forEach(field => {
                const wrapper = document.createElement('div');
                const isRequired = field.req ? '<span class="text-rose-500 mr-1">*</span>' : '<span class="text-slate-400 text-[10px] mr-1">(اختیاری)</span>';
                const inputType = (field.type === 'number' || field.type === 'phone' || field.type === 'nid') ? 'tel' : 'text';
                const placeholder = field.type === 'nid' ? '10 رقم' : (field.type === 'phone' ? '09...' : '');

                wrapper.innerHTML = `
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 ml-1">${field.label} ${isRequired}</label>
                    <input type="${inputType}" id="${field.id}" class="w-full p-3.5 bg-slate-50/50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white font-bold text-slate-700 transition-all placeholder-slate-300" placeholder="${placeholder}">
                `;
                container.appendChild(wrapper);
            });
        }

        function addRecord() {
            let recordData = {};
            let hasError = false;

            schema.forEach(field => {
                const val = document.getElementById(field.id).value.trim();
                
                // ۱. بررسی ضروری بودن
                if (field.req && !val) {
                    alert(`پر کردن فیلد "${field.label}" الزامی است!`);
                    hasError = true; return;
                }
                
                if (val) {
                    // ۲. اعتبارسنجی کدملی
                    if (field.type === 'nid' && !/^\d{10}$/.test(val)) {
                        alert(`فیلد "${field.label}" باید دقیقاً شامل ۱۰ رقم باشد!`);
                        hasError = true; return;
                    }
                    // ۳. اعتبارسنجی موبایل/تماس
                    if (field.type === 'phone' && !/^\d{10,11}$/.test(val)) {
                        alert(`فیلد "${field.label}" باید یک شماره تماس معتبر (حداقل ۱۰ رقم) باشد!`);
                        hasError = true; return;
                    }
                    // ۴. اعتبارسنجی اعداد
                    if (field.type === 'number' && isNaN(val)) {
                        alert(`فیلد "${field.label}" فقط عدد قبول می‌کند!`);
                        hasError = true; return;
                    }
                }
                recordData[field.id] = val;
            });

            if (hasError) return;

            records.push(recordData);
            
            // خالی کردن فرم برای نفر بعدی
            schema.forEach(field => document.getElementById(field.id).value = '');
            renderList();
        }

        function removeRecord(index) {
            records.splice(index, 1);
            renderList();
        }

        function renderList() {
            const container = document.getElementById('addedListContainer');
            const listObj = document.getElementById('recordsList');
            const btn = document.getElementById('submitBtn');
            const counter = document.getElementById('btnCounter');

            listObj.innerHTML = '';

            if (records.length > 0) {
                container.classList.remove('hidden');
                btn.disabled = false;
                counter.classList.remove('hidden');
                counter.innerText = records.length;

                records.forEach((r, i) => {
                    // پیدا کردن عنوان اولین فیلد برای نمایش به عنوان هدر کارت
                    const firstFieldVal = r[schema[0].id] || `مورد ${i+1}`;
                    
                    const card = document.createElement('div');
                    card.className = "bg-white p-3.5 rounded-2xl shadow-[0_2px_10px_rgb(0,0,0,0.03)] border border-slate-100 flex justify-between items-center slide-up";
                    card.innerHTML = `
                        <div class="text-sm flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-xs font-bold text-slate-400">${i+1}</div>
                            <p class="font-extrabold text-slate-700">${firstFieldVal}</p>
                        </div>
                        <button onclick="removeRecord(${i})" class="text-rose-500 bg-rose-50 px-3 py-2 rounded-xl text-xs font-bold hover:bg-rose-100 active:scale-95 transition-all">حذف</button>
                    `;
                    listObj.appendChild(card);
                });
            } else {
                container.classList.add('hidden');
                btn.disabled = true;
                counter.classList.add('hidden');
            }
        }

        // اجرا در شروع
        renderDynamicForm();
        window.Bale.WebApp.ready();

        function submitToBot() {
            if (records.length === 0) return;

            // تغییر افکت دکمه
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '⏳ در حال ارسال...';
            btn.classList.add('opacity-90', 'cursor-wait');

            const payload = {
                action: "submit_multi_record",
                r_id: r_id, f_id: f_id, idx: idx, records: records
            };

            try {
                window.Bale.WebApp.sendData(JSON.stringify(payload));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                btn.innerHTML = '📤 ارسال لیست نهایی به ربات';
                btn.classList.remove('opacity-90', 'cursor-wait');
                alert("خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.");
            }
        }
    </script>
</body>
</html>
