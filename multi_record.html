<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ثبت مشخصات اساتید و افراد</title>
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 flex flex-col h-screen">

    <div class="flex-grow overflow-y-auto p-4 space-y-4 pb-28">
        
        <!-- هدر فرم -->
        <div class="text-center mt-2 mb-2">
            <span class="text-4xl shadow-sm rounded-full p-2 bg-white inline-block">📋</span>
            <h1 class="text-lg font-bold text-gray-800 mt-3">فرم ثبت مشخصات جامع</h1>
            <p class="text-xs text-gray-500 mt-1">مشخصات اساتید یا افراد مورد نظر را وارد کرده و به لیست اضافه کنید.</p>
        </div>

        <!-- لیست افراد ثبت شده (در ابتدا مخفی است) -->
        <div id="addedListContainer" class="hidden space-y-2 mb-4 slide-up">
            <h3 class="text-xs font-bold text-gray-700 border-b pb-1">👥 افراد اضافه شده به لیست:</h3>
            <div id="recordsList" class="space-y-2"></div>
        </div>

        <!-- باکس فرم ورود اطلاعات -->
        <div class="bg-white p-4 rounded-xl shadow-md border border-gray-100">
            <h3 class="text-sm font-bold text-blue-600 mb-4 flex items-center gap-2">
                <span>➕</span> ورود اطلاعات نفر جدید
            </h3>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">نام و نام خانوادگی <span class="text-red-500">*</span></label>
                    <input type="text" id="inpName" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="مثلاً: دکتر علی احمدی">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">کد ملی <span class="text-red-500">*</span></label>
                        <input type="tel" id="inpNid" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="10 رقم">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">شماره تماس <span class="text-red-500">*</span></label>
                        <input type="tel" id="inpPhone" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="09...">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">رشته تخصصی</label>
                        <input type="text" id="inpSpec" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="(اختیاری)">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">ایمیل</label>
                        <input type="email" id="inpEmail" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="(اختیاری)">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">سابقه علمی / توضیحات</label>
                    <textarea id="inpBg" rows="2" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="سوابق یا توضیحات تکمیلی (اختیاری)..."></textarea>
                </div>

                <button onclick="addRecord()" class="w-full bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 font-bold p-3 rounded-xl text-sm transition mt-2">
                    ⬇️ افزودن این شخص به لیست
                </button>
            </div>
        </div>

    </div>

    <!-- دکمه نهایی ثابت در پایین -->
    <div class="fixed bottom-0 left-0 right-0 bg-white p-4 border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <button id="submitBtn" onclick="submitToBot()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold p-3.5 rounded-xl text-sm shadow-md transition disabled:opacity-50 disabled:bg-gray-400 flex justify-center gap-2 items-center" disabled>
            <span id="btnCounter" class="bg-white text-green-600 text-xs py-0.5 px-2 rounded-full font-black hidden">0</span>
            📤 ثبت نهایی و ارسال به ربات
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const r_id = urlParams.get('r_id');
        const f_id = urlParams.get('f_id');
        const idx = urlParams.get('idx');
        
        let records = [];

        function addRecord() {
            const name = document.getElementById('inpName').value.trim();
            const nid = document.getElementById('inpNid').value.trim();
            const phone = document.getElementById('inpPhone').value.trim();
            const spec = document.getElementById('inpSpec').value.trim();
            const email = document.getElementById('inpEmail').value.trim();
            const bg = document.getElementById('inpBg').value.trim();

            if (!name || !nid || !phone) {
                alert("پر کردن نام، کد ملی و شماره تماس الزامی است!");
                return;
            }

            records.push({ name, nid, phone, spec, email, bg });
            
            // خالی کردن فرم
            document.getElementById('inpName').value = '';
            document.getElementById('inpNid').value = '';
            document.getElementById('inpPhone').value = '';
            document.getElementById('inpSpec').value = '';
            document.getElementById('inpEmail').value = '';
            document.getElementById('inpBg').value = '';

            renderList();
        }

        function removeRecord(index) {
            records.splice(index, 1);
            renderList();
        }

        function renderList() {
            const container = document.getElementById('addedListContainer');
            const listObj = document.getElementById('recordsList');
            const btn = document.getElementById('submitBtn');
            const counter = document.getElementById('btnCounter');

            listObj.innerHTML = '';

            if (records.length > 0) {
                container.classList.remove('hidden');
                btn.disabled = false;
                counter.classList.remove('hidden');
                counter.innerText = records.length;

                records.forEach((r, i) => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-3 rounded-lg shadow-sm border border-gray-200 flex justify-between items-center slide-up";
                    card.innerHTML = `
                        <div class="text-sm">
                            <p class="font-bold text-gray-800">${i+1}. ${r.name}</p>
                            <p class="text-xs text-gray-500 mt-1">🆔 ${r.nid} | 📱 ${r.phone}</p>
                        </div>
                        <button onclick="removeRecord(${i})" class="text-red-500 bg-red-50 p-2 rounded-lg text-xs font-bold hover:bg-red-100">حذف</button>
                    `;
                    listObj.appendChild(card);
                });
            } else {
                container.classList.add('hidden');
                btn.disabled = true;
                counter.classList.add('hidden');
            }
        }

        window.Bale.WebApp.ready();

        function submitToBot() {
            if (records.length === 0) return;

            const payload = {
                action: "submit_multi_record",
                r_id: r_id,
                f_id: f_id,
                idx: idx,
                records: records
            };

            try {
                window.Bale.WebApp.sendData(JSON.stringify(payload));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                alert("خطا در ارسال اطلاعات به ربات!");
            }
        }
    </script>
</body>
</html>
