<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت گروه‌ها</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Glassmorphism Utilities */
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glass-bottom { background: linear-gradient(to top, rgba(255,255,255,1) 60%, rgba(255,255,255,0.8)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="flex flex-col h-screen selection:bg-blue-100 overflow-hidden">

    <!-- VIEW 1: Main List -->
    <div id="mainView" class="flex flex-col h-full fade-in relative">
        <!-- Header -->
        <div class="sticky top-0 z-30 glass-header border-b border-slate-200/50 px-5 py-4 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)]">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-[1.25rem] bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-xl shadow-lg shadow-blue-200/50">
                        📚
                    </div>
                    <div>
                        <h1 class="text-base font-black text-slate-800 tracking-tight">مدیریت دپارتمان‌ها</h1>
                        <p class="text-[11px] font-bold text-slate-500 mt-0.5">افزودن، ویرایش و حذف گروه‌ها</p>
                    </div>
                </div>
                <button onclick="openGroupModal(null)" class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-xl hover:bg-blue-100 hover:scale-105 active:scale-95 transition-all shadow-sm">
                    ➕
                </button>
            </div>
            
            <!-- Search Bar -->
            <div class="relative group">
                <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                    <svg class="w-4 h-4 text-slate-400 group-focus-within:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="searchInput" onkeyup="renderGroups()" class="w-full bg-slate-100/80 border-2 border-transparent rounded-2xl py-3.5 pr-11 pl-4 text-sm font-bold text-slate-700 focus:border-blue-100 focus:bg-white focus:ring-4 focus:ring-blue-50/50 transition-all outline-none placeholder-slate-400" placeholder="جستجوی نام گروه...">
            </div>
        </div>

        <!-- List Container -->
        <div class="flex-grow overflow-y-auto px-5 pt-5 pb-32">
            <div id="groupsList" class="space-y-4"></div>
        </div>

        <!-- Bottom Action Bar -->
        <div class="absolute bottom-0 left-0 right-0 glass-bottom px-5 py-4 pb-6 z-20 border-t border-slate-100">
            <button onclick="showPreview()" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-black p-4 rounded-2xl text-sm shadow-xl shadow-blue-200/60 transition-all active:scale-[0.98] flex justify-between items-center group">
                <span class="flex items-center gap-2">
                    <svg class="w-5 h-5 opacity-80 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    پیش‌نمایش تغییرات
                </span>
                <span id="changesCount" class="bg-white/20 backdrop-blur-sm px-3 py-1 rounded-xl text-xs border border-white/10">بدون تغییر</span>
            </button>
        </div>
    </div>

    <!-- VIEW 2: Preview -->
    <div id="previewView" class="hidden flex flex-col h-full bg-slate-50 fade-in relative">
        <div class="sticky top-0 z-20 glass-header border-b border-slate-200/50 p-5 text-center shadow-sm">
            <div class="w-14 h-14 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-full flex items-center justify-center text-white text-2xl mx-auto mb-3 shadow-lg shadow-emerald-200/50">📋</div>
            <h2 class="text-lg font-black text-slate-800 tracking-tight">تایید نهایی تغییرات</h2>
            <p class="text-xs font-bold text-slate-500 mt-1">لطفاً موارد زیر را پیش از اعمال بررسی کنید</p>
        </div>

        <div class="flex-grow overflow-y-auto p-5 space-y-4 pb-32">
            <div id="previewList" class="space-y-3"></div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 glass-bottom px-5 py-4 pb-6 z-20 border-t border-slate-100 flex gap-3">
            <button onclick="hidePreview()" class="w-1/3 bg-white border-2 border-slate-200 text-slate-600 font-black p-4 rounded-2xl text-sm active:scale-[0.98] transition-all hover:bg-slate-50">بازگشت</button>
            <button id="submitBtn" onclick="submitData()" class="w-2/3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-black p-4 rounded-2xl text-sm shadow-xl shadow-teal-200/50 active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                اعمال در سرور
            </button>
        </div>
    </div>

    <!-- MODAL: Edit/Add Group -->
    <div id="groupModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center fade-in">
        <div class="bg-white w-full sm:max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl slide-up">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>
            
            <div class="flex items-center gap-3 mb-6">
                <div id="modalIconBox" class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600 text-lg">✏️</div>
                <h3 id="modalTitleText" class="text-base font-black text-slate-800">ویرایش گروه</h3>
            </div>
            
            <input type="hidden" id="m_original_name">
            <input type="hidden" id="m_is_new">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5 ml-1">نام گروه آموزشی</label>
                    <input type="text" id="m_name" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-blue-400 focus:bg-white transition-colors outline-none" placeholder="مثلاً: جراحی عمومی">
                </div>
            </div>
            
            <div class="mt-8 flex gap-3">
                <button onclick="closeModal()" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-black p-4 rounded-2xl text-sm active:scale-95 transition-all">انصراف</button>
                <button onclick="saveModal()" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-black p-4 rounded-2xl text-sm shadow-lg shadow-blue-200/50 active:scale-95 transition-all">💾 ذخیره موقت</button>
            </div>
        </div>
    </div>

    <script>
        let db_groups = []; 
        let new_groups = []; 
        let edited_groups = {}; 
        let deleted_groups = []; 

        function showAlert(msg, type = 'error') {
            const existing = document.getElementById('customAlert');
            if(existing) existing.remove();
            const bgClass = type === 'error' ? 'bg-rose-500' : 'bg-emerald-500';
            const alertBox = document.createElement('div');
            alertBox.id = 'customAlert';
            alertBox.className = `fixed top-6 left-1/2 -translate-x-1/2 ${bgClass} text-white px-6 py-3.5 rounded-2xl shadow-xl shadow-${type === 'error' ? 'rose' : 'emerald'}-200/50 z-[100] text-sm font-black text-center w-11/12 max-w-sm slide-up flex items-center justify-center gap-2`;
            alertBox.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span> <span>${msg}</span>`;
            document.body.appendChild(alertBox);
            setTimeout(() => { if(document.getElementById('customAlert')) document.getElementById('customAlert').remove(); }, 3500);
        }

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                if (compressedData) {
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    const data = JSON.parse(decompressed);
                    db_groups = data.g || [];
                }
                renderGroups();
            } catch(e) { showAlert("خطا در بارگذاری اطلاعات از سرور."); }
        }

        function renderGroups() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('groupsList');
            container.innerHTML = '';
            
            new_groups.forEach(g => {
                if (filter && !g.toLowerCase().includes(filter)) return;
                container.innerHTML += createCard(g, g, 'new');
            });

            db_groups.forEach(old_g => {
                if (deleted_groups.includes(old_g)) return; 
                
                const currentName = edited_groups[old_g] || old_g;
                if (filter && !currentName.toLowerCase().includes(filter)) return;
                
                const state = edited_groups[old_g] ? 'edited' : 'normal';
                container.innerHTML += createCard(old_g, currentName, state);
            });

            updateChangesCount();
        }

        function createCard(originalName, currentName, state) {
            let badge = '';
            let bgClass = 'bg-white border-slate-100';
            let iconBg = 'from-slate-100 to-slate-200 text-slate-500';
            let icon = '📁';

            if (state === 'new') { 
                badge = '<span class="bg-emerald-100 text-emerald-600 text-[10px] font-black px-2 py-0.5 rounded-lg border border-emerald-200/50 mt-1 inline-block">جدید</span>'; 
                bgClass = 'bg-emerald-50/30 border-emerald-100'; 
                iconBg = 'from-emerald-100 to-teal-100 text-emerald-600';
                icon = '✨';
            } else if (state === 'edited') { 
                badge = '<span class="bg-amber-100 text-amber-600 text-[10px] font-black px-2 py-0.5 rounded-lg border border-amber-200/50 mt-1 inline-block">ویرایش شده</span>'; 
                bgClass = 'bg-amber-50/30 border-amber-100'; 
                iconBg = 'from-amber-100 to-orange-100 text-amber-600';
                icon = '✏️';
            } else {
                iconBg = 'from-blue-100 to-indigo-100 text-blue-600';
            }

            return `
                <div class="${bgClass} p-4 rounded-[1.5rem] shadow-[0_4px_20px_-4px_rgba(0,0,0,0.03)] border flex items-center justify-between gap-3 slide-up hover:shadow-md transition-all">
                    <div class="flex items-center gap-4 overflow-hidden">
                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${iconBg} flex items-center justify-center text-xl font-black border-2 border-white shadow-sm flex-shrink-0">
                            ${icon}
                        </div>
                        <div class="overflow-hidden">
                            <p class="text-sm font-black text-slate-800 truncate">${currentName}</p>
                            ${badge}
                        </div>
                    </div>
                    <div class="flex gap-2 flex-shrink-0">
                        <button onclick="openGroupModal('${originalName}', '${state === 'new'}')" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center text-sm hover:bg-blue-50 hover:text-blue-600 hover:scale-105 active:scale-95 transition-all"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                        <button onclick="deleteGroup('${originalName}', '${state === 'new'}')" class="w-9 h-9 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center text-sm hover:bg-rose-100 hover:scale-105 active:scale-95 transition-all"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                </div>
            `;
        }

        function openGroupModal(originalName, isNew) {
            isNew = isNew === 'true';
            document.getElementById('m_original_name').value = originalName || '';
            document.getElementById('m_is_new').value = isNew;
            
            if (originalName) {
                document.getElementById('modalTitleText').innerText = 'ویرایش گروه';
                document.getElementById('modalIconBox').innerHTML = '✏️';
                document.getElementById('modalIconBox').className = 'w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center text-amber-600 text-lg';
                document.getElementById('m_name').value = isNew ? originalName : (edited_groups[originalName] || originalName);
            } else {
                document.getElementById('modalTitleText').innerText = 'افزودن گروه جدید';
                document.getElementById('modalIconBox').innerHTML = '➕';
                document.getElementById('modalIconBox').className = 'w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-600 text-lg';
                document.getElementById('m_name').value = '';
            }

            document.getElementById('groupModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('groupModal').classList.add('hidden');
        }

        function saveModal() {
            const originalName = document.getElementById('m_original_name').value;
            const isNew = document.getElementById('m_is_new').value === 'true';
            const newName = document.getElementById('m_name').value.trim();
            
            if (!newName) { showAlert("نام گروه الزامی است."); return; }

            if (db_groups.includes(newName) && newName !== originalName) { showAlert("این گروه قبلاً در سیستم ثبت شده است."); return; }
            if (new_groups.includes(newName) && newName !== originalName) { showAlert("این گروه در لیست جدیدها موجود است."); return; }
            if (Object.values(edited_groups).includes(newName) && newName !== originalName) { showAlert("این نام برای گروه دیگری رزرو شده است."); return; }

            if (!originalName) {
                new_groups.push(newName);
            } else if (isNew) {
                const idx = new_groups.indexOf(originalName);
                if (idx > -1) new_groups[idx] = newName;
            } else {
                if (newName === originalName) {
                    delete edited_groups[originalName]; 
                } else {
                    edited_groups[originalName] = newName;
                }
            }

            closeModal();
            renderGroups();
            showAlert("تغییرات موقتاً ذخیره شد.", "success");
        }

        function deleteGroup(originalName, isNew) {
            isNew = isNew === 'true';
            if (confirm(`آیا از حذف گروه «${originalName}» مطمئن هستید؟ (تمام دستیاران این گروه نیز حذف خواهند شد)`)) {
                if (isNew) {
                    new_groups = new_groups.filter(g => g !== originalName);
                } else {
                    deleted_groups.push(originalName);
                    if (edited_groups[originalName]) delete edited_groups[originalName];
                }
                renderGroups();
                showAlert("گروه حذف شد.", "success");
            }
        }

        function updateChangesCount() {
            const total = new_groups.length + Object.keys(edited_groups).length + deleted_groups.length;
            const badge = document.getElementById('changesCount');
            if (total > 0) {
                badge.innerText = `${total} تغییر`;
                badge.className = "bg-white text-blue-600 px-3 py-1 rounded-xl text-xs font-black shadow-sm";
            } else {
                badge.innerText = `بدون تغییر`;
                badge.className = "bg-white/20 backdrop-blur-sm px-3 py-1 rounded-xl text-xs border border-white/10";
            }
        }

        function showPreview() {
            const total = new_groups.length + Object.keys(edited_groups).length + deleted_groups.length;
            if (total === 0) { showAlert("تغییری برای اعمال وجود ندارد."); return; }

            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('previewView').classList.remove('hidden');

            const container = document.getElementById('previewList');
            container.innerHTML = '';

            new_groups.forEach(g => {
                container.innerHTML += `
                    <div class="bg-emerald-50 border-2 border-emerald-100 p-4 rounded-2xl slide-up flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg">➕</div>
                        <div>
                            <p class="text-xs font-black text-emerald-700 uppercase tracking-wider mb-0.5">افزوده می‌شود</p>
                            <p class="text-sm font-black text-slate-800">${g}</p>
                        </div>
                    </div>
                `;
            });

            Object.entries(edited_groups).forEach(([oldG, newG]) => {
                container.innerHTML += `
                    <div class="bg-amber-50 border-2 border-amber-100 p-4 rounded-2xl slide-up flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-lg">✏️</div>
                        <div>
                            <p class="text-xs font-black text-amber-700 uppercase tracking-wider mb-0.5">تغییر نام می‌یابد</p>
                            <p class="text-sm font-black text-slate-800">${oldG} <span class="text-slate-400 mx-1">➔</span> ${newG}</p>
                        </div>
                    </div>
                `;
            });

            deleted_groups.forEach(g => {
                container.innerHTML += `
                    <div class="bg-rose-50 border-2 border-rose-100 p-4 rounded-2xl slide-up flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-lg">🗑</div>
                        <div>
                            <p class="text-xs font-black text-rose-700 uppercase tracking-wider mb-0.5">حذف می‌شود</p>
                            <p class="text-sm font-black text-slate-800">${g}</p>
                        </div>
                    </div>
                `;
            });
        }

        function hidePreview() {
            document.getElementById('previewView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
        }

        window.Bale.WebApp.ready();

        function submitData() {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> در حال ارسال...';
            btn.classList.add('opacity-90', 'cursor-wait');

            const editedArr = Object.entries(edited_groups).map(([oldG, newG]) => ({ old: oldG, new: newG }));

            const payload = {
                action: "submit_manage_groups",
                new_groups: new_groups,
                edited_groups: editedArr,
                deleted_groups: deleted_groups
            };

            try {
                window.Bale.WebApp.sendData(JSON.stringify(payload));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                showAlert("خطا در ارتباط با سرور.");
                btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> اعمال در سرور';
                btn.classList.remove('opacity-90', 'cursor-wait');
            }
        }

        init();
    </script>
</body>
</html>
