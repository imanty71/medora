<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سامانه نظرسنجی و پایش ادواری بالینی</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <style>
        body { 
            font-family: 'Vazirmatn', sans-serif; 
            -webkit-font-smoothing: antialiased;
            background-color: #030712;
            color: #f8fafc;
            -webkit-user-select: none;
            user-select: none;
            overflow-x: hidden;
        }

        .fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

        /* کارت‌های شیشه‌ای شفق قطبی (Aurora Cards) */
        .aurora-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.65) 0%, rgba(8, 14, 28, 0.8) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .aurora-input {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
        }
        .aurora-input:focus {
            border-color: rgba(59, 130, 246, 0.6) !important;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.25);
        }

        /* دکمه کپسولی درخشان */
        .btn-aurora-glow {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #4f46e5 100%);
            box-shadow: 0 8px 30px -4px rgba(37, 99, 235, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-aurora-glow:active {
            transform: scale(0.98);
        }

        /* دکمه‌های طیف لیکرت ۵ گزینه‌ای */
        .likert-btn {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .likert-btn-active {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.3) 0%, rgba(79, 70, 229, 0.3) 100%) !important;
            border-color: #3b82f6 !important;
            color: #93c5fd !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }

        /* ستاره‌های درخشان */
        .star-active {
            color: #fbbf24 !important;
            filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6));
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- لایه‌های نوری امبینت پس‌زمینه (Aurora Mesh Glow) -->
    <div class="fixed top-[-10%] right-[-10%] w-[380px] h-[380px] rounded-full bg-gradient-to-br from-blue-600/30 via-indigo-600/20 to-transparent blur-[110px] pointer-events-none -z-10 animate-pulse" style="animation-duration: 8s;"></div>
    <div class="fixed bottom-[-10%] left-[-15%] w-[420px] h-[420px] rounded-full bg-gradient-to-tr from-cyan-600/25 via-blue-600/15 to-transparent blur-[120px] pointer-events-none -z-10"></div>

    <!-- هدر شناور -->
    <div class="sticky top-0 z-30 bg-[#030712]/75 backdrop-blur-2xl border-b border-white/[0.06] px-4 py-3.5 shadow-2xl">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-blue-500/20 to-indigo-500/10 border border-blue-400/30 text-blue-400 flex items-center justify-center text-lg font-black shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                    📊
                </div>
                <div>
                    <h1 class="text-xs font-black text-white tracking-wide" id="surveyHeaderTitle">پایش و نظرسنجی ادواری</h1>
                    <p class="text-[10px] text-blue-300/70 font-bold mt-0.5" id="surveySubtitle">دانشکده پزشکی</p>
                </div>
            </div>
            <span class="text-[9px] font-black px-3 py-1.5 rounded-full bg-blue-500/10 text-blue-300 border border-blue-400/20" id="surveyAnonBadge">
                🔒 ناشناس
            </span>
        </div>

        <!-- نوار پیشرفت درصد پاسخ‌گویی -->
        <div class="mt-3 space-y-1">
            <div class="flex justify-between text-[9px] font-bold text-slate-400">
                <span id="progressText">پیشرفت پاسخ‌گویی: سوال ۱ از ۵</span>
                <span id="progressPercent" class="text-blue-400">۲۰٪</span>
            </div>
            <div class="w-full bg-white/[0.05] rounded-full h-1.5 overflow-hidden border border-white/[0.05]">
                <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full rounded-full transition-all duration-300" style="width: 20%;"></div>
            </div>
        </div>
    </div>

    <!-- بدنه اصلی سوالات -->
    <div class="flex-grow overflow-y-auto p-4 pb-28 space-y-4 fade-in">
        
        <!-- توضیحات و مقدمه فرم -->
        <div class="aurora-card p-4 rounded-3xl space-y-1.5 border border-blue-500/20 shadow-lg" id="introCard">
            <p class="text-xs font-black text-blue-300 flex items-center gap-1.5">
                <span>📋</span> راهنمای تکمیل فرم:
            </p>
            <p class="text-[11px] text-slate-300/85 leading-relaxed font-semibold" id="surveyDescription">
                دستیار گرامی، نظرات شما مبنای تصمیم‌گیری معاونت آموزش و بازرسی‌های ادواری بخش‌ها خواهد بود. لطفاً با آرامش پاسخ دهید.
            </p>
        </div>

        <!-- ظرف رندر سوالات -->
        <div id="questionsContainer" class="space-y-4">
            <!-- سوالات اینجا رندر می‌شوند -->
        </div>

        <!-- دکمه نهایی ثبت -->
        <div class="pt-2">
            <button onclick="submitSurveyAnswers()" id="btnSubmitSurvey" class="btn-aurora-glow w-full text-white font-black p-4 rounded-full text-xs flex justify-center items-center gap-2">
                <span>📤</span> ثبت نهایی و ارسال پاسخ‌ها
            </button>
        </div>
    </div>

    <!-- CUSTOM GLASS TOAST (جایگزین alert) -->
    <div id="customToast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] hidden w-11/12 max-w-sm fade-in">
        <div id="toastBox" class="aurora-card p-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-white/10 backdrop-blur-2xl">
            <span class="text-xl" id="toastIcon">💡</span>
            <div class="flex-1">
                <p class="text-xs font-extrabold text-white" id="toastMessage">پیام سیستم</p>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#030712]/80 backdrop-blur-xl p-3.5 border-t border-white/[0.07] shadow-2xl z-20">
        <button onclick="closeApp()" class="w-full bg-white/[0.04] hover:bg-white/[0.08] text-slate-300 font-black p-3.5 rounded-full text-xs transition-all active:scale-[0.98] border border-white/[0.06] flex justify-center items-center gap-2">
            🔙 بازگشت به ربات
        </button>
    </div>

    <script>
        let surveyData = {
            survey_id: "",
            title: "ارزشیابی و بازدید ادواری بخش بالینی",
            description: "",
            is_anonymous: 1,
            questions: []
        };
        let answersState = {};
        let toastTimeout = null;

        function showToast(msg, type = 'info') {
            if (toastTimeout) clearTimeout(toastTimeout);
            const toast = document.getElementById('customToast');
            const box = document.getElementById('toastBox');
            const icon = document.getElementById('toastIcon');
            const text = document.getElementById('toastMessage');

            text.innerText = msg;
            if (type === 'error') {
                icon.innerText = '🚫';
                box.className = "aurora-card p-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-rose-500/40 bg-rose-950/60";
            } else if (type === 'warning') {
                icon.innerText = '⚠️';
                box.className = "aurora-card p-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-amber-500/40 bg-amber-950/60";
            } else if (type === 'success') {
                icon.innerText = '✅';
                box.className = "aurora-card p-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-emerald-500/40 bg-emerald-950/60";
            } else {
                icon.innerText = '💡';
                box.className = "aurora-card p-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-blue-500/40 bg-blue-950/60";
            }

            toast.classList.remove('hidden');
            toastTimeout = setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        }

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                if (compressedData) {
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    surveyData = JSON.parse(decompressed);

                    document.getElementById('surveyHeaderTitle').innerText = surveyData.title || "نظرسنجی ادواری";
                    document.getElementById('surveyDescription').innerText = surveyData.description || "لطفاً با دقت به سوالات زیر پاسخ دهید.";
                    document.getElementById('surveyAnonBadge').innerText = (surveyData.is_anonymous === 1) ? "🔒 ناشناس و محرمانه" : "👤 با ثبت هویت";

                    renderQuestions();
                } else {
                    // سوالات پیش‌فرض نمایشی در صورت نبود دیتا
                    loadDefaultInspectionQuestions();
                    renderQuestions();
                }
            } catch(e) {
                console.error(e);
                loadDefaultInspectionQuestions();
                renderQuestions();
            }
        }

        function loadDefaultInspectionQuestions() {
            surveyData.questions = [
                { id: 1, type: "likert", q: "میزان رعایت سقف ساعات کشیک مصوب و حضور مؤثر اساتید در راندهای صبحگاهی:" },
                { id: 2, type: "star", q: "وضعیت امکانات رفاهی پاویون دستیاران، تهویه و تغذیه کشیک:" },
                { id: 3, type: "likert", q: "رعایت کوریکولوم آموزشی و تناسب عمل‌های جراحی/پروسیجرها با سال دستیاری:" },
                { id: 4, type: "choice", q: "آیا راندهای آموزشی مورتالیتی و موربیدیتی (M&M) به طور منظم برگزار می‌گردد؟", options: ["بله، هفتگی و منظم", "نامنظم و گاه‌به‌گاه", "خیر، برگزار نمی‌شود"] },
                { id: 5, type: "text", q: "نقطه نظرات، پیشنهادات یا چالش‌های خاص این بخش جهت پیگیری معاونت آموزش:" }
            ];
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            const qList = surveyData.questions || [];
            updateProgress();

            qList.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = "aurora-card p-4 rounded-3xl space-y-3 slide-up";
                card.style.animationDelay = `${idx * 0.05}s`;

                let answersHtml = '';

                // ۱. طیف لیکرت ۵ گزینه‌ای
                if (q.type === 'likert') {
                    const currentVal = answersState[q.id];
                    const levels = [
                        { v: 1, label: "بسیار ضعیف", emoji: "😡" },
                        { v: 2, label: "ضعیف", emoji: "🙁" },
                        { v: 3, label: "متوسط", emoji: "😐" },
                        { v: 4, label: "خوب", emoji: "🙂" },
                        { v: 5, label: "عالی", emoji: "🤩" }
                    ];

                    let btns = '';
                    levels.forEach(lvl => {
                        const isAct = currentVal === lvl.v;
                        btns += `
                            <button onclick="setLikertAnswer(${q.id}, ${lvl.v})" class="likert-btn flex-1 py-2 px-1 rounded-2xl flex flex-col items-center justify-center gap-1 ${isAct ? 'likert-btn-active' : ''}">
                                <span class="text-base">${lvl.emoji}</span>
                                <span class="text-[9px] font-bold text-slate-300">${lvl.label}</span>
                            </button>
                        `;
                    });

                    answersHtml = `<div class="flex gap-1.5 pt-1">${btns}</div>`;
                }
                // ۲. امتیاز ستاره‌ای ۵ تایی
                else if (q.type === 'star') {
                    const currentStar = answersState[q.id] || 0;
                    let stars = '';
                    for (let s = 1; s <= 5; s++) {
                        const isFilled = s <= currentStar;
                        stars += `
                            <button onclick="setStarAnswer(${q.id}, ${s})" class="text-2xl transition-transform active:scale-125 ${isFilled ? 'star-active' : 'text-slate-600'}">
                                ★
                            </button>
                        `;
                    }
                    answersHtml = `<div class="flex justify-center gap-3 py-2 direction-ltr">${stars}</div>`;
                }
                // ۳. چندگزینه‌ای اختصاصی
                else if (q.type === 'choice') {
                    const currentChoice = answersState[q.id];
                    let opts = '';
                    (q.options || []).forEach(opt => {
                        const isSel = currentChoice === opt;
                        opts += `
                            <div onclick="setChoiceAnswer(${q.id}, '${opt}')" class="p-3 rounded-2xl cursor-pointer flex justify-between items-center transition-all ${isSel ? 'bg-blue-600/25 border border-blue-400/50' : 'bg-white/[0.02] border border-white/[0.06] hover:bg-white/[0.05]'}">
                                <span class="text-xs font-bold ${isSel ? 'text-blue-300 font-black' : 'text-slate-200'}">${opt}</span>
                                ${isSel ? '<span class="text-blue-400 text-xs">✓</span>' : ''}
                            </div>
                        `;
                    });
                    answersHtml = `<div class="space-y-2 pt-1">${opts}</div>`;
                }
                // ۴. پاسخ متنی تشریحی
                else if (q.type === 'text') {
                    const textVal = answersState[q.id] || '';
                    answersHtml = `
                        <textarea oninput="setTextAnswer(${q.id}, this.value)" rows="3" class="aurora-input w-full rounded-2xl p-3 text-xs font-bold text-slate-100 outline-none leading-relaxed resize-none placeholder-slate-500" placeholder="یادداشت، انتقاد یا پیشنهاد خود را تایپ فرمایید...">${textVal}</textarea>
                    `;
                }

                card.innerHTML = `
                    <div class="flex items-start gap-2.5">
                        <span class="w-6 h-6 rounded-full bg-blue-500/20 text-blue-400 border border-blue-400/30 flex items-center justify-center text-xs font-black flex-shrink-0 mt-0.5">
                            ${idx + 1}
                        </span>
                        <p class="text-xs font-black text-slate-100 leading-relaxed">${q.q}</p>
                    </div>
                    ${answersHtml}
                `;
                container.appendChild(card);
            });
        }

        function setLikertAnswer(qid, val) {
            answersState[qid] = val;
            renderQuestions();
        }

        function setStarAnswer(qid, val) {
            answersState[qid] = val;
            renderQuestions();
        }

        function setChoiceAnswer(qid, val) {
            answersState[qid] = val;
            renderQuestions();
        }

        function setTextAnswer(qid, val) {
            answersState[qid] = val;
            updateProgress();
        }

        function updateProgress() {
            const qList = surveyData.questions || [];
            const answeredCount = Object.keys(answersState).filter(k => answersState[k] !== "").length;
            const percent = qList.length > 0 ? Math.round((answeredCount / qList.length) * 100) : 0;

            document.getElementById('progressText').innerText = `پیشرفت پاسخ‌گویی: ${answeredCount} از ${qList.length} سوال`;
            document.getElementById('progressPercent').innerText = `${percent}٪`;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        function submitSurveyAnswers() {
            const qList = surveyData.questions || [];
            const requiredQ = qList.filter(q => q.type !== 'text');
            const unAnswered = requiredQ.filter(q => !answersState[q.id]);

            if (unAnswered.length > 0) {
                showToast("لطفاً به تمامی سوالات امتیازی پاسخ دهید.", "warning");
                return;
            }

            const btn = document.getElementById('btnSubmitSurvey');
            btn.innerHTML = '⏳ در حال ثبت پاسخ‌ها...';
            btn.classList.add('opacity-50', 'pointer-events-none');

            const payload = {
                action: "submit_survey_response",
                survey_id: surveyData.survey_id || "srv_inspection",
                answers: answersState
            };

            try {
                window.Bale.WebApp.sendData(JSON.stringify(payload));
                showToast("پاسخ‌های شما با موفقیت ثبت گردید.", "success");
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch(e) {
                showToast("خطا در ارسال داده به سرور.", "error");
                btn.innerHTML = '<span>📤</span> ثبت نهایی و ارسال پاسخ‌ها';
                btn.classList.remove('opacity-50', 'pointer-events-none');
            }
        }

        function closeApp() {
            try { window.Bale.WebApp.close(); } catch(e) {}
        }

        window.Bale.WebApp.ready();
        init();
    </script>
</body>
</html>
