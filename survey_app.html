<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>موتور جامع فرم‌ساز و نظرسنجی ادواری</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <style>
        body { 
            font-family: 'Vazirmatn', sans-serif; 
            -webkit-font-smoothing: antialiased; 
            background-color: #030712;
            color: #f8fafc;
            user-select: none;
            overflow-x: hidden;
        }
        .fade-in { animation: fadeIn 0.25s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        .sheet-up { animation: sheetUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .aurora-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.65) 0%, rgba(8, 14, 28, 0.8) 100%);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }
        .aurora-input {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .aurora-input:focus { border-color: rgba(59, 130, 246, 0.6) !important; }
        .btn-aurora-glow {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #4f46e5 100%);
            box-shadow: 0 8px 30px -4px rgba(37, 99, 235, 0.55);
        }
        .likert-active {
            background: rgba(37, 99, 235, 0.3) !important;
            border-color: #3b82f6 !important;
            color: #93c5fd !important;
            transform: translateY(-2px);
        }
        .star-active { color: #fbbf24 !important; filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6)); }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- لایه‌های نوری امبینت -->
    <div class="fixed top-[-10%] right-[-10%] w-[380px] h-[380px] rounded-full bg-gradient-to-br from-blue-600/30 via-indigo-600/20 to-transparent blur-[110px] pointer-events-none -z-10 animate-pulse"></div>
    <div class="fixed bottom-[-10%] left-[-15%] w-[420px] h-[420px] rounded-full bg-gradient-to-tr from-cyan-600/25 via-blue-600/15 to-transparent blur-[120px] pointer-events-none -z-10"></div>

    <!-- هدر با منوی کشویی فرم‌ها -->
    <div class="sticky top-0 z-30 bg-[#030712]/80 backdrop-blur-2xl border-b border-white/[0.06] px-4 py-3 shadow-2xl">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="toggleSurveysDrawer()" class="w-10 h-10 rounded-2xl bg-white/[0.05] border border-white/10 text-blue-400 flex items-center justify-center text-lg active:scale-95 transition-all">
                    ☰
                </button>
                <div>
                    <h1 class="text-xs font-black text-white" id="currentSurveyTitle">فرم بازدید ادواری بالینی</h1>
                    <p class="text-[10px] text-blue-300/70 font-bold" id="currentSurveySub">دانشکده پزشکی</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="btnCreateNewSurvey" onclick="openSurveyBuilder()" class="hidden text-[10px] font-black bg-blue-600/20 text-blue-300 border border-blue-400/30 px-3 py-1.5 rounded-full active:scale-95">
                    ➕ ساخت فرم جدید
                </button>
            </div>
        </div>
    </div>

    <!-- منوی کشویی فرم‌های ذخیره‌شده (Drawer Sidebar) -->
    <div id="surveysDrawer" class="fixed inset-0 bg-[#030712]/80 backdrop-blur-md z-50 hidden flex flex-col justify-end fade-in">
        <div class="aurora-card rounded-t-3xl w-full max-h-[80vh] flex flex-col shadow-2xl sheet-up border-t border-white/10 p-5 space-y-4">
            <div class="flex justify-between items-center border-b border-white/[0.06] pb-3">
                <h3 class="text-xs font-black text-blue-300 flex items-center gap-2">
                    <span>🗂</span> آرشیو فرم‌ها و نظرسنجی‌های ادواری
                </h3>
                <button onclick="toggleSurveysDrawer()" class="text-slate-400 text-sm">✕</button>
            </div>

            <div class="space-y-2 overflow-y-auto max-h-64 pr-1" id="drawerSurveysList"></div>

            <button onclick="openSurveyBuilder()" class="btn-aurora-glow w-full text-white py-3 rounded-full text-xs font-black flex justify-center items-center gap-2">
                <span>➕</span> ساخت نظرسنجی یا چک‌لیست جدید
            </button>
        </div>
    </div>

    <!-- VIEW: پاسخگویی به فرم -->
    <div id="view_answering" class="flex-grow overflow-y-auto p-4 pb-28 space-y-4 fade-in">
        <div class="aurora-card p-4 rounded-3xl space-y-2 border border-blue-500/20">
            <p class="text-xs font-black text-blue-300" id="answeringDesc">لطفاً با دقت به سوالات زیر پاسخ دهید.</p>
        </div>
        <div id="surveyQuestionsBox" class="space-y-4"></div>
        <button onclick="submitSurveyAnswers()" id="btnSubmitSurvey" class="btn-aurora-glow w-full text-white font-black p-4 rounded-full text-xs flex justify-center items-center gap-2">
            <span>📤</span> ثبت نهایی پاسخ‌ها
        </button>
    </div>

    <!-- VIEW: استودیوی ساخت فرم جدید با انواع مدل‌های سوال -->
    <div id="view_builder" class="hidden flex-grow overflow-y-auto p-4 pb-28 space-y-4 fade-in">
        <div class="aurora-card p-4 rounded-3xl space-y-3">
            <h3 class="text-xs font-black text-blue-300">🛠 مشخصات فرم جدید:</h3>
            <input type="text" id="bldTitle" class="aurora-input w-full rounded-2xl p-3 text-xs font-bold text-slate-100 outline-none" placeholder="عنوان فرم (مثلاً: ارزشیابی پاویون و کشیک)">
            <textarea id="bldDesc" rows="2" class="aurora-input w-full rounded-2xl p-3 text-xs font-bold text-slate-100 outline-none resize-none" placeholder="توضیحات و راهنمای فرم..."></textarea>
        </div>

        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h4 class="text-xs font-black text-slate-300">سوالات طراحی‌شده:</h4>
                <button onclick="addBuilderQuestion()" class="text-[10px] font-black bg-white/[0.05] border border-white/10 text-blue-400 px-3 py-1.5 rounded-full">
                    ➕ افزودن سوال
                </button>
            </div>
            <div id="builderQuestionsList" class="space-y-3"></div>
        </div>

        <div class="flex gap-2 pt-2">
            <button onclick="cancelBuilder()" class="w-1/3 bg-slate-900 text-slate-400 py-3 rounded-full text-xs font-bold">انصراف</button>
            <button onclick="saveBuilderSurvey()" class="btn-aurora-glow w-2/3 text-white py-3 rounded-full text-xs font-black">💾 ذخیره فرم جدید</button>
        </div>
    </div>

    <!-- CUSTOM TOAST -->
    <div id="customToast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] hidden w-11/12 max-w-sm fade-in">
        <div id="toastBox" class="aurora-card p-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-white/10">
            <span class="text-xl" id="toastIcon">💡</span>
            <p class="text-xs font-extrabold text-white flex-1" id="toastMessage"></p>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#030712]/80 backdrop-blur-xl p-3.5 border-t border-white/[0.07] shadow-2xl z-20">
        <button onclick="closeApp()" class="w-full bg-white/[0.04] hover:bg-white/[0.08] text-slate-300 font-black p-3.5 rounded-full text-xs transition-all active:scale-[0.98] border border-white/[0.06] flex justify-center items-center gap-2">
            🔙 بازگشت به ربات
        </button>
    </div>

    <script>
        let allSurveys = [];
        let currentSurvey = null;
        let answersState = {};
        let builderQuestions = [];
        let isAdmin = 0;

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('customToast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        }

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            try {
                const compressedData = urlParams.get('d');
                if (compressedData) {
                    const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                    const decompressed = pako.inflate(bytes, { to: 'string' });
                    const payload = JSON.parse(decompressed);

                    allSurveys = payload.all_surveys || [payload];
                    isAdmin = payload.is_admin || 0;
                    currentSurvey = allSurveys[0];

                    if (isAdmin === 1) {
                        document.getElementById('btnCreateNewSurvey').classList.remove('hidden');
                    }
                    renderCurrentSurvey();
                    renderDrawerList();
                }
            } catch(e) { console.error(e); }
        }

        function toggleSurveysDrawer() {
            document.getElementById('surveysDrawer').classList.toggle('hidden');
        }

        function renderDrawerList() {
            const container = document.getElementById('drawerSurveysList');
            container.innerHTML = '';
            if (allSurveys.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-slate-500">فرمی در آرشیو وجود ندارد.</div>`;
                return;
            }
            allSurveys.forEach((s, idx) => {
                container.innerHTML += `
                    <div onclick="selectSurveyFromDrawer(${idx})" class="p-3 bg-white/[0.03] hover:bg-white/[0.07] border border-white/[0.06] rounded-2xl cursor-pointer flex justify-between items-center transition-all">
                        <div>
                            <p class="text-xs font-black text-slate-100">${s.title}</p>
                            <p class="text-[9px] text-slate-400 mt-0.5">${(s.questions || []).length} سوال</p>
                        </div>
                        <span class="text-blue-400 text-xs">انتخاب ➔</span>
                    </div>
                `;
            });
        }

        function selectSurveyFromDrawer(idx) {
            currentSurvey = allSurveys[idx];
            answersState = {};
            renderCurrentSurvey();
            toggleSurveysDrawer();
        }

        function renderCurrentSurvey() {
            if (!currentSurvey) return;
            document.getElementById('currentSurveyTitle').innerText = currentSurvey.title;
            document.getElementById('currentSurveySub').innerText = `${(currentSurvey.questions || []).length} بخش ارزیابی`;
            document.getElementById('answeringDesc').innerText = currentSurvey.description || "لطفاً به تمامی سوالات پاسخ دهید.";

            const box = document.getElementById('surveyQuestionsBox');
            box.innerHTML = '';

            (currentSurvey.questions || []).forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = "aurora-card p-4 rounded-3xl space-y-3 slide-up";
                card.style.animationDelay = `${idx * 0.04}s`;

                let bodyHtml = '';
                // ۱. طیف لیکرت ۵ تایی
                if (q.type === 'likert') {
                    const levels = [{v:1, e:"😡", l:"خیلی ضعیف"}, {v:2, e:"🙁", l:"ضعیف"}, {v:3, e:"😐", l:"متوسط"}, {v:4, e:"🙂", l:"خوب"}, {v:5, e:"🤩", l:"عالی"}];
                    let btns = '';
                    levels.forEach(lvl => {
                        const isAct = answersState[q.id] === lvl.v ? 'likert-active' : '';
                        btns += `
                            <button onclick="setAns(${q.id}, ${lvl.v})" class="flex-1 py-2 rounded-2xl bg-white/[0.03] border border-white/[0.06] flex flex-col items-center gap-1 ${isAct}">
                                <span class="text-base">${lvl.e}</span>
                                <span class="text-[8px] font-bold text-slate-300">${lvl.l}</span>
                            </button>
                        `;
                    });
                    bodyHtml = `<div class="flex gap-1.5 pt-1">${btns}</div>`;
                }
                // ۲. ستاره ۵ تایی
                else if (q.type === 'star') {
                    const cur = answersState[q.id] || 0;
                    let stars = '';
                    for (let s = 1; s <= 5; s++) {
                        stars += `<button onclick="setAns(${q.id}, ${s})" class="text-2xl ${s <= cur ? 'star-active' : 'text-slate-600'}">★</button>`;
                    }
                    bodyHtml = `<div class="flex justify-center gap-3 py-2 direction-ltr">${stars}</div>`;
                }
                // ۳. رادیوباتن تک انتخابی
                else if (q.type === 'choice') {
                    let opts = '';
                    (q.options || []).forEach(opt => {
                        const isSel = answersState[q.id] === opt;
                        opts += `
                            <div onclick="setAns(${q.id}, '${opt}')" class="p-3 rounded-2xl cursor-pointer flex justify-between items-center ${isSel ? 'bg-blue-600/25 border border-blue-400/50 text-blue-300' : 'bg-white/[0.02] border border-white/[0.06] text-slate-200'}">
                                <span class="text-xs font-bold">${opt}</span>
                                ${isSel ? '<span class="text-blue-400">✓</span>' : ''}
                            </div>
                        `;
                    });
                    bodyHtml = `<div class="space-y-2 pt-1">${opts}</div>`;
                }
                // ۴. چک‌باکس چندانتخابی
                else if (q.type === 'checkbox') {
                    let opts = '';
                    const curArr = answersState[q.id] || [];
                    (q.options || []).forEach(opt => {
                        const isSel = curArr.includes(opt);
                        opts += `
                            <div onclick="toggleMultiAns(${q.id}, '${opt}')" class="p-3 rounded-2xl cursor-pointer flex justify-between items-center ${isSel ? 'bg-indigo-600/25 border border-indigo-400/50 text-indigo-300' : 'bg-white/[0.02] border border-white/[0.06] text-slate-200'}">
                                <span class="text-xs font-bold">${opt}</span>
                                ${isSel ? '<span class="text-indigo-400 font-bold">☑</span>' : '<span class="text-slate-600">☐</span>'}
                            </div>
                        `;
                    });
                    bodyHtml = `<div class="space-y-2 pt-1">${opts}</div>`;
                }
                // ۵. متن تشریحی
                else if (q.type === 'text') {
                    bodyHtml = `<textarea oninput="setAns(${q.id}, this.value)" rows="3" class="aurora-input w-full rounded-2xl p-3 text-xs font-bold text-slate-100 outline-none resize-none" placeholder="پاسخ خود را بنویسید...">${answersState[q.id] || ''}</textarea>`;
                }

                card.innerHTML = `
                    <div class="flex items-start gap-2.5">
                        <span class="w-6 h-6 rounded-full bg-blue-500/20 text-blue-400 border border-blue-400/30 flex items-center justify-center text-xs font-black flex-shrink-0 mt-0.5">${idx+1}</span>
                        <p class="text-xs font-black text-slate-100 leading-relaxed">${q.q}</p>
                    </div>
                    ${bodyHtml}
                `;
                box.appendChild(card);
            });
        }

        function setAns(qid, val) { answersState[qid] = val; renderCurrentSurvey(); }
        function toggleMultiAns(qid, val) {
            let arr = answersState[qid] || [];
            if (arr.includes(val)) arr = arr.filter(x => x !== val);
            else arr.push(val);
            answersState[qid] = arr;
            renderCurrentSurvey();
        }

        // ==========================================
        // استودیوی ساخت نظرسنجی جدید (Admin Builder)
        // ==========================================
        function openSurveyBuilder() {
            builderQuestions = [
                { id: 1, q: "میزان رضایت کلی:", type: "likert", options: [] },
                { id: 2, q: "امتیاز کیفی:", type: "star", options: [] }
            ];
            renderBuilderQuestions();
            document.getElementById('surveysDrawer').classList.add('hidden');
            document.getElementById('view_answering').classList.add('hidden');
            document.getElementById('view_builder').classList.remove('hidden');
        }

        function cancelBuilder() {
            document.getElementById('view_builder').classList.add('hidden');
            document.getElementById('view_answering').classList.remove('hidden');
        }

        function addBuilderQuestion() {
            const newId = builderQuestions.length + 1;
            builderQuestions.push({ id: newId, q: "", type: "likert", options: ["گزینه ۱", "گزینه ۲"] });
            renderBuilderQuestions();
        }

        function renderBuilderQuestions() {
            const container = document.getElementById('builderQuestionsList');
            container.innerHTML = '';

            builderQuestions.forEach((q, idx) => {
                const isChoice = q.type === 'choice' || q.type === 'checkbox';
                container.innerHTML += `
                    <div class="aurora-card p-4 rounded-3xl space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-black text-blue-400">سوال شماره ${idx+1}</span>
                            <button onclick="removeBuilderQ(${idx})" class="text-rose-400 text-xs">🗑 حذف</button>
                        </div>
                        <input type="text" value="${q.q}" oninput="builderQuestions[${idx}].q = this.value" class="aurora-input w-full rounded-2xl p-2.5 text-xs font-bold text-slate-100 outline-none" placeholder="متن سوال را بنویسید...">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-[10px] text-slate-400">مدل پاسخ:</span>
                            <select onchange="updateQType(${idx}, this.value)" class="bg-slate-800 text-blue-300 border border-white/10 rounded-xl p-2 text-[11px] font-bold outline-none">
                                <option value="likert" ${q.type==='likert'?'selected':''}>📊 طیف ۵ تایی لیکرت</option>
                                <option value="star" ${q.type==='star'?'selected':''}>⭐ ۵ ستاره</option>
                                <option value="choice" ${q.type==='choice'?'selected':''}>🔘 رادیوباتن تک‌انتخابی</option>
                                <option value="checkbox" ${q.type==='checkbox'?'selected':''}>☑️ چک‌باکس چندانتخابی</option>
                                <option value="text" ${q.type==='text'?'selected':''}>📝 متن تشریحی</option>
                            </select>
                        </div>
                        ${isChoice ? `
                            <div class="space-y-1.5 pt-1">
                                <label class="text-[9px] text-slate-400">گزینه‌ها (با ویرگول جدا کنید):</label>
                                <input type="text" value="${(q.options || []).join(' ، ')}" oninput="builderQuestions[${idx}].options = this.value.split('،').map(x=>x.trim())" class="aurora-input w-full rounded-xl p-2 text-xs font-bold text-indigo-300 outline-none" placeholder="گزینه ۱ ، گزینه ۲ ، گزینه ۳">
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }

        function updateQType(idx, val) {
            builderQuestions[idx].type = val;
            renderBuilderQuestions();
        }

        function removeBuilderQ(idx) {
            builderQuestions.splice(idx, 1);
            renderBuilderQuestions();
        }

        function saveBuilderSurvey() {
            const title = document.getElementById('bldTitle').value.trim();
            const desc = document.getElementById('bldDesc').value.trim();
            if (!title) { showToast("عنوان فرم الزامی است.", "warning"); return; }
            if (builderQuestions.length === 0) { showToast("حداقل یک سوال اضافه کنید.", "warning"); return; }

            const payload = {
                action: "save_dynamic_survey",
                title: title,
                description: desc,
                questions: builderQuestions
            };

            window.Bale.WebApp.sendData(JSON.stringify(payload));
            showToast("فرم با موفقیت ذخیره و در آرشیو اضافه شد.", "success");
            setTimeout(() => window.Bale.WebApp.close(), 150);
        }

        function submitSurveyAnswers() {
            if (!currentSurvey) return;
            const payload = {
                action: "submit_survey_response",
                survey_id: currentSurvey.survey_id || currentSurvey.id || "srv_default",
                answers: answersState
            };
            window.Bale.WebApp.sendData(JSON.stringify(payload));
            showToast("پاسخ‌های شما با موفقیت ثبت شد.", "success");
            setTimeout(() => window.Bale.WebApp.close(), 150);
        }

        function closeApp() { try { window.Bale.WebApp.close(); } catch(e) {} }
        window.Bale.WebApp.ready();
        init();
    </script>
</body>
</html>
