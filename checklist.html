<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انتخاب اعضا</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glass-bottom { background: linear-gradient(to top, rgba(255,255,255,1) 60%, rgba(255,255,255,0.8)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

        /* Custom Checkbox Animation */
        .custom-checkbox:checked + div { background-color: #4f46e5; border-color: #4f46e5; transform: scale(1.05); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .custom-checkbox:checked + div svg { display: block; animation: checkPop 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes checkPop { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        
        .card-selected { border-color: #c7d2fe !important; background-color: #eef2ff !important; }
    </style>
</head>
<body class="flex flex-col h-screen selection:bg-indigo-100 overflow-hidden">

    <!-- VIEW 1: Main List -->
    <div id="mainView" class="flex flex-col h-full fade-in relative">
        <div class="sticky top-0 z-30 glass-header border-b border-slate-200/50 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)]">
            <div class="p-5 flex items-center gap-4">
                <div class="w-12 h-12 rounded-[1.25rem] bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white text-xl shadow-lg shadow-indigo-200/50">
                    📋
                </div>
                <div class="overflow-hidden">
                    <h1 class="text-sm font-black text-slate-800 tracking-tight truncate" id="qTitle">در حال بارگذاری...</h1>
                    <p class="text-[11px] font-bold text-slate-500 mt-0.5 truncate" id="gTitle">گروه: -</p>
                </div>
            </div>
            
            <div class="px-5 pb-4">
                <div class="relative group">
                    <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-slate-400 group-focus-within:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="searchInput" onkeyup="filterMembers()" class="w-full bg-slate-100/80 border-2 border-transparent rounded-2xl py-3.5 pr-11 pl-4 text-sm font-bold text-slate-700 focus:border-indigo-100 focus:bg-white focus:ring-4 focus:ring-indigo-50/50 transition-all outline-none placeholder-slate-400" placeholder="جستجوی نام دستیار...">
                </div>
            </div>
        </div>

        <div class="flex-grow overflow-y-auto px-5 pt-4 pb-32">
            <div id="membersList" class="space-y-3"></div>

            <button onclick="openAddModal()" class="mt-6 w-full bg-indigo-50/50 border-2 border-dashed border-indigo-200 text-indigo-600 hover:bg-indigo-50 font-black p-4 rounded-2xl text-sm transition-all flex justify-center items-center gap-2 active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                افزودن دستیار جدید به این لیست
            </button>
        </div>

        <div class="absolute bottom-0 left-0 right-0 glass-bottom px-5 py-4 pb-6 z-20 border-t border-slate-100">
            <button id="previewBtn" onclick="showPreview()" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-black p-4 rounded-2xl text-sm shadow-xl shadow-indigo-200/60 transition-all active:scale-[0.98] flex justify-between items-center group">
                <span class="flex items-center gap-2">
                    <svg class="w-5 h-5 opacity-80 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    مرور و پیش‌نمایش لیست
                </span>
                <span id="selectedCount" class="bg-white/20 backdrop-blur-sm px-3 py-1 rounded-xl text-xs border border-white/10">0 انتخاب</span>
            </button>
        </div>
    </div>

    <!-- VIEW 2: Preview -->
    <div id="previewView" class="hidden flex flex-col h-full bg-slate-50 fade-in relative">
        <div class="sticky top-0 z-20 glass-header border-b border-slate-200/50 p-5 text-center shadow-sm">
            <div class="w-14 h-14 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-full flex items-center justify-center text-white text-2xl mx-auto mb-3 shadow-lg shadow-emerald-200/50">✅</div>
            <h2 class="text-lg font-black text-slate-800 tracking-tight">پیش‌نمایش لیست نهایی</h2>
            <p class="text-xs font-bold text-slate-500 mt-1">لطفاً اسامی انتخاب شده را بررسی کنید</p>
        </div>

        <div class="flex-grow overflow-y-auto p-5 space-y-4 pb-32">
            <div id="previewList" class="space-y-3"></div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 glass-bottom px-5 py-4 pb-6 z-20 border-t border-slate-100 flex gap-3">
            <button onclick="hidePreview()" class="w-1/3 bg-white border-2 border-slate-200 text-slate-600 font-black p-4 rounded-2xl text-sm active:scale-[0.98] transition-all hover:bg-slate-50">ویرایش</button>
            <button id="submitBtn" onclick="submitData()" class="w-2/3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-black p-4 rounded-2xl text-sm shadow-xl shadow-teal-200/50 active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                تایید و ارسال
            </button>
        </div>
    </div>

    <!-- Modal -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center fade-in">
        <div class="bg-white w-full sm:max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl slide-up">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>
            
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600 text-lg">✏️</div>
                <h3 id="modalTitle" class="text-base font-black text-slate-800">ویرایش دستیار</h3>
            </div>
            
            <input type="hidden" id="modalIndex">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5 ml-1">نام و نام خانوادگی</label>
                    <input type="text" id="modalName" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-indigo-400 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5 ml-1">سال تحصیلی</label>
                    <select id="modalYear" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-indigo-700 outline-none appearance-none">
                        <option value="سال ۱">سال ۱ (R1)</option>
                        <option value="سال ۲">سال ۲ (R2)</option>
                        <option value="سال ۳">سال ۳ (R3)</option>
                        <option value="سال ۴">سال ۴ (R4)</option>
                        <option value="سال ۵">سال ۵ (R5)</option>
                    </select>
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="closeModal()" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-black p-4 rounded-2xl text-sm active:scale-95 transition-all">انصراف</button>
                <button onclick="saveModal()" class="w-2/3 bg-indigo-600 hover:bg-indigo-700 text-white font-black p-4 rounded-2xl text-sm shadow-lg shadow-indigo-200/50 active:scale-95 transition-all">💾 ذخیره</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const r_id = urlParams.get('r_id');
        const f_id = urlParams.get('f_id');
        const idx = urlParams.get('idx');
        
        document.getElementById('qTitle').innerText = decodeURIComponent(urlParams.get('q') || 'انتخاب اعضا');
        document.getElementById('gTitle').innerText = `دپارتمان: ${decodeURIComponent(urlParams.get('g') || '-')}`;

        let members = [];
        try { 
            const rawArray = JSON.parse(decodeURIComponent(urlParams.get('m') || '[]')); 
            members = rawArray.map(m => ({
                id: m[0], name: m[1], year: m[2], selected: m[3] === 1, is_new: m[0] < 0, is_edited: false
            }));
        } catch(e) { console.error(e); }

        function renderMembers(filterText = "") {
            const container = document.getElementById('membersList');
            container.innerHTML = '';
            let selectedCount = 0;

            members.forEach((m, i) => {
                if (m.selected) selectedCount++;
                if (filterText && !m.name.includes(filterText)) return;

                const cardClass = m.selected ? 'card-selected' : 'bg-white border-slate-100';
                let badge = '';
                if (m.is_new) badge = '<span class="bg-emerald-100 text-emerald-600 text-[9px] font-black px-2 py-0.5 rounded-lg ml-2">جدید</span>';
                if (m.is_edited) badge = '<span class="bg-amber-100 text-amber-600 text-[9px] font-black px-2 py-0.5 rounded-lg ml-2">ویرایش شده</span>';

                const card = document.createElement('label');
                card.className = `flex items-center justify-between p-4 rounded-[1.25rem] shadow-sm border cursor-pointer transition-all hover:shadow-md slide-up ${cardClass}`;
                
                card.innerHTML = `
                    <div class="flex items-center gap-4 overflow-hidden">
                        <div class="relative flex items-center justify-center flex-shrink-0">
                            <input type="checkbox" class="custom-checkbox opacity-0 absolute h-0 w-0" ${m.selected ? 'checked' : ''} onchange="toggleSelect(${i}, this.checked)">
                            <div class="w-6 h-6 rounded-lg border-2 border-slate-300 bg-slate-50 flex items-center justify-center transition-all">
                                <svg class="w-3.5 h-3.5 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-100 to-purple-100 text-indigo-600 flex items-center justify-center text-lg font-black border-2 border-white shadow-sm flex-shrink-0">
                                ${m.name.charAt(0)}
                            </div>
                            <div class="overflow-hidden">
                                <p class="text-sm font-black text-slate-800 truncate flex items-center">${m.name} ${badge}</p>
                                <p class="text-[10px] font-bold text-indigo-500 mt-0.5">🎓 ${m.year}</p>
                            </div>
                        </div>
                    </div>
                    <button type="button" onclick="openEditModal(${i}); event.preventDefault();" class="w-9 h-9 rounded-xl bg-slate-50 text-slate-500 flex items-center justify-center text-sm hover:bg-indigo-50 hover:text-indigo-600 hover:scale-105 active:scale-95 transition-all flex-shrink-0">✏️</button>
                `;
                container.appendChild(card);
            });

            document.getElementById('selectedCount').innerText = `${selectedCount} انتخاب`;
        }

        function toggleSelect(index, isChecked) {
            members[index].selected = isChecked;
            renderMembers(document.getElementById('searchInput').value);
        }

        function filterMembers() {
            renderMembers(document.getElementById('searchInput').value);
        }

        function showPreview() {
            const selectedMembers = members.filter(m => m.selected);
            if (selectedMembers.length === 0) { alert("لطفاً حداقل یک دستیار را انتخاب کنید."); return; }

            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('previewView').classList.remove('hidden');

            const container = document.getElementById('previewList');
            container.innerHTML = '';

            selectedMembers.forEach((m, i) => {
                let badge = '';
                if (m.is_new) badge = '<span class="bg-emerald-100 text-emerald-600 text-[9px] font-black px-2 py-0.5 rounded-lg ml-2">جدید</span>';
                if (m.is_edited) badge = '<span class="bg-amber-100 text-amber-600 text-[9px] font-black px-2 py-0.5 rounded-lg ml-2">ویرایش شده</span>';

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-[1.25rem] shadow-sm border border-slate-100 flex items-center gap-4 slide-up">
                        <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-sm font-black border border-indigo-100 flex-shrink-0">${i+1}</div>
                        <div class="overflow-hidden">
                            <p class="text-sm font-black text-slate-800 truncate flex items-center">${m.name} ${badge}</p>
                            <p class="text-[11px] font-bold text-indigo-500 mt-0.5">🎓 ${m.year}</p>
                        </div>
                    </div>
                `;
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hidePreview() {
            document.getElementById('previewView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
        }

        const modal = document.getElementById('editModal');
        
        function openEditModal(index) {
            document.getElementById('modalTitle').innerText = 'ویرایش دستیار';
            document.getElementById('modalIndex').value = index;
            document.getElementById('modalName').value = members[index].name;
            document.getElementById('modalYear').value = members[index].year;
            modal.classList.remove('hidden');
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'افزودن دستیار جدید';
            document.getElementById('modalIndex').value = -1;
            document.getElementById('modalName').value = '';
            document.getElementById('modalYear').value = 'سال ۱';
            modal.classList.remove('hidden');
        }

        function closeModal() { modal.classList.add('hidden'); }

        function saveModal() {
            const index = parseInt(document.getElementById('modalIndex').value);
            const name = document.getElementById('modalName').value.trim();
            const year = document.getElementById('modalYear').value;

            if (!name) { alert("نام نمی‌تواند خالی باشد."); return; }

            if (index === -1) {
                members.push({ id: -1, name: name, year: year, selected: true, is_new: true, is_edited: false });
            } else {
                if (members[index].name !== name || members[index].year !== year) {
                    members[index].name = name;
                    members[index].year = year;
                    if (!members[index].is_new) members[index].is_edited = true;
                }
            }
            
            closeModal();
            renderMembers(document.getElementById('searchInput').value);
        }

        window.Bale.WebApp.ready();

        function submitData() {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> در حال ارسال...';
            btn.classList.add('opacity-90', 'cursor-wait');
            
            const payload = { action: "submit_checklist", r_id: r_id, f_id: f_id, idx: idx, members: members };

            try {
                window.Bale.WebApp.sendData(JSON.stringify(payload));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> تایید و ارسال';
                btn.classList.remove('opacity-90', 'cursor-wait');
                alert("خطا در ارسال اطلاعات.");
            }
        }

        renderMembers();
    </script>
</body>
</html>
