<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انتخاب اعضا</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://tapi.bale.ai/miniapp.js?3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; }
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-checkbox:checked + div { background-color: #4f46e5; border-color: #4f46e5; }
        .custom-checkbox:checked + div svg { display: block; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen selection:bg-indigo-100">

    <div id="mainView" class="flex flex-col h-full fade-in">
        <div class="sticky top-0 z-20 bg-white/90 backdrop-blur-xl border-b border-slate-200/60 p-4 shadow-sm space-y-3">
            <div class="text-center">
                <h1 class="text-sm font-extrabold text-indigo-700" id="qTitle">در حال بارگذاری...</h1>
                <p class="text-[11px] text-slate-500 mt-1" id="gTitle">گروه: -</p>
            </div>
            
            <div class="relative">
                <span class="absolute inset-y-0 right-3 flex items-center text-slate-400">🔍</span>
                <input type="text" id="searchInput" onkeyup="filterMembers()" class="w-full bg-slate-100 border-none rounded-xl py-2.5 pr-9 pl-3 text-sm font-bold text-slate-700 focus:ring-2 focus:ring-indigo-400 focus:bg-white transition-all placeholder-slate-400" placeholder="جستجوی نام دستیار...">
            </div>
        </div>

        <div class="flex-grow overflow-y-auto p-4 pb-32">
            <div id="membersList" class="space-y-3"></div>

            <button onclick="openAddModal()" class="mt-5 w-full bg-indigo-50/50 border-2 border-dashed border-indigo-200 text-indigo-600 hover:bg-indigo-50 font-bold p-3.5 rounded-2xl text-sm transition-all flex justify-center items-center gap-2 active:scale-95">
                ➕ افزودن دستیار جدید به این لیست
            </button>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg p-4 border-t border-slate-200/60 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
            <button id="previewBtn" onclick="showPreview()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-4 rounded-2xl text-sm shadow-lg shadow-indigo-200/50 transition-all active:scale-[0.98] flex justify-between items-center">
                <span>👁️ مرور و پیش‌نمایش لیست</span>
                <span id="selectedCount" class="bg-white/20 px-2.5 py-0.5 rounded-lg text-xs">0 انتخاب</span>
            </button>
        </div>
    </div>

    <div id="previewView" class="hidden flex flex-col h-full bg-slate-100 fade-in">
        <div class="flex-grow overflow-y-auto p-5 space-y-4 pb-32">
            <div class="text-center mb-6 mt-4">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-3 shadow-inner border border-indigo-200">📋</div>
                <h2 class="text-lg font-extrabold text-slate-800">پیش‌نمایش لیست نهایی</h2>
                <p class="text-xs text-slate-500 mt-1">لطفاً اسامی انتخاب شده را بررسی کنید.</p>
            </div>
            <div id="previewList" class="space-y-2"></div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 bg-white p-4 border-t border-slate-200 shadow-[0_-10px_20px_rgba(0,0,0,0.03)] flex gap-3">
            <button onclick="hidePreview()" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold p-4 rounded-2xl text-sm transition-all active:scale-[0.98]">✏️ ویرایش</button>
            <button id="submitBtn" onclick="submitData()" class="w-2/3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold p-4 rounded-2xl text-sm shadow-lg shadow-teal-200/50 transition-all active:scale-[0.98] flex justify-center gap-2 items-center">📤 تایید و ارسال</button>
        </div>
    </div>

    <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 fade-in">
        <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl">
            <h3 id="modalTitle" class="text-sm font-extrabold text-slate-800 mb-4">ویرایش دستیار</h3>
            <input type="hidden" id="modalIndex">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 ml-1">نام و نام خانوادگی</label>
                    <input type="text" id="modalName" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-400 font-bold text-slate-700">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1.5 ml-1">سال دستیاری</label>
                    <select id="modalYear" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-400 font-bold text-slate-700 appearance-none">
                        <option value="سال ۱">سال ۱</option>
                        <option value="سال ۲">سال ۲</option>
                        <option value="سال ۳">سال ۳</option>
                        <option value="سال ۴">سال ۴</option>
                        <option value="سال ۵">سال ۵</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-6 flex gap-3">
                <button onclick="closeModal()" class="w-1/3 bg-slate-100 text-slate-600 font-bold p-3 rounded-xl text-sm active:scale-95">انصراف</button>
                <button onclick="saveModal()" class="w-2/3 bg-indigo-600 text-white font-bold p-3 rounded-xl text-sm shadow-md shadow-indigo-200 active:scale-95">💾 ذخیره</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const r_id = urlParams.get('r_id');
        const f_id = urlParams.get('f_id');
        const idx = urlParams.get('idx');
        
        let data = {};
        try {
            const compressedData = urlParams.get('d');
            if (compressedData) {
                const binaryString = window.atob(compressedData.replace(/-/g, '+').replace(/_/g, '/'));
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                const decompressed = pako.inflate(bytes, { to: 'string' });
                data = JSON.parse(decompressed);
            }
        } catch(e) { console.error(e); }

        document.getElementById('qTitle').innerText = data.q || 'انتخاب اعضا';
        document.getElementById('gTitle').innerText = `دپارتمان: ${data.g || '-'}`;

        let members = [];
        try { 
            const rawArray = data.m || []; 
            members = rawArray.map(m => ({
                id: m[0], name: m[1], year: m[2], selected: m[3] === 1, is_new: m[0] < 0, is_edited: false
            }));
        } catch(e) { console.error(e); }

        function renderMembers(filterText = "") {
            const container = document.getElementById('membersList');
            container.innerHTML = '';
            let selectedCount = 0;

            members.forEach((m, i) => {
                if (m.selected) selectedCount++;
                if (filterText && !m.name.includes(filterText)) return;

                const card = document.createElement('label');
                card.className = "flex items-center justify-between bg-white p-3 rounded-2xl shadow-[0_2px_8px_rgb(0,0,0,0.02)] border border-slate-100 cursor-pointer fade-in";
                
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="relative flex items-center justify-center">
                            <input type="checkbox" class="custom-checkbox opacity-0 absolute h-0 w-0" ${m.selected ? 'checked' : ''} onchange="toggleSelect(${i}, this.checked)">
                            <div class="w-6 h-6 rounded-lg border-2 border-slate-300 bg-slate-50 flex items-center justify-center transition-all">
                                <svg class="w-3.5 h-3.5 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                        </div>
                        <div>
                            <p class="text-sm font-extrabold text-slate-700">${m.name}</p>
                            <p class="text-[10px] font-bold text-slate-400 mt-0.5 flex items-center gap-1">
                                🎓 ${m.year} ${m.is_new ? '<span class="text-emerald-500">(جدید)</span>' : ''} ${m.is_edited ? '<span class="text-amber-500">(ویرایش شده)</span>' : ''}
                            </p>
                        </div>
                    </div>
                    <button type="button" onclick="openEditModal(${i}); event.preventDefault();" class="w-8 h-8 flex items-center justify-center bg-slate-50 text-slate-400 hover:text-indigo-500 hover:bg-indigo-50 rounded-xl transition-colors">✏️</button>
                `;
                container.appendChild(card);
            });

            document.getElementById('selectedCount').innerText = `${selectedCount} انتخاب`;
        }

        function toggleSelect(index, isChecked) {
            members[index].selected = isChecked;
            renderMembers(document.getElementById('searchInput').value);
        }

        function filterMembers() { renderMembers(document.getElementById('searchInput').value); }

        function showPreview() {
            const selectedMembers = members.filter(m => m.selected);
            if (selectedMembers.length === 0) { alert("لطفاً حداقل یک دستیار را انتخاب کنید."); return; }
            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('previewView').classList.remove('hidden');
            const container = document.getElementById('previewList');
            container.innerHTML = '';
            selectedMembers.forEach((m, i) => {
                const tags = [];
                if (m.is_new) tags.push('<span class="text-[10px] bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded-md">جدید</span>');
                if (m.is_edited) tags.push('<span class="text-[10px] bg-amber-100 text-amber-600 px-2 py-0.5 rounded-md">ویرایش شده</span>');
                const card = document.createElement('div');
                card.className = "bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center slide-up";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs font-bold border border-indigo-100">${i+1}</div>
                        <div>
                            <p class="text-sm font-extrabold text-slate-700">${m.name} ${tags.join(' ')}</p>
                            <p class="text-xs font-bold text-slate-400 mt-0.5">🎓 ${m.year}</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hidePreview() {
            document.getElementById('previewView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
        }

        const modal = document.getElementById('editModal');
        function openEditModal(index) {
            document.getElementById('modalTitle').innerText = 'ویرایش دستیار';
            document.getElementById('modalIndex').value = index;
            document.getElementById('modalName').value = members[index].name;
            document.getElementById('modalYear').value = members[index].year;
            modal.classList.remove('hidden');
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'افزودن دستیار جدید';
            document.getElementById('modalIndex').value = -1;
            document.getElementById('modalName').value = '';
            document.getElementById('modalYear').value = 'سال ۱';
            modal.classList.remove('hidden');
        }

        function closeModal() { modal.classList.add('hidden'); }

        function saveModal() {
            const index = parseInt(document.getElementById('modalIndex').value);
            const name = document.getElementById('modalName').value.trim();
            const year = document.getElementById('modalYear').value;
            if (!name) { alert("نام نمی‌تواند خالی باشد."); return; }

            if (index === -1) {
                members.push({ id: -1, name: name, year: year, selected: true, is_new: true, is_edited: false });
            } else {
                if (members[index].name !== name || members[index].year !== year) {
                    members[index].name = name;
                    members[index].year = year;
                    if (!members[index].is_new) members[index].is_edited = true;
                }
            }
            closeModal();
            renderMembers(document.getElementById('searchInput').value);
        }

        window.Bale.WebApp.ready();

        function submitData() {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '⏳ در حال ارسال...';
            btn.classList.add('opacity-90', 'cursor-wait');
            
            const payload = { action: "submit_checklist", r_id: r_id, f_id: f_id, idx: idx, members: members };
            try {
                window.Bale.WebApp.sendData(JSON.stringify(payload));
                setTimeout(() => window.Bale.WebApp.close(), 150);
            } catch (error) {
                btn.innerHTML = '📤 تایید و ارسال';
                btn.classList.remove('opacity-90', 'cursor-wait');
                alert("خطا در ارسال اطلاعات.");
            }
        }

        renderMembers();
    </script>
</body>
</html>
