<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>گزارش نظرسنجی‌های من</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://tapi.bale.ai/miniapp.js?3"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
body{font-family:Vazirmatn,sans-serif;background:#020617;color:#e2e8f0;-webkit-font-smoothing:antialiased}
.card{background:linear-gradient(145deg,rgba(15,23,42,.9),rgba(2,6,23,.96));border:1px solid rgba(148,163,184,.13);backdrop-filter:blur(18px)}
.soft{background:rgba(15,23,42,.62);border:1px solid rgba(148,163,184,.12)}
.inp{background:rgba(15,23,42,.8);border:1px solid rgba(148,163,184,.18)}
.progress{height:7px;background:rgba(148,163,184,.12);border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#10b981);border-radius:999px}
</style>
</head>
<body class="min-h-screen overflow-x-hidden">
<header class="sticky top-0 z-20 bg-slate-950/90 backdrop-blur-2xl border-b border-white/[.06] p-4">
  <div class="max-w-2xl mx-auto"><h1 class="text-sm font-black text-white">📈 گزارش نظرسنجی‌های من</h1><p class="text-[10px] text-slate-400 mt-1">فقط نظرسنجی‌هایی که همین حساب ساخته است نمایش داده می‌شود.</p></div>
</header>
<main class="max-w-2xl mx-auto p-4 pb-10 space-y-4">
  <div class="card rounded-3xl p-4 border border-amber-400/20 bg-amber-500/[.03]"><p class="text-[10px] text-amber-100/80 leading-6">🔐 سؤال‌ها و پاسخ‌ها فقط در اختیار سازنده هستند. مقامات در داشبوردهای مدیریتی فقط آمار مشارکت را می‌بینند. اشتراک Excel یک ارسال یک‌باره است و دسترسی دائمی ایجاد نمی‌کند.</p></div>
  <div id="list" class="space-y-3"></div>
</main>
<div id="shareModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm p-4 items-center justify-center">
  <div class="card w-full max-w-sm rounded-3xl p-5">
    <div class="text-center text-3xl mb-3">📤</div>
    <h3 class="text-sm font-black text-white text-center">تأیید اشتراک‌گذاری Excel</h3>
    <p id="shareModalText" class="text-[10px] text-slate-400 text-center leading-6 mt-2"></p>
    <div class="grid grid-cols-2 gap-2 mt-4"><button id="shareCancel" type="button" class="soft rounded-2xl p-3 text-[10px] font-black">انصراف</button><button id="shareConfirm" type="button" class="bg-emerald-600 text-white rounded-2xl p-3 text-[10px] font-black">✅ ارسال فایل</button></div>
  </div>
</div>
<script>
let DATA={},pendingShare=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fa(v){return String(v??0).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[+d])}
function load(){try{const p=new URLSearchParams(location.search).get('d');if(p){const b=atob(p.replace(/-/g,'+').replace(/_/g,'/'));const a=Uint8Array.from(b,c=>c.charCodeAt(0));DATA=JSON.parse(pako.inflate(a,{to:'string'}));}}catch(e){console.error(e)}render();try{window.Bale.WebApp.ready()}catch(e){}}
function render(){const box=$('list'),surveys=DATA.surveys||[],officials=DATA.officials||[];box.innerHTML='';if(!surveys.length){box.innerHTML='<div class="card rounded-3xl p-5 text-center text-xs text-slate-400">هنوز نظرسنجی‌ای برای این حساب ثبت نشده است.</div>';return}
  surveys.forEach((s,idx)=>{const rate=Math.max(0,Math.min(100,Number(s.rate||0)));const options=officials.map(o=>`<option value="${esc(o.id)}">${esc(o.name)} — ${esc(o.role)}</option>`).join('');const groups=(s.groups||[]).join('، ')||'همه گروه‌ها';const el=document.createElement('section');el.className='card rounded-3xl p-4 space-y-3';el.innerHTML=`
    <div class="flex items-start justify-between gap-3"><div class="min-w-0"><div class="text-[9px] text-violet-300">🏢 ${esc(s.source)}</div><h2 class="text-xs font-black text-white mt-1 leading-6">${esc(s.title)}</h2><div class="text-[9px] text-slate-400 mt-1">🎯 ${esc(s.audience)} • ${esc(s.status)} • ${fa(s.question_count)} سؤال</div></div><span class="soft rounded-full px-2.5 py-1 text-[9px] shrink-0">${fa(s.rate)}٪</span></div>
    <div class="grid grid-cols-2 gap-2"><div class="soft rounded-2xl p-3"><div class="text-[8px] text-slate-500">مخاطبان</div><div class="text-lg font-black text-white mt-1">${fa(s.expected)}</div></div><div class="soft rounded-2xl p-3"><div class="text-[8px] text-slate-500">پاسخ‌دهندگان</div><div class="text-lg font-black text-emerald-300 mt-1">${fa(s.responded)}</div></div></div>
    <div><div class="flex justify-between text-[9px] text-slate-400 mb-1"><span>نرخ مشارکت</span><span>${fa(s.responded)} از ${fa(s.expected)}</span></div><div class="progress"><i style="width:${rate}%"></i></div></div>
    <div class="soft rounded-2xl p-3 text-[9px] text-slate-400 leading-5"><div>👥 گروه‌ها: <span class="text-slate-200">${esc(groups)}</span></div><div>⏳ مهلت: <span class="text-slate-200">${esc(s.deadline)}</span></div><div>🕒 ایجاد: <span class="text-slate-200">${esc(s.created_at)}</span></div><div>🔒 نوع پاسخ: <span class="text-slate-200">${s.anonymous?'ناشناس':'با هویت'}</span></div></div>
    <button type="button" data-export="${esc(s.id)}" class="w-full bg-blue-600 text-white rounded-2xl p-3 text-[10px] font-black">📥 دریافت Excel کامل برای خودم</button>
    <label class="soft rounded-2xl p-3 flex items-start gap-3 text-[10px]"><input type="checkbox" data-share-toggle="${idx}" class="mt-1"><span><b class="text-white">📤 اشتراک‌گذاری خروجی</b><small class="block text-[9px] text-slate-400 mt-1 leading-5">با فعال‌کردن این گزینه، فقط فایل Excel همین نظرسنجی برای مقام انتخاب‌شده ارسال می‌شود.</small></span></label>
    <div id="share_${idx}" class="hidden space-y-2"><select data-recipient="${idx}" class="inp w-full rounded-2xl p-3 text-[10px]"><option value="">انتخاب مقام...</option>${options}</select><button type="button" data-share="${esc(s.id)}" data-idx="${idx}" class="w-full bg-emerald-600 text-white rounded-2xl p-3 text-[10px] font-black ${officials.length?'':'opacity-50 cursor-not-allowed'}" ${officials.length?'':'disabled'}>📤 ارسال Excel برای مقام انتخاب‌شده</button></div>`;box.appendChild(el)})
  box.querySelectorAll('[data-share-toggle]').forEach(ch=>ch.addEventListener('change',()=>{const d=document.getElementById('share_'+ch.dataset.shareToggle);d.classList.toggle('hidden',!ch.checked)}));
  box.querySelectorAll('[data-export]').forEach(btn=>btn.addEventListener('click',()=>send({action:'survey_export_owner',survey_id:btn.dataset.export})));
  box.querySelectorAll('[data-share]').forEach(btn=>btn.addEventListener('click',()=>{const sel=box.querySelector(`[data-recipient="${btn.dataset.idx}"]`);if(!sel||!sel.value){alert('لطفاً یکی از مقامات را انتخاب کنید.');return}const survey=surveys.find(x=>String(x.id)===String(btn.dataset.share));const official=officials.find(x=>String(x.id)===String(sel.value));pendingShare={action:'survey_share_excel',survey_id:btn.dataset.share,recipient_id:sel.value};$('shareModalText').innerText=`خروجی کامل «${survey?.title||'نظرسنجی'}» برای ${official?.name||'مقام انتخاب‌شده'} ارسال شود؟ این عملیات فقط یک فایل می‌فرستد و دسترسی دائمی ایجاد نمی‌کند.`;$('shareModal').classList.remove('hidden');$('shareModal').classList.add('flex')}));
}
function closeShareModal(){pendingShare=null;$('shareModal').classList.add('hidden');$('shareModal').classList.remove('flex')}
$('shareCancel').addEventListener('click',closeShareModal);$('shareConfirm').addEventListener('click',()=>{if(!pendingShare)return;const x=pendingShare;closeShareModal();send(x)});$('shareModal').addEventListener('click',e=>{if(e.target===$('shareModal'))closeShareModal()});
function send(obj){try{window.Bale.WebApp.sendData(JSON.stringify(obj))}catch(e){alert('ارسال درخواست ناموفق بود. دوباره تلاش کنید.')}}
load();
</script>
</body>
</html>
